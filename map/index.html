<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <title>Lango Map</title>
  <link rel="stylesheet" href="/assets/page-motion.css">
  <script src="/assets/page-motion.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: only light;
      font-family: "Baloo 2", system-ui, sans-serif;
      background: #1b0e05;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #1b0e05; }

    button { font: inherit; }

    .map-page {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #1b0e05;
    }

    .map-scene {
      position: relative;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      overflow: hidden;
      isolation: isolate;
      background: #74bdf1;
    }

    .map-background,
    .map-frame,
    .map-title {
      position: absolute;
      user-select: none;
      pointer-events: none;
    }

    .map-background {
      inset: 4.8% 4.5% 5.3%;
      z-index: 0;
      width: 91%;
      height: 89.9%;
      object-fit: cover;
    }

    .map-frame {
      z-index: 30;
      inset: 0;
      background:
        url('/assets/lango-home/upside.png') left top / 100% 8.28% no-repeat,
        url('/assets/lango-home/downside.png') left bottom / 100% 8.28% no-repeat,
        url('/assets/lango-home/leftside.png') left top / 4.83% 100% no-repeat,
        url('/assets/lango-home/rightside.png') right top / 4.83% 100% no-repeat;
    }

    .map-title {
      z-index: 40;
      top: -1.1%;
      left: 29.5%;
      width: 41.2%;
      height: 13.2%;
      object-fit: contain;
    }

    .map-return,
    .location-hotspot {
      position: absolute;
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .map-return {
      z-index: 40;
      top: 7.7%;
      left: 5.8%;
      width: 16.5%;
      height: 7.7%;
      border-radius: 999px;
    }

    .map-return img,
    .location-hotspot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .location-hotspot[data-locked="true"] img {
      filter: grayscale(1) brightness(.72) contrast(.9);
      opacity: .86;
    }

    .location-hotspot {
      z-index: 10;
      isolation: isolate;
      border-radius: 18%;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .map-return:hover,
    .location-hotspot:not(:disabled):hover { filter: brightness(1.08); }

    .location-hotspot:not(:disabled):hover { transform: translateY(-1.5%); }
    .map-return:active,
    .location-hotspot:not(:disabled):active { transform: scale(.97); }

    .map-return:focus-visible,
    .location-hotspot:focus-visible {
      outline: max(3px, .32cqw) solid #fff7a8;
      outline-offset: max(2px, .22cqw);
    }

    .location-hotspot--home { top: 13%; left: 19.8%; width: 18.1%; height: 28%; }
    .location-hotspot--school { top: 13%; left: 64%; width: 21.2%; height: 29%; }
    .location-hotspot--mall { top: 35%; left: 36%; width: 27%; height: 29%; }
    .location-hotspot--park { top: 57%; left: 16.5%; width: 21%; height: 29%; }
    .location-hotspot--beach { top: 62%; left: 56%; width: 29%; height: 24%; }

    .location-hotspot[data-locked="true"]::after {
      content: "🔒";
      position: absolute;
      top: 48%;
      left: 50%;
      display: grid;
      place-items: center;
      width: clamp(34px, 4.8cqw, 66px);
      aspect-ratio: 1;
      border: clamp(2px, .25cqw, 4px) solid #ffd75f;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(#a55217, #71300e);
      box-shadow: 0 .45cqw .7cqw rgba(67, 24, 3, .38), inset 0 0 0 .24cqw #e78d2b;
      font-size: clamp(17px, 2.25cqw, 31px);
      line-height: 1;
    }

    .location-hotspot[data-unlocking="true"] {
      pointer-events: none;
      z-index: 20;
    }

    .location-hotspot[data-unlocking="true"] > .location-image {
      position: relative;
      z-index: 1;
      animation: location-locked-layer-out .7s ease-out .04s both;
      will-change: opacity, transform;
    }

    .location-hotspot .location-unlock-colour-layer {
      position: absolute;
      z-index: 2;
      inset: 0;
      filter: none !important;
      opacity: 0;
      clip-path: circle(0 at 50% 50%);
    }

    .location-hotspot[data-unlocking="true"] > .location-unlock-colour-layer {
      animation: location-colour-layer-in .76s cubic-bezier(.16,.82,.22,1) .38s both;
      will-change: opacity, transform, clip-path;
    }

    .location-hotspot[data-unlocking="true"]::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 10%;
      border: max(4px, .5cqw) solid #fff5a4;
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 1.4cqw #fff37a, 0 0 2.6cqw rgba(255, 174, 39, .75);
      animation: location-unlock-glow .82s ease-out .28s both;
      pointer-events: none;
    }

    .location-hotspot[data-unlocking="true"]::after {
      z-index: 5;
      animation: location-lock-release .42s cubic-bezier(.16,.82,.22,1.2) .18s both;
    }

    .location-unlock-sparks {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: visible;
      pointer-events: none;
    }

    .location-unlock-spark {
      position: absolute;
      top: 48%;
      left: 50%;
      width: clamp(7px, .85cqw, 13px);
      aspect-ratio: 1;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.2) rotate(0);
      background: #ffe96d;
      clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 94%,50% 72%,21% 94%,32% 57%,2% 35%,39% 35%);
      filter: drop-shadow(0 0 .35cqw #ff9f1c);
      animation: location-unlock-spark .58s ease-out calc(.34s + var(--spark-delay)) both;
      will-change: opacity, transform;
    }

    .location-unlock-spark:nth-child(even) {
      width: clamp(5px, .62cqw, 10px);
      background: #fffbd0;
    }

    .unlock-backdrop {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 5%;
      background: rgba(43, 20, 8, .56);
      backdrop-filter: blur(4px);
      animation: fade-in 160ms ease both;
    }

    .unlock-card {
      width: min(88%, 520px);
      padding: clamp(22px, 3.2cqw, 44px);
      border: clamp(5px, .65cqw, 9px) solid #ffca3d;
      border-radius: clamp(22px, 3cqw, 40px);
      background: linear-gradient(180deg, #f39122 0%, #bd5b16 100%);
      color: #fff7cf;
      text-align: center;
      box-shadow: inset 0 0 0 clamp(3px, .35cqw, 5px) #7e310a, 0 18px 45px rgba(53, 19, 2, .45);
      animation: card-in 220ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .unlock-card h1 {
      margin: 0;
      color: #fff7c6;
      font-size: clamp(30px, 4cqw, 55px);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 .18cqw 0 #6e2b0b;
    }

    .unlock-card p {
      margin: .7em 0 1.1em;
      font-size: clamp(16px, 1.7cqw, 24px);
      font-weight: 700;
      line-height: 1.25;
    }

    .unlock-actions {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 1.4cqw, 20px);
    }

    .unlock-actions button {
      min-width: 38%;
      padding: .55em 1.1em;
      border: 4px solid #6f2a09;
      border-radius: 999px;
      color: #fff8d8;
      font-size: clamp(17px, 1.8cqw, 25px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .22), 0 5px 0 #692707;
    }

    .unlock-cancel { background: #91501f; }
    .unlock-confirm { background: linear-gradient(#7bc94b, #3e942b); }
    .unlock-actions button:active { transform: translateY(3px); box-shadow: inset 0 0 0 3px rgba(255,255,255,.18), 0 2px 0 #692707; }
    .unlock-actions button:focus-visible { outline: 4px solid #fff7a8; outline-offset: 3px; }

    .map-toast {
      position: absolute;
      z-index: 50;
      left: 50%;
      bottom: 5%;
      max-width: 80%;
      padding: .55em 1.25em;
      border: 4px solid #ffd153;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(111, 46, 12, .95);
      color: #fff7cc;
      box-shadow: 0 8px 20px rgba(61, 21, 3, .38);
      font-size: clamp(15px, 1.7cqw, 23px);
      font-weight: 800;
      white-space: nowrap;
      animation: toast-in 180ms ease both;
    }

    @keyframes fade-in { from { opacity: 0; } }
    @keyframes card-in { from { opacity: 0; transform: translateY(5%) scale(.94); } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 30%); } }
    @keyframes location-locked-layer-out {
      0%, 16% { opacity: .86; transform: translateX(0) scale(.98); }
      23% { transform: translateX(-1.8%) scale(.98); }
      30% { transform: translateX(1.8%) scale(.98); }
      37% { transform: translateX(-1%) scale(.98); }
      45% { opacity: .86; transform: translateX(0) scale(.98); }
      100% { opacity: 0; transform: scale(1.055); }
    }
    @keyframes location-colour-layer-in {
      0% { opacity: 0; clip-path: circle(0 at 50% 50%); transform: scale(.94); }
      28% { opacity: 1; }
      72% { clip-path: circle(80% at 50% 50%); transform: scale(1.065); }
      100% { opacity: 1; clip-path: circle(80% at 50% 50%); transform: scale(1); }
    }
    @keyframes location-unlock-glow {
      0% { opacity: 0; transform: scale(.35); }
      38% { opacity: 1; transform: scale(.82); }
      62% { opacity: .9; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.62); }
    }
    @keyframes location-lock-release {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
      48% { opacity: 1; transform: translate(-50%, -64%) scale(1.24) rotate(-10deg); }
      100% { opacity: 0; transform: translate(-50%, -125%) scale(.35) rotate(22deg); }
    }
    @keyframes location-unlock-spark {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(0); }
      25% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--spark-x)), calc(-50% + var(--spark-y))) scale(.72) rotate(170deg);
      }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      .map-page::before {
        content: "Rotate your device to explore the map";
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #1b0e05;
        color: #fff7cc;
        font-size: 1.25rem;
        font-weight: 800;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    (() => {
      const e = React.createElement;
      const STORAGE_KEY = 'lango.systemUnlockedLocations';
      const soundEffects = Object.freeze({
        next: { src: '/assets/sfx/ui-next.mp3', volume: 0.68 },
        back: { src: '/assets/sfx/ui-back.mp3', volume: 0.68 },
        unlocked: { src: '/assets/sfx/power-up.mp3', volume: 0.78 },
        locked: { src: '/assets/sfx/weakness.mp3', volume: 0.72 }
      });
      const activeSounds = new Set();

      const playSound = (name) => {
        const effect = soundEffects[name];
        if (!effect) return;
        const audio = new Audio(effect.src);
        audio.preload = 'auto';
        audio.volume = effect.volume;
        activeSounds.add(audio);
        const cleanup = () => activeSounds.delete(audio);
        audio.addEventListener('ended', cleanup, { once: true });
        audio.play().catch((error) => {
          console.warn(`[map sfx] Could not play "${name}"`, error);
          cleanup();
        });
      };

      const locations = [
        { id: 'home', position: 'home', label: 'Home', image: 'location-home.png', unlocked: true },
        { id: 'school', position: 'school', label: 'School', image: 'location-school.png' },
        { id: 'mall', position: 'mall', label: 'Shopping Mall', image: 'location-shopping-mall.png' },
        { id: 'park', position: 'park', label: 'Park', image: 'location-park.png' },
        { id: 'beach', position: 'beach', label: 'Beach', image: 'location-beach.png' }
      ];

      const loadUnlocked = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          // Day 5 previously wrote "park" even though the intended reward is
          // the top-right School. Migrate and persist that stale browser state.
          const migrated = saved.map((id) => id === 'park' ? 'school' : id);
          if (migrated.some((id, index) => id !== saved[index])) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify([...new Set(migrated)]));
          }
          return new Set(['home', ...migrated]);
        } catch {
          return new Set(['home']);
        }
      };

      function LockedDialog({ location, onClose }) {
        React.useEffect(() => {
          const onKeyDown = (event) => event.key === 'Escape' && onClose();
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [onClose]);

        return e('div', {
          className: 'unlock-backdrop',
          onMouseDown: (event) => event.target === event.currentTarget && onClose()
        },
          e('section', {
            className: 'unlock-card',
            role: 'dialog',
            'aria-modal': 'true',
            'aria-labelledby': 'locked-title'
          },
            e('h1', { id: 'locked-title' }, `${location.label} is locked`),
            e('p', null, 'Keep learning to unlock this location.'),
            e('div', { className: 'unlock-actions' },
              e('button', { type: 'button', className: 'unlock-cancel', autoFocus: true, onClick: onClose }, 'Got it')
            )
          )
        );
      }

      function MapPage() {
        const mapParams = React.useMemo(() => new URLSearchParams(window.location.search), []);
        const returnToRewards = mapParams.get('return') === 'rewards';
        const previewMode = mapParams.get('preview') === '1';
        const requestedUnlock = mapParams.get('unlock');
        const [unlocked] = React.useState(() => {
          const saved = loadUnlocked();
          // A direct preview URL can exercise the one-time unlock animation
          // without changing real student progress.
          if (previewMode && requestedUnlock) saved.add(requestedUnlock);
          return saved;
        });
        const [unlockingLocation, setUnlockingLocation] = React.useState(
          requestedUnlock && unlocked.has(requestedUnlock) ? requestedUnlock : null
        );
        const [lockedNotice, setLockedNotice] = React.useState(null);
        const [toast, setToast] = React.useState('');
        const toastTimer = React.useRef(null);

        React.useEffect(() => {
          if (!unlockingLocation) return () => clearTimeout(toastTimer.current);
          const location = locations.find((item) => item.id === unlockingLocation);
          const cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('unlock');
          window.history.replaceState({}, '', `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
          const unlockTimer = setTimeout(() => {
            setUnlockingLocation(null);
            playSound('unlocked');
            announce(`${location?.label || 'Location'} unlocked!`);
          }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 60 : 1200);
          return () => {
            clearTimeout(unlockTimer);
            clearTimeout(toastTimer.current);
          };
        }, []);

        const announce = (message) => {
          setToast(message);
          clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(''), 1800);
        };

        const chooseLocation = (location) => {
          if (!unlocked.has(location.id)) {
            playSound('locked');
            setLockedNotice(location);
            return;
          }
          playSound('unlocked');
          announce(`${location.label} is unlocked!`);
        };

        const closeLockedNotice = () => {
          playSound('back');
          setLockedNotice(null);
        };

        const leaveMap = () => {
          playSound('back');
          const destination = returnToRewards
            ? (previewMode
              ? '/?preview=1&screen=rewards&openRewards=1&resumeRewards=1'
              : '/?openRewards=1')
            : '/';
          setTimeout(() => { window.location.href = destination; }, 180);
        };

        return e('main', { className: 'map-page' },
          e('section', { className: 'map-scene', 'data-node-id': '799:32', 'aria-label': 'Lango location map' },
            e('img', { className: 'map-background', src: '/assets/map/background.png', alt: '', draggable: false }),
            e('div', { className: 'map-frame', 'aria-hidden': true }),
            e('img', { className: 'map-title', src: '/assets/map/side-panel.png', alt: 'Map', draggable: false }),
            e('button', { type: 'button', className: 'map-return', 'aria-label': returnToRewards ? 'Return to rewards' : 'Return home', onClick: leaveMap },
              e('img', { src: '/assets/map/home-button.png', alt: '', draggable: false })
            ),
            ...locations.map((location) => e('button', {
              key: location.id,
              type: 'button',
              className: `location-hotspot location-hotspot--${location.position}`,
              'data-locked': String(!unlocked.has(location.id) || unlockingLocation === location.id),
              'data-unlocking': String(unlockingLocation === location.id),
              'aria-label': unlockingLocation === location.id
                ? `${location.label}, unlocking`
                : unlocked.has(location.id) ? `${location.label}, unlocked` : `${location.label}, locked`,
              disabled: unlockingLocation === location.id,
              onClick: () => chooseLocation(location)
            },
              e('img', { className: 'location-image', src: `/assets/map/${location.image}`, alt: '', draggable: false }),
              unlockingLocation === location.id && e('img', {
                className: 'location-unlock-colour-layer',
                src: `/assets/map/${location.image}`,
                alt: '',
                'aria-hidden': true,
                draggable: false
              }),
              unlockingLocation === location.id && e('span', { className: 'location-unlock-sparks', 'aria-hidden': true },
                ...[
                  ['0cqw', '-8cqh', '0s'],
                  ['6cqw', '-5.5cqh', '.02s'],
                  ['8cqw', '0cqh', '.05s'],
                  ['6cqw', '5.5cqh', '.03s'],
                  ['0cqw', '8cqh', '.07s'],
                  ['-6cqw', '5.5cqh', '.04s'],
                  ['-8cqw', '0cqh', '.06s'],
                  ['-6cqw', '-5.5cqh', '.01s'],
                ].map(([x, y, delay], index) => e('span', {
                  key: index,
                  className: 'location-unlock-spark',
                  style: { '--spark-x': x, '--spark-y': y, '--spark-delay': delay }
                }))
              )
            )),
            toast && e('div', { className: 'map-toast', role: 'status' }, toast),
            lockedNotice && e(LockedDialog, { location: lockedNotice, onClose: closeLockedNotice })
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(MapPage));
    })();
  </script>
</body>
</html>
