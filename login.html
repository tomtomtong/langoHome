<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Uncle Tommy</title>
  <link rel="stylesheet" href="/assets/page-motion.css">
  <script src="/assets/page-motion.js"></script>
  <link rel="preload" href="/langoLogo.jpeg" as="image">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaed;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      width: min(100%, 400px);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      background: #1a1d27;
      border: 1px solid #2a2f3d;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .logo-wrap img {
      width: min(60vw, 200px);
      height: auto;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 1.75rem;
      font-size: 0.9rem;
      color: #9aa0a6;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: #bdc1c6;
    }

    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1rem;
      border: 1px solid #3c4048;
      border-radius: 8px;
      background: #0f1117;
      color: #e8eaed;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #6c8cff;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.5rem;
      border: none;
      border-radius: 8px;
      background: #6c8cff;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) {
      background: #5a7aef;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      background: rgba(234, 67, 53, 0.12);
      border: 1px solid rgba(234, 67, 53, 0.35);
      color: #f28b82;
      font-size: 0.9rem;
      text-align: center;
    }

    .error.visible {
      display: block;
    }

    .guest-links {
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid #2a2f3d;
    }

    .guest-links h2 {
      margin: 0 0 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    .guest-links p {
      margin: 0 0 1rem;
      font-size: 0.82rem;
      color: #9aa0a6;
      text-align: center;
      line-height: 1.45;
    }

    .guest-links ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }

    .guest-links a {
      display: block;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #3c4048;
      background: #0f1117;
      color: #c4c7ce;
      font-size: 0.9rem;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .guest-links a:hover {
      border-color: #6c8cff;
      color: #e8eaed;
      background: rgba(108, 140, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-wrap">
      <img src="/langoLogo.jpeg" alt="Lango" width="200" height="200" decoding="async">
    </div>
    <h1>Welcome</h1>
    <p class="subtitle">Sign in with your learner account (demo, or user01–user20)</p>

    <div id="error" class="error" role="alert"></div>

    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" id="submit-btn">Sign in</button>
    </form>

    <section class="guest-links" aria-label="Browse without signing in">
      <h2>Browse without signing in</h2>
      <p>Open these pages directly — no login required.</p>
      <ul>
        <li><a href="/preview">Home preview</a></li>
        <li><a href="/preview/map">Map</a></li>
        <li><a href="/preview/wordchop">Word Chop</a></li>
        <li><a href="/preview/wordwhack">Word-Whack Blitz</a></li>
        <li><a href="/preview/cardgame">Picture-Word Memory Match</a></li>
        <li><a href="/preview/findgame">Find the Object</a></li>
      </ul>
    </section>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const nextUrl = new URLSearchParams(location.search).get("next") || "/";

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("visible");
    }

    function clearError() {
      errorEl.textContent = "";
      errorEl.classList.remove("visible");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          showError(data.error || "Login failed. Please try again.");
          return;
        }

        location.href = nextUrl.startsWith("/") ? nextUrl : "/";
      } catch {
        showError("Could not reach the server. Please try again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
