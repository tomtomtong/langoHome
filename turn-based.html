<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turn-based voice test</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.3.4/lib/three-vrm-animation.module.js",
        "vrm-mixamo-retarget": "https://cdn.jsdelivr.net/npm/vrm-mixamo-retarget@1.0.3/dist/index.esm.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e7ecf1;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 1rem 1rem 2rem;
    }
    main {
      width: min(100%, 560px);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      font-weight: 600;
    }
    .sub {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      color: #9aa7b5;
      line-height: 1.45;
    }
    .sub a { color: #7eb8ff; }
    #avatar-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-bottom: 1rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a3544;
      background: #0b1222;
    }
    #vrm-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #avatar-status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.45rem 0.65rem;
      font-size: 0.78rem;
      color: #b8c4d0;
      background: linear-gradient(transparent, rgba(8, 12, 18, 0.85));
      pointer-events: none;
    }
    #status {
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.75rem;
      border-radius: 8px;
      background: #1a2330;
      font-size: 0.9rem;
    }
    #status.live { background: #152a45; color: #8ec5ff; }
    #status.err { background: #3a1f1f; color: #ffb4ab; }
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    button {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.record {
      background: #1a73e8;
      color: #fff;
    }
    button.record:hover:not(:disabled) { background: #1557b0; }
    button.stop {
      background: #c62828;
      color: #fff;
    }
    button.stop:hover:not(:disabled) { background: #a31f1f; }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.78rem;
      color: #9aa7b5;
    }
    textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.85rem;
      border: 1px solid #2a3544;
      border-radius: 8px;
      background: #151c26;
      color: #e7ecf1;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
      min-height: 3.25rem;
    }
    #log {
      border: 1px solid #2a3544;
      border-radius: 8px;
      background: #151c26;
      padding: 0.75rem;
      min-height: 8rem;
      max-height: 18rem;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .entry {
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #243040;
    }
    .entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .entry .meta {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }
    .entry .meta.user { color: #8ec5ff; }
    .entry .meta.assistant { color: #a8e6a1; }
  </style>
</head>
<body>
  <main>
    <h1>Turn-based voice test</h1>
    <p class="sub">
      Record, stop to transcribe, then LLM reply with avatar lipsync.
      Requires <code>INWORLD_API_KEY</code> and <code>INWORLD_API_ENABLED=1</code>.
    </p>

    <div id="avatar-wrap">
      <canvas id="vrm-canvas"></canvas>
      <div id="avatar-status">Loading avatar…</div>
    </div>

    <div id="status">Loading avatar…</div>

    <div class="controls">
      <button type="button" class="record" id="recordBtn" disabled>Record</button>
      <button type="button" class="stop" id="stopBtn" disabled>Stop</button>
    </div>

    <label for="systemPrompt">System prompt</label>
    <textarea id="systemPrompt">You are a friendly English tutor. Keep replies short (1–3 sentences) for voice.</textarea>

    <label>Conversation</label>
    <div id="log"></div>
  </main>

  <script type="module">
    import {
      TommyAvatar,
      DEFAULT_AVATAR,
      DEFAULT_LIPSYNC,
      DEFAULT_LIGHTING,
    } from "/visme/avatar.js";

    const SAMPLE_RATE = 16000;

    const statusEl = document.getElementById("status");
    const avatarStatusEl = document.getElementById("avatar-status");
    const logEl = document.getElementById("log");
    const systemPromptEl = document.getElementById("systemPrompt");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const canvasEl = document.getElementById("vrm-canvas");

    let avatar = null;
    let avatarLoading = null;
    let history = [];
    let recording = false;
    let processing = false;
    let audioCtx = null;
    let mediaStream = null;
    let processor = null;
    let pcmChunks = [];
    let replyAudio = null;
    let lipsyncRaf = null;

    function setStatus(text, { live = false, err = false } = {}) {
      statusEl.textContent = text;
      statusEl.className = err ? "err" : live ? "live" : "";
    }

    function appendTurn(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "entry";
      const meta = document.createElement("div");
      meta.className = `meta ${role}`;
      meta.textContent = role === "user" ? "You" : "Assistant";
      const body = document.createElement("div");
      body.textContent = text;
      wrap.append(meta, body);
      logEl.prepend(wrap);
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < float32Array.length; i += 1) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Uint8Array(buffer);
    }

    function encodeWavBase64(pcmBytes, sampleRate, numChannels) {
      const byteRate = sampleRate * numChannels * 2;
      const blockAlign = numChannels * 2;
      const dataSize = pcmBytes.length;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeStr(offset, str) {
        for (let i = 0; i < str.length; i += 1) view.setUint8(offset + i, str.charCodeAt(i));
      }

      writeStr(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, dataSize, true);
      new Uint8Array(buffer, 44).set(pcmBytes);

      let binary = "";
      const bytes = new Uint8Array(buffer);
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function mergeChunks(chunks) {
      const totalLength = chunks.reduce((sum, c) => sum + c.length, 0);
      const merged = new Float32Array(totalLength);
      let offset = 0;
      for (const chunk of chunks) {
        merged.set(chunk, offset);
        offset += chunk.length;
      }
      return merged;
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const contentType = res.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        throw new Error("Server returned non-JSON. Is npm start running?");
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    async function checkReady() {
      const ready = await fetch("/api/inworld/ready").then((r) => r.json());
      if (!ready.enabled) {
        throw new Error("Inworld API is disabled (INWORLD_API_ENABLED).");
      }
      if (!ready.configured) {
        throw new Error("INWORLD_API_KEY missing. Set it on the server or at /config.");
      }
    }

    async function ensureAvatar() {
      if (avatar?.loaded) return avatar;
      if (avatarLoading) return avatarLoading;
      avatarLoading = (async () => {
        avatar = new TommyAvatar(canvasEl, {
          ...DEFAULT_AVATAR,
          lipsync: DEFAULT_LIPSYNC,
          lighting: DEFAULT_LIGHTING,
          interactiveCamera: false,
        });
        avatar.onStatus = (msg) => {
          avatarStatusEl.textContent = msg;
        };
        await avatar.load();
        await new Promise((r) => requestAnimationFrame(r));
        avatar.refreshAfterVisible();
        avatarStatusEl.textContent = "";
        return avatar;
      })();
      return avatarLoading;
    }

    function stopSpeaking() {
      if (lipsyncRaf) {
        cancelAnimationFrame(lipsyncRaf);
        lipsyncRaf = null;
      }
      if (replyAudio) {
        replyAudio.pause();
        replyAudio = null;
      }
      avatar?.endSpeech();
    }

    async function speakReply(text, base64Mp3) {
      stopSpeaking();
      const av = await ensureAvatar();
      replyAudio = new Audio(`data:audio/mpeg;base64,${base64Mp3}`);

      await new Promise((resolve, reject) => {
        replyAudio.addEventListener("loadedmetadata", () => resolve(), { once: true });
        replyAudio.addEventListener("error", () => reject(new Error("Could not load TTS audio.")), { once: true });
      });

      const durationMs = replyAudio.duration * 1000;
      av.updateSpeechText(text, durationMs);
      av.beginSpeech();

      await new Promise((resolve, reject) => {
        const tick = () => {
          if (!av.speaking) return;
          av.setSpeechElapsedMs(replyAudio.currentTime * 1000);
          lipsyncRaf = requestAnimationFrame(tick);
        };
        replyAudio.addEventListener("play", () => {
          lipsyncRaf = requestAnimationFrame(tick);
        }, { once: true });
        replyAudio.addEventListener("ended", () => {
          stopSpeaking();
          resolve();
        }, { once: true });
        replyAudio.addEventListener("error", () => {
          stopSpeaking();
          reject(new Error("Could not play TTS audio."));
        }, { once: true });
        replyAudio.play().catch(reject);
      });
    }

    function setControls({ canRecord, canStop }) {
      recordBtn.disabled = !canRecord;
      stopBtn.disabled = !canStop;
    }

    async function startRecording() {
      if (processing || recording) return;
      await checkReady();
      stopSpeaking();

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          channelCount: 1,
        },
      });

      pcmChunks = [];
      audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
      const source = audioCtx.createMediaStreamSource(mediaStream);
      processor = audioCtx.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (event) => {
        pcmChunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
      };

      source.connect(processor);
      const mute = audioCtx.createGain();
      mute.gain.value = 0;
      processor.connect(mute);
      mute.connect(audioCtx.destination);

      recording = true;
      setControls({ canRecord: false, canStop: true });
      setStatus("Recording… click Stop when done.", { live: true });
    }

    async function stopRecording() {
      if (!recording || processing) return;

      recording = false;
      processing = true;
      setControls({ canRecord: false, canStop: false });
      setStatus("Stopping…", { live: true });

      processor?.disconnect();
      mediaStream?.getTracks().forEach((t) => t.stop());
      if (audioCtx) await audioCtx.close();

      processor = null;
      mediaStream = null;
      audioCtx = null;

      const merged = mergeChunks(pcmChunks);
      pcmChunks = [];

      if (merged.length === 0) {
        setStatus("No audio captured. Try again.", { err: true });
        processing = false;
        setControls({ canRecord: true, canStop: false });
        return;
      }

      const wavBase64 = encodeWavBase64(floatTo16BitPCM(merged), SAMPLE_RATE, 1);

      try {
        setStatus("Transcribing…", { live: true });
        const sttData = await postJson("/api/inworld/stt", {
          audioContent: wavBase64,
          audioEncoding: "LINEAR16",
          sampleRateHertz: SAMPLE_RATE,
          numberOfChannels: 1,
          language: "en",
        });
        const transcript = (sttData.transcript || "").trim();
        if (!transcript) {
          setStatus("No speech detected. Click Record to try again.");
          return;
        }

        appendTurn("user", transcript);
        history.push({ role: "user", content: transcript });

        setStatus("Thinking…", { live: true });
        const chatData = await postJson("/api/inworld/llm/chat", {
          systemPrompt: systemPromptEl.value.trim(),
          userMessage: transcript,
          history: history.slice(0, -1),
        });
        const reply = (chatData.reply || "").trim();
        if (!reply) {
          setStatus("No reply from LLM. Click Record to try again.", { err: true });
          return;
        }

        appendTurn("assistant", reply);
        history.push({ role: "assistant", content: reply });

        setStatus("Speaking…", { live: true });
        const ttsData = await postJson("/api/inworld/tts", { text: reply });
        await speakReply(reply, ttsData.audioContent);

        setStatus("Done. Click Record for another turn.");
      } catch (err) {
        setStatus(err.message || "Something went wrong.", { err: true });
      } finally {
        processing = false;
        setControls({ canRecord: true, canStop: false });
      }
    }

    recordBtn.addEventListener("click", () => {
      startRecording().catch((err) => {
        setStatus(err.message || "Could not start recording.", { err: true });
        recording = false;
        processing = false;
        setControls({ canRecord: true, canStop: false });
      });
    });

    stopBtn.addEventListener("click", () => {
      stopRecording();
    });

    window.addEventListener("beforeunload", () => {
      stopSpeaking();
      mediaStream?.getTracks().forEach((t) => t.stop());
    });

    (async () => {
      try {
        await checkReady();
        await ensureAvatar();
        setStatus("Click Record to start.");
        setControls({ canRecord: true, canStop: false });
      } catch (err) {
        setStatus(err.message || "Could not initialize.", { err: true });
        avatarStatusEl.textContent = err.message || "Avatar unavailable";
      }
    })();
  </script>
</body>
</html>
