<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <title>Uncle Tommy — Voice Agent</title>
  <script>
    if (new URLSearchParams(location.search).has("connect")) {
      document.documentElement.classList.add("game-return-connect");
    }
  </script>
  <link rel="preload" href="/langoLogo.jpeg" as="image">
  <link rel="preload" href="/visme/Tommyv4.vrm" as="fetch" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.3.4/lib/three-vrm-animation.module.js",
        "vrm-mixamo-retarget": "https://cdn.jsdelivr.net/npm/vrm-mixamo-retarget@1.0.3/dist/index.esm.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaed;
    }

    /* ── Portrait blocker ── */
    #portrait-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      background: #0f1117;
      text-align: center;
    }

    #portrait-prompt svg {
      width: 64px;
      height: 64px;
      color: #6c8cff;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #portrait-prompt { display: flex; }
      #app { display: none !important; }
    }

    #app {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      overflow: hidden;
      transform: translate(-50%, -50%);
      background: #0f1117;
    }

    /* ── Splash screen (logo while assets preload) ── */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: min(70vw, 420px);
    }

    #splash-screen img {
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
    }

    .splash-loading-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.08);
    }

    .splash-loading-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6c8cff, #5a7aef);
      transition: width 0.3s ease-out;
    }

    body.splash-dismissed #splash-screen {
      display: none;
    }

    /* ── Idle screen (before Inworld session) ── */
    #idle-screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 1.5rem;
      gap: 1rem;
    }

    #idle-screen h1 {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
    }

    .idle-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: min(420px, 100%);
    }

    #status-idle {
      color: #9aa0a6;
      font-size: 0.875rem;
      text-align: center;
    }

    #err-idle {
      display: none;
      max-width: 100%;
      padding: 0.625rem 0.75rem;
      border-radius: 8px;
      background: #3a1e1e;
      color: #f28b82;
      font-size: 0.8125rem;
      text-align: center;
    }

    /* ── Fullscreen avatar (only during session) ── */
    #avatar-stage {
      /* Keep in layout (not display:none) so WebGL can upload textures while preloading. */
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #0b1222;
    }

    #avatar-stage.has-bg-image {
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 100% auto;
    }

    body.in-session #avatar-stage {
      visibility: visible;
      pointer-events: auto;
    }

    body.in-session #idle-screen {
      display: none;
    }

    /* Game return (?connect=1): skip idle / transition / start UI — show avatar immediately */
    html.game-return-connect #idle-screen,
    html.game-return-connect #idle-video-screen {
      display: none !important;
    }

    html.game-return-connect #avatar-stage {
      visibility: visible;
      pointer-events: auto;
    }

    html.game-return-connect #session-overlay {
      display: block;
    }

    #vrm-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ── Session overlay controls ── */
    #session-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    body.in-session #session-overlay {
      display: block;
    }

    .overlay-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(0.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.75rem max(1rem, env(safe-area-inset-left));
      pointer-events: auto;
      background: linear-gradient(to bottom, rgba(15, 17, 23, 0.75), transparent);
    }

    .overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      pointer-events: auto;
      background: linear-gradient(to top, rgba(15, 17, 23, 0.85), transparent);
    }

    .overlay-games {
      position: absolute;
      right: max(0.75rem, env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      pointer-events: auto;
    }

    .game-shortcut {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(5.5rem, 14vw, 6.7rem);
      height: clamp(5.5rem, 14vw, 6.7rem);
      border-radius: 22px;
      background: rgba(15, 17, 23, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .game-shortcut:hover {
      transform: scale(1.06);
      background: rgba(32, 38, 52, 0.92);
      border-color: rgba(108, 140, 255, 0.45);
    }

    .game-shortcut img {
      width: 62%;
      height: 62%;
      object-fit: contain;
      pointer-events: none;
    }

    .game-shortcut--card img {
      width: 72%;
      height: 72%;
    }

    .game-shortcut--find img {
      width: 78%;
      height: 78%;
      border-radius: 6px;
    }

    button {
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 8px;
      background: #6c8cff;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #5a7aef; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #btn-stop {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #btn-stop:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
    }

    #status {
      color: #c4c7c5;
      font-size: 0.875rem;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    #status.active { color: #81c995; }

    #avatar-status {
      margin: 0;
      font-size: 0.75rem;
      color: #9aa0a6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .overlay-top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #btn-save-camera,
    #btn-cancel-camera {
      display: none;
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }

    body.camera-edit-mode #btn-save-camera,
    body.camera-edit-mode #btn-cancel-camera {
      display: inline-block;
    }

    #btn-cancel-camera {
      color: #e8eaed;
    }

    body.camera-edit-mode #avatar-status {
      color: #c4c7c5;
    }

    #btn-save-camera:hover:not(:disabled),
    #btn-cancel-camera:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }

    #camera-save-status {
      display: none;
      font-size: 0.6875rem;
      color: #81c995;
      min-width: 4rem;
      text-align: right;
    }

    body.camera-edit-mode #camera-save-status {
      display: block;
    }

    #camera-height-controls {
      display: none;
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      flex-direction: column;
      gap: 0.5rem;
    }

    body.camera-edit-mode #camera-height-controls {
      display: flex;
    }

    #camera-height-controls button {
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 17, 23, 0.75);
      color: #e8eaed;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #camera-height-controls button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.35);
    }

    #camera-height-controls button:active {
      background: rgba(108, 140, 255, 0.35);
    }

    #camera-save-status.err { color: #f28b82; }

    a {
      color: #9aa0a6;
      font-size: 0.8125rem;
      text-decoration: none;
    }

    a:hover { color: #6c8cff; }

    #err {
      display: none;
      max-width: min(480px, 90vw);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: rgba(58, 30, 30, 0.9);
      color: #f28b82;
      font-size: 0.8125rem;
      text-align: center;
    }

    #btn-send-log {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.45rem 0.75rem;
      font-size: 0.8125rem;
      background: rgba(255, 255, 255, 0.1);
    }

    #btn-send-log:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); }

    #debug-upload-status {
      margin-top: 0.375rem;
      font-size: 0.75rem;
      color: #81c995;
      text-align: center;
      min-height: 1.125rem;
    }

    #debug-upload-status.err { color: #f28b82; }

    /* ── Conversation captions (what avatar hears / says) ── */
    #conversation-captions {
      position: absolute;
      left: max(1rem, env(safe-area-inset-left));
      bottom: calc(5.75rem + env(safe-area-inset-bottom));
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: min(420px, calc(100vw - 8rem - env(safe-area-inset-left) - env(safe-area-inset-right)));
      max-height: 38vh;
      overflow-y: auto;
      pointer-events: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .caption-line {
      display: none;
      padding: 0.55rem 0.8rem;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.35;
      backdrop-filter: blur(10px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      animation: caption-in 0.22s ease;
    }

    .caption-line.visible {
      display: block;
    }

    .caption-line--user {
      background: rgba(108, 140, 255, 0.22);
      border: 1px solid rgba(108, 140, 255, 0.35);
    }

    .caption-line--agent {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .caption-line--listening {
      color: #c4c7c5;
      font-style: italic;
    }

    .caption-label {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9aa0a6;
    }

    @keyframes caption-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Idle screen video (before conversation) ── */
    #idle-video-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3;
      background: #0b1222;
      cursor: pointer;
    }

    .screen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      background: #0b1222;
    }

    #transition-video {
      opacity: 0;
      visibility: hidden;
      z-index: 1;
    }

    body.playing-transition-video #idle-video {
      visibility: hidden;
    }

    body.playing-transition-video #transition-video {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    #idle-video-loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0b1222;
      color: #9aa0a6;
      font-size: 0.9375rem;
      pointer-events: none;
    }

    body.has-idle-video.videos-loading #idle-video-loading {
      display: flex;
    }

    body.has-idle-video.videos-loading #idle-video,
    body.has-idle-video.videos-loading #transition-video,
    body.has-idle-video.videos-loading #idle-video-hint {
      visibility: hidden;
    }

    body.has-idle-video #idle-video-screen {
      display: block;
    }

    body.has-idle-video.in-session #idle-video-screen {
      display: none;
    }

    body.idle-video-dismissed #idle-video-screen {
      display: none !important;
    }

    body.has-idle-video #idle-screen {
      display: none;
    }

    body.playing-transition-video #idle-video-screen {
      cursor: default;
      pointer-events: none;
    }

    body.playing-transition-video #idle-video-hint {
      display: none;
    }

    #idle-video {
      z-index: 0;
    }

    #idle-video-hint {
      position: absolute;
      left: 50%;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 0.625rem 1rem;
      border-radius: 999px;
      background: rgba(15, 17, 23, 0.72);
      color: #e8eaed;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      pointer-events: none;
      backdrop-filter: blur(8px);
      animation: idle-hint-pulse 2.4s ease-in-out infinite;
    }

    #hko-weather-bar {
      position: absolute;
      top: max(0.75rem, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      max-width: min(94vw, 34rem);
      padding: 0.5rem 0.875rem;
      border-radius: 1rem;
      background: rgba(15, 17, 23, 0.72);
      color: #e8eaed;
      font-size: 0.875rem;
      line-height: 1.2;
      pointer-events: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
    }

    #hko-weather-bar[hidden] {
      display: none !important;
    }

    #hko-weather-icon {
      width: 2rem;
      height: 2rem;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .hko-weather-details {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    #hko-weather-datetime {
      font-size: 0.8125rem;
      color: #c4c7c5;
      white-space: nowrap;
    }

    .hko-weather-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.625rem;
    }

    #hko-weather-condition {
      font-weight: 600;
      white-space: nowrap;
    }

    .hko-weather-stat {
      color: #c4c7c5;
      white-space: nowrap;
    }

    .hko-weather-stat strong {
      color: #e8eaed;
      font-weight: 700;
    }

    body.has-idle-video.videos-loading #hko-weather-bar {
      visibility: hidden;
    }

    body.pair-theme-warm #hko-weather-bar {
      background: rgba(92, 56, 20, 0.78);
      color: #ffe8c8;
    }

    body.pair-theme-warm .hko-weather-stat {
      color: #ffd9a8;
    }

    body.pair-theme-warm .hko-weather-stat strong,
    body.pair-theme-warm #hko-weather-datetime {
      color: #fff4e8;
    }

    body.pair-theme-cool #hko-weather-bar {
      background: rgba(18, 58, 92, 0.78);
      color: #d8f1ff;
    }

    body.pair-theme-cool .hko-weather-stat {
      color: #b8dff8;
    }

    body.pair-theme-cool .hko-weather-stat strong,
    body.pair-theme-cool #hko-weather-datetime {
      color: #eef8ff;
    }

    body.pair-theme-nature #hko-weather-bar {
      background: rgba(24, 72, 38, 0.78);
      color: #dff9e5;
    }

    body.pair-theme-nature .hko-weather-stat {
      color: #bfeecf;
    }

    body.pair-theme-nature .hko-weather-stat strong,
    body.pair-theme-nature #hko-weather-datetime {
      color: #f2fff5;
    }

    body.pair-theme-night #hko-weather-bar {
      background: rgba(42, 28, 82, 0.78);
      color: #e8ddff;
    }

    body.pair-theme-night .hko-weather-stat {
      color: #d4c4ff;
    }

    body.pair-theme-night .hko-weather-stat strong,
    body.pair-theme-night #hko-weather-datetime {
      color: #f5f0ff;
    }

    @keyframes idle-hint-pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    body.pair-theme-warm #idle-video-hint {
      background: rgba(92, 56, 20, 0.78);
      color: #ffe8c8;
    }

    body.pair-theme-cool #idle-video-hint {
      background: rgba(18, 58, 92, 0.78);
      color: #d8f1ff;
    }

    body.pair-theme-nature #idle-video-hint {
      background: rgba(24, 72, 38, 0.78);
      color: #dff9e5;
    }

    body.pair-theme-night #idle-video-hint {
      background: rgba(42, 28, 82, 0.78);
      color: #e8ddff;
    }

    body.pair-theme-warm .caption-line--user {
      background: rgba(255, 180, 96, 0.22);
      border-color: rgba(255, 180, 96, 0.38);
    }

    body.pair-theme-warm .caption-line--agent {
      background: rgba(255, 214, 160, 0.14);
      border-color: rgba(255, 214, 160, 0.24);
    }

    body.pair-theme-cool .caption-line--user {
      background: rgba(96, 180, 255, 0.22);
      border-color: rgba(96, 180, 255, 0.38);
    }

    body.pair-theme-cool .caption-line--agent {
      background: rgba(160, 220, 255, 0.14);
      border-color: rgba(160, 220, 255, 0.24);
    }

    body.pair-theme-nature .caption-line--user {
      background: rgba(96, 210, 128, 0.22);
      border-color: rgba(96, 210, 128, 0.38);
    }

    body.pair-theme-nature .caption-line--agent {
      background: rgba(170, 240, 188, 0.14);
      border-color: rgba(170, 240, 188, 0.24);
    }

    body.pair-theme-night .caption-line--user {
      background: rgba(167, 139, 250, 0.22);
      border-color: rgba(167, 139, 250, 0.38);
    }

    body.pair-theme-night .caption-line--agent {
      background: rgba(196, 181, 253, 0.14);
      border-color: rgba(196, 181, 253, 0.24);
    }

    /* ── Game launch transition ── */
    #game-launch-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at 50% 30%, #2a1f6e 0%, #0f1117 55%, #05060a 100%);
      overflow: hidden;
    }

    #game-launch-overlay.visible {
      display: flex;
    }

    .game-launch-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.7) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,255,255,0.55) 50%, transparent 51%),
        radial-gradient(2px 2px at 34% 72%, rgba(255,255,255,0.45) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 64%, rgba(255,255,255,0.6) 50%, transparent 51%),
        radial-gradient(2px 2px at 56% 38%, rgba(255,255,255,0.35) 50%, transparent 51%),

    .game-launch-card {

    @keyframes game-launch-pop {

    .game-launch-kicker {

    .game-launch-title {

    .game-launch-reel {

    }

    .game-launch-reel.landed .game-launch-icon {
      animation: game-launch-land 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes game-launch-shuffle {
      0% { transform: scale(0.88) rotate(-6deg); opacity: 0.65; }
      100% { transform: scale(1.02) rotate(6deg); opacity: 1; }
    }

    @keyframes game-launch-land {
      0% { transform: scale(0.5) rotate(-18deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .game-launch-icon {
      position: absolute;
      inset: 14%;
      width: 72%;
      height: 72%;
      margin: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35));

    .game-launch-name {
      margin: 0 0 0.35rem;
      min-height: 1.5em;
      font-size: clamp(1rem, 3.2vw, 1.2rem);
      font-weight: 600;
      color: #e8eaed;
    }

    .game-launch-sub {
      margin: 0 0 1.25rem;
      min-height: 1.25em;
      font-size: 0.875rem;
      color: #9aa0a6;
    }

    .game-launch-progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .game-launch-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6c8cff, #a78bfa, #f472b6);
      background-size: 200% 100%;
      animation: game-launch-bar-shine 1.2s linear infinite;
      transition: width 0.35s ease;

    @keyframes game-launch-bar-shine {

    .game-launch-confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;

    .game-launch-confetti span {
      position: absolute;
      top: -12%;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: game-launch-confetti-fall 1.8s ease-in forwards;
    }

    @keyframes game-launch-confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }

    .game-launch-card.theme-wordwhack { border-color: rgba(255, 214, 120, 0.35); }
    .game-launch-card.theme-cardgame { border-color: rgba(120, 180, 255, 0.35); }
    .game-launch-card.theme-findgame { border-color: rgba(120, 255, 180, 0.35); }

    /* ── Daily rewards retention ── */
    #daily-rewards-btn {

    #daily-rewards-btn:hover { transform: translateY(-1px); }

    #daily-rewards-btn.visible { display: flex; }

    body.rewards-enabled.has-idle-video:not(.in-session):not(.idle-video-dismissed) #daily-rewards-btn {

    #daily-rewards-btn.has-claim {

    }

    @keyframes reward-btn-glow {
      0%, 100% { box-shadow: 0 4px 0 #4a2a0e, 0 0 0 0 rgba(255, 214, 102, 0.5); }
      50% { box-shadow: 0 4px 0 #4a2a0e, 0 0 0 8px rgba(255, 214, 102, 0); }

    #daily-rewards-btn .reward-btn-icon {
      width: 1.35rem;
      height: 1.35rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      font-size: 0.85rem;
    }

    #daily-rewards-btn .reward-streak-badge {
      min-width: 1.25rem;
      padding: 0 0.35rem;
      border-radius: 999px;
      background: #ffd666;
      color: #5e3a18;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.35rem;
      text-align: center;
    }

    #daily-rewards-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 180;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(88, 120, 200, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 80%, rgba(220, 140, 60, 0.28) 0%, transparent 50%),
        rgba(12, 10, 18, 0.72);
      backdrop-filter: blur(6px);
    }

    #daily-rewards-overlay.visible { display: flex; }

    .daily-rewards-panel {
      position: relative;
      width: min(96vw, 820px);
      padding: 0.35rem;
      border-radius: 28px;
      background: linear-gradient(180deg, #c49a5a 0%, #8b5e2a 40%, #6d4518 100%);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45),
        inset 0 2px 0 rgba(255, 255, 255, 0.22),
        inset 0 -3px 0 rgba(0, 0, 0, 0.18);
      animation: daily-reward-pop 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    @keyframes daily-reward-pop {
      0% { transform: scale(0.88) translateY(12px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .daily-rewards-inner {
      border-radius: 24px;
      padding: 1.1rem 1rem 1.25rem;
      background: linear-gradient(180deg, #a87338 0%, #8f5f28 100%);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .daily-rewards-return {
      position: absolute;
      top: -0.35rem;
      left: 0.75rem;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.85rem 0.4rem 0.65rem;
      border: 2px solid #d4af37;
      border-radius: 12px;
      background: linear-gradient(180deg, #b88442 0%, #8d5a24 100%);
      color: #fff8e7;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 #4a2a0e;
    }

    .daily-rewards-return svg {
      width: 1rem;
      height: 1rem;
    }

    .daily-rewards-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
      padding-top: 0.15rem;
    }

    .daily-rewards-plaque {
      padding: 0.35rem 1.75rem;
      border: 3px solid #d4af37;
      border-radius: 14px;
      background: linear-gradient(180deg, #c49a5a 0%, #9a6830 100%);
      color: #fff8e7;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .daily-rewards-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      color: #ffe8c2;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .daily-rewards-slots {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: clamp(0.35rem, 1.2vw, 0.65rem);
      margin-bottom: 1rem;
    }

    @media (max-width: 720px) {
      .daily-rewards-slots {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .daily-reward-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 0.35rem 0.65rem;
      border-radius: 16px;
      border: 2px solid rgba(74, 42, 14, 0.45);
      background: linear-gradient(180deg, #6d4518 0%, #543410 100%);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.22);
      min-height: 7.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .daily-reward-slot.active {
      background: linear-gradient(180deg, #e8c07a 0%, #c89445 100%);
      border-color: #f0d080;
      box-shadow:
        0 0 0 2px rgba(255, 230, 150, 0.35),
        inset 0 2px 6px rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .daily-reward-slot.claimed {
      background: linear-gradient(180deg, #8f6a35 0%, #6f5020 100%);
      opacity: 0.88;
    }

    .daily-reward-slot.locked {
      opacity: 0.72;
    }

    .daily-reward-slot-day {
      color: #ffe8c2;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      opacity: 0.9;
    }

    .daily-reward-slot.active .daily-reward-slot-day { color: #5e3a18; }

    .daily-reward-slot-icon {
      width: clamp(2.2rem, 5vw, 2.75rem);
      height: clamp(2.2rem, 5vw, 2.75rem);
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.12);
    }

    .daily-reward-slot.active .daily-reward-slot-icon {
      background: rgba(255, 255, 255, 0.28);
    }

    .daily-reward-slot-icon svg {
      width: 70%;
      height: 70%;
    }

    .daily-reward-slot-label {
      color: #ffe8c2;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: clamp(0.68rem, 1.8vw, 0.78rem);
      font-weight: 700;
      text-align: center;
      line-height: 1.15;
    }

    .daily-reward-slot.active .daily-reward-slot-label { color: #4a2a0e; }

    .daily-reward-slot-stars {
      color: #ffd666;
      font-size: 0.68rem;
      font-weight: 800;
    }

    .daily-rewards-actions {
      display: flex;
      justify-content: center;
    }

    #daily-rewards-claim-btn {
      min-width: min(100%, 280px);
      padding: 0.75rem 1.5rem;
      border: 3px solid #d4af37;
      border-radius: 16px;
      background: linear-gradient(180deg, #5fd068 0%, #36a83f 100%);
      color: #fff;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #1f6b28, 0 10px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
    }

    #daily-rewards-claim-btn:disabled {
      opacity: 0.55;
      cursor: default;
      background: linear-gradient(180deg, #9a9a9a 0%, #6e6e6e 100%);
      box-shadow: 0 3px 0 #444;
    }

    #daily-rewards-claim-btn:not(:disabled):active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1f6b28;
    }

    .daily-rewards-celebrate {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .daily-rewards-sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd666;
      animation: reward-sparkle 0.9s ease-out forwards;
    }

    @keyframes reward-sparkle {
      0% { transform: scale(0) translateY(0); opacity: 1; }
      100% { transform: scale(1.4) translateY(-40px); opacity: 0; }
    }

    body.in-session #daily-rewards-btn { display: none !important; }
    body.in-session #daily-rewards-overlay.visible { display: none !important; }

    /* Figma frame 49:62 — Lango Home */
    #lango-home-root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
      background: transparent;
    }

    /* The entire app is the 4:3 stage; the video fills that stage. */
    body:not(.in-session) #idle-video-screen {
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
    }

    body.in-session #lango-home-root,
    html.game-return-connect #lango-home-root { display: none; }

    .lango-home {
      --frame-padding: 4.7%;
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
      font-family: 'Jomhuria', Georgia, serif;
      isolation: isolate;
    }

    /* Continuous thin frame beneath the decorative PNG. It closes the
       transparent corner gaps so the video always remains behind the wood. */
    .lango-home::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 9;
      box-sizing: border-box;
      border: 5.2vw solid #b65d18;
      border-color: #c66c20 #a94f13 #b85c16 #a94f13;
      box-shadow:
        inset 0 0 0 3px #6f2a08,
        inset 0 0 12px 6px rgba(92, 34, 5, .45),
        0 0 0 3px #e79032;
      pointer-events: none;
    }

    @supports (width: 1cqw) {
      .lango-home { container-type: size; }
      .lango-home::after { border-width: 5.2cqw; }
    }

    .lango-home__frame {
      position: absolute;
      z-index: 10;
      /* The source PNG includes transparent export padding. Overscan it so
         the wooden outer edge meets all four sides like a real photo frame. */
      inset: -5.5% -6.5%;
      width: 113%;
      height: 111%;
      /* Reveal only the outer bands of the oversized artwork. This keeps the
         photo-frame edge treatment while making the wood roughly half as thick. */
      -webkit-mask:
        linear-gradient(#000 0 0) top / 100% 10.5% no-repeat,
        linear-gradient(#000 0 0) bottom / 100% 10.5% no-repeat,
        linear-gradient(#000 0 0) left / 10.5% 100% no-repeat,
        linear-gradient(#000 0 0) right / 10.5% 100% no-repeat;
      mask:
        linear-gradient(#000 0 0) top / 100% 10.5% no-repeat,
        linear-gradient(#000 0 0) bottom / 100% 10.5% no-repeat,
        linear-gradient(#000 0 0) left / 10.5% 100% no-repeat,
        linear-gradient(#000 0 0) right / 10.5% 100% no-repeat;
      pointer-events: none;
    }

    .lango-home__asset,
    .lango-home__button img { display: block; width: 100%; height: 100%; object-fit: contain; }

    .lango-home__button {
      position: absolute;
      z-index: 20;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 4px 2px rgba(75, 31, 4, 0.28));
      transition: transform 120ms ease, filter 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .lango-home__button:hover { transform: scale(1.045); filter: drop-shadow(0 6px 3px rgba(75, 31, 4, 0.34)); }
    .lango-home__button:active { transform: scale(.95); }
    .lango-home__button:focus-visible { outline: 4px solid #fff5b2; outline-offset: 3px; border-radius: 18px; }

    .lango-home__title { position: absolute; z-index: 15; top: -1.2%; left: 29.7%; width: 41.6%; height: 14.1%; object-fit: contain; }
    .lango-home__clock { position: absolute; z-index: 16; top: 7.2%; right: 7.4%; width: 12.4%; }
    .lango-home__starbar { position: absolute; z-index: 16; top: 17.9%; right: 7.8%; width: 12.6%; }
    .lango-home__stars {
      position: absolute;
      z-index: 17;
      top: 18.2%;
      right: 10.1%;
      width: 5.5%;
      color: #fff;
      font-family: 'Jomhuria', Georgia, serif;
      font-size: clamp(28px, 5.8vh, 56px);
      font-weight: 400;
      line-height: 1;
      text-align: center;
      text-shadow: 0 3px 0 #7b270d;
    }

    .lango-home__record { top: 8%; left: 6.1%; width: 9.1%; height: 14.5%; }
    .lango-home__map { top: 24%; left: 6.4%; width: 9%; height: 12.3%; }
    .lango-home__reward { top: 38%; left: 6.4%; width: 9%; height: 12.2%; }
    .lango-home__collections { left: 7.5%; bottom: 8.2%; width: 16.2%; height: 12%; }
    .lango-home__store { top: 26.5%; right: 7.3%; width: 8.7%; height: 12.8%; }
    .lango-home__box { top: 40.2%; right: 6.8%; width: 9.2%; height: 12.8%; }

    .lango-home__nav {
      position: absolute;
      z-index: 18;
      right: 3.2%;
      bottom: 3.3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 29.2%;
      height: 17.2%;
      padding: 1.1% 1.8%;
      border: 4px solid #a74b0d;
      border-radius: 26px;
      background: linear-gradient(#d77a24, #a84f13);
      box-shadow: inset 0 0 0 4px #ef9b37, 0 4px 3px rgba(70, 25, 3, .35);
    }

    .lango-home__nav .lango-home__button { position: relative; inset: auto; width: 31%; height: 100%; }

  </style>

<body>
  <div id="splash-screen" role="status" aria-live="polite" aria-busy="true" aria-label="Loading">
    <div class="splash-content">
      <img src="/langoLogo.jpeg" alt="Lango" width="420" height="420" decoding="async">
      <div class="splash-loading-bar" aria-hidden="true">
        <div class="splash-loading-bar-fill" id="splash-progress-fill"></div>
      </div>
    </div>
  </div>

  <div id="portrait-prompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18v.01"/>
    </svg>
    <p>Rotate your device to landscape to use Uncle Tommy</p>
  </div>

  <div id="app">
    <div id="lango-home-root"></div>
    <div id="idle-video-screen" aria-label="Tap to start conversation">
      <div id="hko-weather-bar" hidden aria-live="polite">
        <img id="hko-weather-icon" alt="" width="32" height="32">
        <div class="hko-weather-details">
          <div id="hko-weather-datetime">--</div>
          <div class="hko-weather-row">
            <span id="hko-weather-condition">--</span>
            <span class="hko-weather-stat"><strong id="hko-weather-temp">--</strong></span>
            <span class="hko-weather-stat">Humidity <strong id="hko-weather-humidity">--</strong></span>
          </div>
        </div>
      </div>
      <video id="idle-video" class="screen-video" loop playsinline preload="auto"></video>
      <video id="transition-video" class="screen-video" playsinline preload="auto"></video>
      <div id="idle-video-loading">Loading videos…</div>
      <div id="idle-video-hint">Tap to start conversation</div>
    </div>

    <div id="idle-screen">
      <h1>Uncle Tommy</h1>
      <div class="idle-controls">
        <button id="btn-start">Start Conversation</button>
        <div id="status-idle">Tap Start to begin a conversation</div>
        <div id="err-idle"></div>
        <button id="btn-send-log" type="button">Send log to server</button>
        <div id="debug-upload-status"></div>
      </div>
    </div>

    <div id="avatar-stage">
      <canvas id="vrm-canvas"></canvas>

    }

    function scheduleIdleNudge() {
      cancelIdleNudge();
      if (replayingPrepMessages || !active || pendingEndConversation || ws?.readyState !== WebSocket.OPEN) return;
      if (idleNudgeCount >= MAX_IDLE_NUDGES) {
        uiLog("idle", `nudge cap reached (${MAX_IDLE_NUDGES}) — scheduling end of conversation`, "warn");
        idleEndTimer = setTimeout(() => {
          idleEndTimer = null;
          if (!active || pendingEndConversation || ws?.readyState !== WebSocket.OPEN) return;
          if (playing || queue.length > 0) { scheduleIdleNudge(); return; }
          uiLog("idle", `user silent after ${MAX_IDLE_NUDGES} nudges → suggesting farewell`, "warn");
          ws.send(JSON.stringify({
            type: "conversation.item.create",
            item: {
              type: "message",
              role: "user",
              content: [{ type: "input_text", text: "[The user has been silent for a while after several check-ins. If they seem done, give a brief warm farewell and call end_conversation. Otherwise encourage them one more time.]" }],
            },
          }));
          ws.send(JSON.stringify({ type: "response.create" }));
          scheduleForceCloseAfterTool();
        }, IDLE_NUDGE_MS);
        return;
      }
      idleNudgeTimer = setTimeout(() => {
        idleNudgeTimer = null;
        if (!active || pendingEndConversation || ws?.readyState !== WebSocket.OPEN) return;
        if (playing || queue.length > 0) return;
        idleNudgeCount++;
        uiLog("idle", `user silent ${IDLE_NUDGE_MS / 1000}s → nudge #${idleNudgeCount}`, "hello");
        setStatus("No speech detected — Uncle Tommy is checking in", true);
        ws.send(JSON.stringify({
          type: "conversation.item.create",
          item: {
            type: "message",
            role: "user",
            content: [{ type: "input_text", text: `[The user has been silent for ${IDLE_NUDGE_MS / 1000} seconds. Briefly and warmly check in and encourage them to keep talking.]` }],
          },
        }));
        ws.send(JSON.stringify({ type: "response.create" }));
      }, IDLE_NUDGE_MS);
    }

    function preloadVideoElement(video, url) {
      if (!url) return Promise.resolve(false);

      return new Promise((resolve, reject) => {
        const cleanup = () => {
          video.removeEventListener("canplaythrough", onReady);
          video.removeEventListener("error", onError);
        };

        const onReady = () => {
          cleanup();
          resolve(true);
        };

        const onError = () => {
          cleanup();
          reject(new Error(`Failed to preload video: ${url}`));
        };

        video.preload = "auto";
        if (video.dataset.preloadUrl !== url) {
          video.dataset.preloadUrl = url;
          video.src = url;
          video.load();
        }

        if (video.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
          onReady();
          return;
        }

        video.addEventListener("canplaythrough", onReady, { once: true });
        video.addEventListener("error", onError, { once: true });
      });
    }

    function parseTimeToMinutes(value) {
      if (!value || typeof value !== "string") return null;
      const match = value.trim().match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return null;
      const h = Number(match[1]);
      const m = Number(match[2]);
      if (!Number.isFinite(h) || !Number.isFinite(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
      return h * 60 + m;
    }

    function getLocalMinutesInTimezone(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone,
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      }).formatToParts(date);
      const hour = Number(parts.find((p) => p.type === "hour")?.value ?? 0);
      const minute = Number(parts.find((p) => p.type === "minute")?.value ?? 0);
      return hour * 60 + minute;
    }

    function isPairActiveNow(pair, date = new Date(), timeZone = videoPairsTimezone) {
      const start = parseTimeToMinutes(pair.startTime ?? "00:00");
      const end = parseTimeToMinutes(pair.endTime ?? "23:59");
      if (start === null || end === null) return true;
      const now = getLocalMinutesInTimezone(date, timeZone);
      if (start === end) return true;
      if (start < end) return now >= start && now <= end;
      return now >= start || now <= end;
    }

    function pickVideoPair(videoPairs, date = new Date()) {
      const eligible = (videoPairs || []).filter((p) => p.loopVideo?.url && isPairActiveNow(p, date));
      if (!eligible.length) return null;
      return eligible[Math.floor(Math.random() * eligible.length)];
    }

    async function setupIdleVideos(idleVideo, transitionVideo, { autoplay = true, hintText = "Tap to start conversation" } = {}) {
      transitionVideoUrl = transitionVideo?.url || null;
      idleVideosReady = false;
      idleVideoHintText = hintText?.trim() || "Tap to start conversation";
      if (idleVideoHint) idleVideoHint.textContent = idleVideoHintText;

      idleVideoUrl = idleVideo.url;

      idleVideoEl.loop = true;

      applyVideoAudioSettings(transitionVideoEl);
      transitionVideoEl.pause();

      const preloadTasks = [preloadVideoElement(idleVideoEl, idleVideo.url)];
      if (transitionVideoUrl) {
        preloadTasks.push(preloadVideoElement(transitionVideoEl, transitionVideoUrl));
      }

      try {
        await Promise.all(preloadTasks);
      } catch (e) {
        console.warn("Video preload failed:", e);
        uiLog("hello", `video preload warning: ${e.message}`, "warn");
      }

      idleVideosReady = true;
      setVideosLoading(false);
      transitionVideoEl.pause();
      transitionVideoEl.currentTime = 0;

      if (autoplay) {
        try {
          await playVideoWithSound(idleVideoEl);
        } catch {}
      }
      return true;
    }

    async function playTransitionVideo() {
      const HANDOFF_BEFORE_END_SEC = 0.25;
      return new Promise((resolve, reject) => {
        playingTransitionVideo = true;
        setTransitionVideoMode(true);
        idleVideoHint.hidden = true;
        idleVideoScreen.style.cursor = "default";

        idleVideoEl.pause();
        transitionVideoEl.currentTime = 0;
        unlockVideoSound();
        transitionVideoEl.muted = false;
        transitionVideoEl.volume = 1;

        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          transitionVideoEl.onended = null;
          transitionVideoEl.onerror = null;
          transitionVideoEl.removeEventListener("timeupdate", onTimeUpdate);
          transitionVideoEl.pause();
          resolve();
        };

        const onTimeUpdate = () => {
          const remaining = transitionVideoEl.duration - transitionVideoEl.currentTime;
          if (Number.isFinite(remaining) && remaining <= HANDOFF_BEFORE_END_SEC) finish();
        };

        transitionVideoEl.addEventListener("timeupdate", onTimeUpdate);
        transitionVideoEl.onended = finish;
        transitionVideoEl.onerror = () => {
          transitionVideoEl.onended = null;
          transitionVideoEl.onerror = null;
          transitionVideoEl.removeEventListener("timeupdate", onTimeUpdate);
          reject(new Error("Transition video failed to play."));
        };

        transitionVideoEl.play().catch(reject);
      });
    }

    async function refreshIdleVideosForCurrentPeriod() {
      if (inSession || active || playingTransitionVideo || idleVideoStarting) return;
      const cfg = cachedConfig || await getConfig();
      const nextPair = pickVideoPair(cfg.videoPairs);
      const nextId = nextPair?.id ?? null;
      const currentId = activeVideoPair?.id ?? null;

      await setupIdleVideosFromConfig(cfg, { autoplay: wasPlaying });

        playVideoWithSound(idleVideoEl);
      }

    function trackFunctionCallItem(item) {
      if (!item || item.type !== "function_call") return;
      const callId = item.call_id || item.id;
      if (!callId) return;
      pendingFunctionCalls.set(item.id || callId, {
        name: item.name,
        call_id: callId,
      });

    function resolveFunctionCall(event) {
      const tracked = pendingFunctionCalls.get(event.item_id);
      return {
        name: event.name || tracked?.name,
        call_id: event.call_id || tracked?.call_id || event.item_id,
        arguments: event.arguments || "{}",
      };
    }

    function isDanceRequest(text) {
      const t = text.toLowerCase().trim();
      if (!t) return false;
      if (/\b(no|don't|dont|not|never|stop)\b.*\bdance\b/.test(t) || /\bdance\b.*\b(no|don't|dont|not|never|stop)\b/.test(t)) {
        return false;
      }
      if (/\bchicken dance\b/.test(t) || /\bdo the chicken\b/.test(t)) return true;
      if (/^(dance|dance!?|dance please)\.?$/i.test(t)) return true;
      if (/\bdance\b/.test(t)) {
        return /\b(do|can you|please|let'?s|show|chicken|time to|want to|wanna|for me|uncle tommy|tommy)\b/.test(t);
      }
      return /\b(do a dance|funny dance|your dance|shake it|bust a move)\b/.test(t);
    }

    function isFightRequest(text) {
      const t = text.toLowerCase().trim();
      if (!t) return false;
      if (
        /\b(no|don't|dont|not|never|stop)\b.*\b(fight|kung\s*fu|punch|karate)\b/.test(t) ||
        /\b(fight|kung\s*fu|punch|karate)\b.*\b(no|don't|dont|not|never|stop)\b/.test(t)
      ) {
        return false;
      }
      if (/\bkung\s*fu\b/.test(t) || /\bkarate\b/.test(t) || /\bmartial arts\b/.test(t)) return true;
      if (/\bpunch\b/.test(t)) return true;
      if (/^(fight|fight!?|fight please)\.?$/i.test(t)) return true;
      if (/\bfight\b/.test(t)) {
        return /\b(do|can you|please|let'?s|show|want to|wanna|for me|uncle tommy|tommy|with me)\b/.test(t);
      }
      return /\b(do a fight|fight move|fighting stance|show me your moves)\b/.test(t);
    }

    function isGoodbyeRequest(text) {
      const t = text.toLowerCase().trim();
      if (!t) return false;
      if (
        /\b(don'?t|dont|not|never|no)\b.*\b(bye|goodbye|leave|go)\b/.test(t) ||
        /\b(bye|goodbye|leave|go)\b.*\b(don'?t|dont|not|never|no)\b/.test(t)
      ) {
        return false;
      }
      if (/\b(bye[\s-]?bye|good[\s-]?bye)\b/.test(t)) return true;
      if (/^bye!?\.?$/i.test(t)) return true;
      if (/\bsee you\b|\bsee ya\b|\bcya\b/.test(t)) return true;
      if (/\b(gotta go|got to go|have to go|need to go|i'?m leaving|im leaving|time to go|must go)\b/.test(t)) return true;
      if (/\b(that'?s all|thats all|we'?re done|were done|stop talking|end (the )?conversation)\b/.test(t)) return true;
      if (/\b(nice to see you|good to see you|take care of|talk later about)\b/.test(t)) return false;
      return false;
    }

    function startLipsyncClock() {

          avatar.setSpeechElapsedMs(Math.max(0, (ctx.currentTime - speechPlaybackStart) * 1000));
        }
        lipsyncRaf = requestAnimationFrame(tick);
      };
      lipsyncRaf = requestAnimationFrame(tick);

    function stopLipsyncClock() {

    function appendResponseText(delta) {

    function sendFunctionOutput(callId, output) {
      ws.send(JSON.stringify({
        type: "conversation.item.create",

    function handleEndConversationTool(callId, argsJson) {
      if (replayingPrepMessages) return;
      if (ws?.readyState !== WebSocket.OPEN) {
        uiLog("end", "end_conversation tool ignored — ws not open", "warn", { ws: wsStateLabel() });
        return;
      }

      let reason = "user said goodbye";
      try {
        const args = JSON.parse(argsJson || "{}");
        if (args.reason) reason = args.reason;
      } catch {}

      if (callId) sendFunctionOutput(callId, { success: true, reason });
      if (pendingEndConversation) {
        uiLog("end", `end_conversation tool duplicate (${reason})`, "hello");
        return;
      }

      uiLog("end", `end_conversation tool (${reason})`, "hello");
      pendingEndConversation = true;
      setStatus("Goodbye!");
      startByebyeAnimation();
      closeAfterToolEnd();
      setTimeout(closeAfterToolEnd, 1500);
      scheduleForceCloseAfterTool();

    function handleFunctionCall(event) {
      if (ws?.readyState !== WebSocket.OPEN) return;

      const { name, call_id: callId, arguments: argsJson } = resolveFunctionCall(event);
      if (!name || !callId) {
        console.warn("Function call missing name or call_id", event);
        return;
      }
      if (handledFunctionCallIds.has(callId)) return;
      handledFunctionCallIds.add(callId);

      if (name === HAPPY) {
        let reason = "user asked to dance";
        try {
          const args = JSON.parse(argsJson || "{}");
          if (args.reason) reason = args.reason;
        } catch {}
        const danceUrl = pickRandomDanceUrl();
        avatar?.playMixamoAnimation(danceUrl);
        lastChickenDanceAt = Date.now();
        sendFunctionOutput(callId, { success: true, reason, animation: animationNameFromUrl(danceUrl) });
        ws.send(JSON.stringify({ type: "response.create" }));
        return;
      }

      if (name === KUNGFU) {
        let reason = "user asked to fight";
        try {
          const args = JSON.parse(argsJson || "{}");
          if (args.reason) reason = args.reason;
        } catch {}
        const kungfuUrl = pickRandomKungfuUrl();
        avatar?.playMixamoAnimation(kungfuUrl);
        lastKungfuAt = Date.now();
        sendFunctionOutput(callId, { success: true, reason, animation: animationNameFromUrl(kungfuUrl) });
        ws.send(JSON.stringify({ type: "response.create" }));
        return;
      }

      const gameToolMatch = {
        [PLAY_WORDWHACK]: "wordwhack",
        [PLAY_CARDGAME]: "cardgame",
        [PLAY_FINDGAME]: "findgame",
      }[name];

      if (gameToolMatch) {
        let reason = "user asked to play a game";
        try {
          const args = JSON.parse(argsJson || "{}");
          if (args.reason) reason = args.reason;
        } catch {}
        const game = getGameById(gameToolMatch);
        if (!game) {
          sendFunctionOutput(callId, { success: false, error: `Unknown game: ${gameToolMatch}` });
          ws.send(JSON.stringify({ type: "response.create" }));
          return;
        }
        sendFunctionOutput(callId, {
          success: true,
          reason,
          game: game.id,
          game_name: game.name,
        });
        ws.send(JSON.stringify({ type: "response.create" }));
        launchGame(reason, game);
        return;
      }

      if (name === END_CONVERSATION) {
        if (replayingPrepMessages) return;
        uiLog("end", "function_call end_conversation received", "hello", { callId });
        handleEndConversationTool(callId, argsJson);
      }
    }

    async function getConfig(forceRefresh = false) {
      if (cachedConfig && !forceRefresh) return cachedConfig;

        const res = await fetch("/api/config");

    }

    function releasePrepMic(prep) {
      if (!prep) return;
      try { prep.proc?.disconnect(); } catch {}
      try { prep.source?.disconnect(); } catch {}
      prep.proc = null;
      prep.source = null;
      try { prep.stream?.getTracks().forEach((t) => t.stop()); } catch {}
      prep.stream = null;
      try { if (prep.ctx?.state !== "closed") prep.ctx?.close(); } catch {}
      prep.ctx = null;
    }

    function abortConnectPrep() {
      if (!connectPrep) return;
      const prep = connectPrep;
      connectPrep = null;
      prep.aborted = true;
      prep.messageQueue = [];
      try { prep.ws?.close(); } catch {}
      releasePrepMic(prep);
    }

    function waitForWsOpen(socket, timeoutMs = 12000) {
      if (socket.readyState === WebSocket.OPEN) return Promise.resolve();
      if (socket.readyState === WebSocket.CLOSING || socket.readyState === WebSocket.CLOSED) {
        return Promise.reject(new Error("WebSocket closed before open"));
      }
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("WebSocket open timeout")), timeoutMs);
        socket.addEventListener("open", () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
        socket.addEventListener("close", () => {
          clearTimeout(timer);
          reject(new Error("WebSocket closed before open"));
        }, { once: true });
      });
    }

    function openSessionWebSocket(cfg, apiKey) {
      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${wsProtocol}//${location.host}/ws`);
      return new Promise((resolve, reject) => {
        socket.onopen = () => {
          uiLog("session", "ws open", "hello");
          socket.send(JSON.stringify({
            type: "client.auth",
            apiKey,
            instructions: getSessionInstructions(cfg),
            voice: cfg.voice?.trim() || DEFAULT_VOICE,
            model: cfg.model?.trim() || DEFAULT_MODEL,
          }));
          resolve(socket);
        };
        socket.onerror = () => reject(new Error("WebSocket failed"));
        socket.onclose = () => reject(new Error("WebSocket closed"));
      });
    }

    function setupMicPipeline() {
      if (ctx?.state === "suspended") ctx.resume().catch(() => {});
      source = ctx.createMediaStreamSource(stream);
      proc = ctx.createScriptProcessor(2048, 1, 1);
      proc.onaudioprocess = ({ inputBuffer }) => {
        if (ws.readyState !== WebSocket.OPEN) return;
        const f = inputBuffer.getChannelData(0);
        const pcm = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, f[i] * 32768));
        ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64(pcm.buffer) }));
      };
      const silentGain = ctx.createGain();
      silentGain.gain.value = 0;
      source.connect(proc);
      proc.connect(silentGain);
      silentGain.connect(ctx.destination);
    }

    function handleWsMessage(data) {
      const e = JSON.parse(data);

      if (e.type === "client.error") {
        if (replayingPrepMessages) {
          uiLog("session", `client.error during prep replay (ignored): ${e.message}`, "warn");
          return;
        }
        uiLog("session", `client.error: ${e.message}`, "err");
        showErr(e.message);
        ws.close();
        return;
      }

      if (e.response_id) handleNewResponse(e.response_id);

      if (e.type === "response.created") {
        cancelIdleNudge();
        handleNewResponse(e.response?.id || e.response_id);
      }

      if (e.type === "response.output_text.delta" || e.type === "response.output_audio_transcript.delta") {
        appendResponseText(e.delta);
      }

      if (e.type === "response.output_text.done" || e.type === "response.output_audio_transcript.done") {
        if (e.text) responseText = e.text;
        else if (e.transcript) responseText = e.transcript;
        updateAgentCaption(responseText);
        syncLipsyncTimeline();
      }

      if (e.type === "response.output_audio.delta") {
        setStatus("Conversation active — speak anytime", true);

        const pcm16 = Uint8Array.from(atob(e.delta), (c) => c.charCodeAt(0));
        addAudioChunkMs(new Int16Array(pcm16.buffer));
        queue.push(pcm16.buffer);
        if (!playing) playNext();
      } else if (e.type === "response.output_item.added") {
        trackFunctionCallItem(e.item);
      } else if (e.type === "response.output_item.done") {
        trackFunctionCallItem(e.item);
        if (e.item?.type === "function_call") {
          handleFunctionCall({
            name: e.item.name,
            call_id: e.item.call_id || e.item.id,
            item_id: e.item.id,
            arguments: e.item.arguments || "{}",
          });
        }
      } else if (e.type === "conversation.item.input_audio_transcription.completed") {
        if (e.transcript?.trim()) showUserHeard(e.transcript);
        if (isDanceRequest(e.transcript)) triggerChickenDance(e.transcript);
        if (isFightRequest(e.transcript)) triggerKungfu(e.transcript);
        if (isGoodbyeRequest(e.transcript)) triggerEndConversation(e.transcript);
      } else if (e.type === "session.updated" || e.type === "session.created") {
        setStatus("Conversation active — speak anytime", true);
        avatar?.refreshAfterVisible();
      } else if (e.type === "input_audio_buffer.speech_started") {
        idleNudgeCount = 0;
        cancelIdleNudge();
        showUserListening();
        updateAgentCaption("");
        stopAudio();
        stopAvatarSpeech();
        resetResponseState(null);
      } else if (e.type === "input_audio_buffer.timeout_triggered") {
        setStatus("No speech detected — Uncle Tommy is checking in", true);
      } else if (e.type === "response.output_audio.done") {
        audioDone = true;
        maybeEndAvatarSpeech();
        closeAfterToolEnd();
        if (!replayingPrepMessages && !playing && queue.length === 0) scheduleIdleNudge();
      } else if (e.type === "response.done") {
        audioDone = true;
        maybeEndAvatarSpeech();
        closeAfterToolEnd();
        if (!replayingPrepMessages && !playing && queue.length === 0) scheduleIdleNudge();
      } else if (e.type === "response.function_call_arguments.done") {
        handleFunctionCall(e);
      }
    }

    function attachWsHandlers(socket) {
      socket.onmessage = ({ data }) => {
        try { handleWsMessage(data); } catch (err) {
          uiLog("session", `message handler: ${err?.message || err}`, "err");
        }
      };
      socket.onclose = (event) => {
        uiLog("session", "ws closed", "hello", {
          code: event.code,
          reason: event.reason || "(none)",
          wasClean: event.wasClean,
        });
        const shouldPlayByebye = pendingEndConversation;
        try { cleanupSession({ keepSessionView: shouldPlayByebye }); }
        catch (e) { console.error("cleanupSession threw", e); }
        finally {
          if (shouldPlayByebye) finishByebyeAndReturnToHelloCycle();
          else returnToHelloCycle();
        }
      };
    }

    function beginConnectPrep() {
      if (active) return Promise.resolve(null);
      if (connectPrep?.readyPromise) return connectPrep.readyPromise;

      const prep = {
        aborted: false,
        cfg: null,
        ctx: null,
        stream: null,
        ws: null,
        messageQueue: [],
        readyPromise: null,
      };
      connectPrep = prep;

      prep.readyPromise = (async () => {
        const cfg = await getConfig();
        prep.cfg = cfg;
        const apiKey = cfg.apiKey?.trim();
        if (!apiKey) throw new Error("NO_API_KEY");

        const micWork = (async () => {
          prep.ctx = new AudioContext({ sampleRate: 24000 });
          prep.stream = await navigator.mediaDevices.getUserMedia({
            audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
          });
        })();

        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        prep.ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);

        prep.ws.onopen = () => {
          if (prep.aborted) return;
          prep.ws.send(JSON.stringify({
            type: "client.auth",
            apiKey,
            instructions: getSessionInstructions(cfg),
            voice: cfg.voice?.trim() || DEFAULT_VOICE,
            model: cfg.model?.trim() || DEFAULT_MODEL,
          }));
        };

        prep.ws.onmessage = ({ data }) => {
          if (prep.aborted || active) return;
          prep.messageQueue.push(data);
        };

        await micWork;
        try {
          await waitForWsOpen(prep.ws);
        } catch (e) {
          uiLog("hello", `connect prep ws: ${e?.message || e}`, "warn");
        }
        if (prep.aborted) throw new Error("Connection prep aborted");
        return prep;
      })().catch((e) => {
        if (!prep.aborted) abortConnectPrep();
        throw e;
      });

      return prep.readyPromise;
    }

    function clearRecognitionWatchdog() {
      if (recognitionWatchdog) {
        clearTimeout(recognitionWatchdog);
        recognitionWatchdog = null;
      }
    }

    function armRecognitionWatchdog() {
      clearRecognitionWatchdog();
      recognitionWatchdog = setTimeout(() => {
        recognitionWatchdog = null;
        if (!listeningForWakeWord || !wakeWordEnabled || active) return;
        uiLog("hello", "watchdog: no speech activity, restarting recognition", "warn");
        stopWakeWordListening();
        scheduleWakeWordRestart("watchdog");
      }, RECOGNITION_WATCHDOG_MS);
    }

    function stopWakeWordListening() {
      uiLog("hello", "stopWakeWordListening", "hello");
      listeningForWakeWord = false;
      clearRecognitionWatchdog();
      if (wakeWordRestartTimer) {
        clearTimeout(wakeWordRestartTimer);
        wakeWordRestartTimer = null;
      }
      if (recognition) {
        recognition.onstart = null;
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch {}
        try { recognition.abort(); } catch (e) {
          uiLog("hello", "recognition.abort failed", "warn", { message: e?.message });
        }
      }
      recognition = null;
    }

    function resumeWakeWordListening() {
      returnToHelloCycle();
    }

    function containsWakeWord(text) {
      return text.toLowerCase().split(/\s+/).some((word) => word.replace(/[^\w]/g, "") === WAKE_WORD);
    }

    function startWakeWordListening() {
      if (!SpeechRecognition) {
        uiLog("hello", "SpeechRecognition unsupported", "err");
        showErr("Speech recognition is not supported in this browser. Use the Start button instead.");
        setStatus("Tap Start to begin a conversation");
        return;
      }
      if (active || listeningForWakeWord || !wakeWordEnabled) {
        uiLog("hello", "startWakeWordListening skipped", "warn", snapshotHelloCycleState());
        return;
      }

      uiLog("hello", "startWakeWordListening", "hello");
      recognition = new SpeechRecognition();
      // continuous=true is unreliable on iOS Safari after getUserMedia sessions.
      recognition.continuous = !IS_IOS;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        uiLog("hello", "recognition.onstart — mic active for wake word", "hello");
        armRecognitionWatchdog();
      };

      recognition.onresult = (event) => {
        armRecognitionWatchdog();
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          const isFinal = event.results[i].isFinal;
          uiLog("hello", `heard "${transcript.trim()}"${isFinal ? " (final)" : ""}`, "hello");
          if (containsWakeWord(transcript)) {
            uiLog("hello", "wake word matched → connectConversation", "hello");
            wakeWordEnabled = false;
            wakeWordRestartAttempts = 0;
            stopWakeWordListening();
            setStatus("Wake word detected — connecting…");
            connectConversation();
            return;
          }
        }
      };

      recognition.onerror = (event) => {
        listeningForWakeWord = false;
        uiLog("hello", `recognition error: ${event.error}`, event.error === "not-allowed" ? "err" : "warn");
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          showErr("Microphone access denied for speech recognition. Tap Start to begin.");
          setStatus("Tap Start to begin a conversation");
          return;
        }
        // iOS often fires "no-speech" / "audio-capture" after the mic was
        // held by getUserMedia — retry with backoff.
        scheduleWakeWordRestart(`error:${event.error}`);
      };

      recognition.onend = () => {
        listeningForWakeWord = false;
        uiLog("hello", "recognition ended", "hello", snapshotHelloCycleState());
        if (wakeWordEnabled && !active) scheduleWakeWordRestart("onend");
      };

      try {
        recognition.start();
        listeningForWakeWord = true;
        wakeWordRestartAttempts = 0;
        setStatus('Listening for "Hello"…');
        showErr("");
        uiLog("hello", "recognition.start OK", "hello");
        armRecognitionWatchdog();
      } catch (e) {
        uiLog("hello", "recognition.start threw", "err", { message: e?.message });
        scheduleWakeWordRestart("start-threw");
      }
    }

    function scheduleWakeWordRestart(reason = "unknown") {
      if (!wakeWordEnabled || active) {
        uiLog("hello", `scheduleWakeWordRestart skipped (${reason})`, "warn", snapshotHelloCycleState());
        return;
      }
      if (wakeWordRestartTimer) clearTimeout(wakeWordRestartTimer);
      // Exponential backoff: iOS Safari blocks rapid recognition.start()
      // calls after getUserMedia was used. Give it progressively more time.
      wakeWordRestartAttempts = Math.min(wakeWordRestartAttempts + 1, 6);
      const base = WAKE_WORD_RESTART_DELAY;
      const delay = base * Math.pow(1.6, wakeWordRestartAttempts - 1);
      uiLog("hello", `schedule restart in ${Math.round(delay)}ms (${reason})`, "hello", {
        attempt: wakeWordRestartAttempts,
      });
      // After several failed attempts on iOS, hint that tapping Start works.
      if (IS_IOS && wakeWordRestartAttempts >= 4) {
        setStatus('Tap "Start" or say "Hello" to begin');
      }
      wakeWordRestartTimer = setTimeout(() => {
        wakeWordRestartTimer = null;
        uiLog("hello", `backoff timer fired (${reason})`, "hello", snapshotHelloCycleState());
        if (wakeWordEnabled && !active) startWakeWordListening();
        else uiLog("hello", "backoff timer skipped", "warn", snapshotHelloCycleState());
      }, delay);
    }

    async function connectConversation({ preparedView = false } = {}) {
      if (active) {
        uiLog("session", "connectConversation skipped — already active", "warn");
        return;
      }

      uiLog("session", "connectConversation begin", "hello");
      const cfg = cachedConfig || await getConfig();
      const apiKey = cfg.apiKey?.trim();
      if (!apiKey) {
        uiLog("session", "no API key", "err");
        showErr("No API key set.");
        abortConnectPrep();
        if (preparedView) abortPreparedConversationView();
        resumeWakeWordListening();
        return;
      }

      showErr("");
      btnStart.disabled = true;
      btnStart.textContent = "Connecting…";
      setStatus("Connecting to Uncle Tommy…");

      pendingEndConversation = false;
      pendingFunctionCalls.clear();
      handledFunctionCallIds.clear();
      idleNudgeCount = 0;
      cancelIdleNudge();
      if (endConversationCloseTimer) {
        clearTimeout(endConversationCloseTimer);
        endConversationCloseTimer = null;
      }
      byebyeAnimationPromise = null;

      let prep = connectPrep;
      connectPrep = null;
      const queuedMessages = [];

      try {
        if (prep) {
          try { await prep.readyPromise; } catch (e) {
            uiLog("session", `connect prep wait: ${e?.message || e}`, "warn");
          }
          if (!prep.aborted && prep.stream && prep.ctx) {
            ctx = prep.ctx;
            stream = prep.stream;
          }
          if (!prep.aborted && prep.ws?.readyState === WebSocket.OPEN) {
            ws = prep.ws;
            queuedMessages.push(...prep.messageQueue);
          } else {
            try { prep.ws?.close(); } catch {}
          }
          prep.ctx = null;
          prep.stream = null;
          prep.ws = null;
          prep.messageQueue = [];
        }

        if (!stream || !ctx) {
          ctx = new AudioContext({ sampleRate: 24000 });
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
          });
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          ws = await openSessionWebSocket(cfg, apiKey);
        }
      } catch (e) {
        const denied = e?.name === "NotAllowedError" || e?.name === "NotFoundError";
        uiLog("session", denied ? "getUserMedia denied" : `connect failed: ${e?.message}`, "err");
        showErr(denied ? "Microphone access denied." : "Could not connect. Try again.");
        try { ws?.close(); } catch {}
        ws = null;
        abortConnectPrep();
        releaseMicSync();
        btnStart.textContent = "Start Conversation";
        btnStart.disabled = false;
        if (preparedView) abortPreparedConversationView();
        resumeWakeWordListening();
        return;
      }

      resetResponseState(null);
      clearConversationCaptions();
      attachWsHandlers(ws);
      active = true;
      setupMicPipeline();
      uiLog("session", "session live", "hello", { prep: Boolean(prep), queued: queuedMessages.length });

      if (queuedMessages.length) {
        replayingPrepMessages = true;
        try {
          for (const data of queuedMessages) {
            try { handleWsMessage(data); } catch (err) {
              uiLog("session", `replay message: ${err?.message || err}`, "warn");
            }
          }
        } finally {
          replayingPrepMessages = false;
        }
      }

      if (!preparedView && !inSession) {
        await enterSessionView();
      }
    }

    function endConversation() {
      uiLog("end", "End Conversation button", "hello", snapshotHelloCycleState());
      if (!active) {
        uiLog("end", "End Conversation ignored — not active", "warn");
        return;
      }
      ws.close();
    }

    function playNext() {
      if (!queue.length) {
        playing = false;
        maybeEndAvatarSpeech();
        closeAfterToolEnd();
        if (audioDone) scheduleIdleNudge();
        return;
      }

      playing = true;
      beginAvatarSpeech();

      const pcm16 = new Int16Array(queue.shift());
      const len = pcm16.length;
      const fade = 48;
      const f32 = new Float32Array(len);
      for (let i = 0; i < len; i++) f32[i] = pcm16[i] / 32768;
      for (let i = 0; i < fade; i++) {
        f32[i] *= i / fade;
        f32[len - 1 - i] *= i / fade;
      }

      const buf = ctx.createBuffer(1, len, 24000);
      buf.getChannelData(0).set(f32);
      src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);

      const t = Math.max(ctx.currentTime, nextPlayTime);
      if (!speechPlaybackStart) speechPlaybackStart = t;
      nextPlayTime = t + buf.duration;
      src.onended = playNext;
      src.start(t);
    }

    function stopAudio() {
      queue.length = 0;
      playing = false;
      nextPlayTime = 0;
      try { src?.stop(); } catch {}
      src = null;
    }

    function b64(buf) {
      const b = new Uint8Array(buf);
      let s = "";
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
      return btoa(s);
    }

    btnStart.addEventListener("click", async () => {
      uiLog("hello", "Start button clicked", "hello");
      wakeWordEnabled = false;
      wakeWordRestartAttempts = 0;
      stopWakeWordListening();
      beginConnectPrep().catch(() => {});
      await Promise.all([
        enterSessionView(),
        connectConversation({ preparedView: true }),
      ]);
    });

    btnStop.addEventListener("click", endConversation);
    btnSendLog.addEventListener("click", sendDebugLogToServer);

    window.addEventListener("resize", () => {
      if (inSession) avatar?.refreshAfterVisible();
    });

    // iOS Safari creates AudioContexts in "suspended" state and only allows
    // resume() from a user gesture. Warm one up on the first touch so that
    // later wake-word-triggered sessions (which have no fresh gesture) can
    // resume their own context.
    if (IS_IOS) {
      const unlock = () => {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ac.createOscillator();
          const g = ac.createGain();
          g.gain.value = 0;
          osc.connect(g);
          g.connect(ac.destination);
          osc.start();
          osc.stop(ac.currentTime + 0.001);
          ac.resume().then(() => ac.close()).catch(() => {});
        } catch {}
        window.removeEventListener('pointerdown', unlock);
        window.removeEventListener('keydown', unlock);
      };
      window.addEventListener('pointerdown', unlock, { once: false });
      window.addEventListener('keydown', unlock, { once: false });
    }

    async function init() {
      const fromGame = shouldAutoConnectFromGame();
      setSplashProgress(5);
      const cfg = await getConfig();
      setSplashProgress(10);

      if (fromGame) {
        dismissSplash();
        dismissIdleVideoScreen();
        setIdleVideoMode(false);
        setVideosLoading(false);
        preloadMediaAssets(cfg).catch((e) => console.warn("background preload:", e));
        initDailyRewards({ autoShow: false });
        try {
          await autoConnectFromGameReturn();
        } catch (e) {
          console.error(e);
          showErr(`Failed to connect: ${e.message}`);
          setStatus('Tap "Start" to begin a conversation');
        }
        return;
      }

      try {
        const idleVideoReady = await preloadMediaAssets(cfg);
        dismissSplash();

        if (idleVideoReady) {
          startIdleVideoPlayback();
          setStatus("Tap the screen to begin a conversation");
        } else if (ENABLE_WAKE_WORD) {
          startWakeWordListening();
        } else {
          setStatus('Tap "Start" to begin a conversation');
        }
        initDailyRewards({ autoShow: true });
      } catch (e) {
        console.error(e);
        dismissSplash();
        showErr(`Failed to load: ${e.message}`);
        setStatus('Tap "Start" to begin a conversation');
      }
    }

    // Safety net: if wake-word listening dies silently (Chrome's
    // SpeechRecognition can stop without firing onend, and iOS Safari
    // can fail to restart after getUserMedia released the mic), make
    // sure it gets restarted.
    if (ENABLE_WAKE_WORD) {
      setInterval(() => {
        if (wakeWordEnabled && !active && !listeningForWakeWord && !wakeWordRestartTimer) {
          uiLog("hello", "safety net restart (idle but not listening)", "warn", snapshotHelloCycleState());
          wakeWordRestartAttempts = 0;
          startWakeWordListening();
        }
      }, 4000);
    }

    setInterval(() => {
      refreshIdleVideosForCurrentPeriod().catch(() => {});
    }, 60_000);

    uiLog("hello", "app init", "hello", { IS_IOS, WAKE_WORD_RESTART_DELAY, POST_SESSION_WAKE_DELAY });
    initVideoSoundUnlock();
    updateHkoDateTime();
    setInterval(updateHkoDateTime, 1000);
    loadHkoWeather();
    setInterval(() => { loadHkoWeather().catch(() => {}); }, 10 * 60 * 1000);
    init();
  </script>
</body>
</html>
