<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <title>Uncle Tommy — Voice Agent</title>
  <script>
    if (new URLSearchParams(location.search).has("connect")) {
      document.documentElement.classList.add("game-return-connect");
    }
  </script>
  <link rel="preload" href="/langoLogo.jpeg" as="image">
  <link rel="preload" href="/visme/Tommyv4.vrm" as="fetch" crossorigin>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.3.4/lib/three-vrm-animation.module.js",
        "vrm-mixamo-retarget": "https://cdn.jsdelivr.net/npm/vrm-mixamo-retarget@1.0.3/dist/index.esm.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaed;
    }

    /* ── Portrait blocker ── */
    #portrait-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      background: #0f1117;
      text-align: center;
    }

    #portrait-prompt svg {
      width: 64px;
      height: 64px;
      color: #6c8cff;
      animation: rotate-hint 2s ease-in-out infinite;
    }

    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #portrait-prompt { display: flex; }
      #app { display: none !important; }
    }

    #app {
      width: 100%;
      height: 100%;
    }

    /* ── Splash screen (logo while assets preload) ── */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    #splash-screen img {
      width: min(70vw, 420px);
      height: auto;
      max-height: 60vh;
      object-fit: contain;
    }

    body.splash-dismissed #splash-screen {
      display: none;
    }

    /* ── Idle screen (before Inworld session) ── */
    #idle-screen {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 1.5rem;
      gap: 1rem;
    }

    #idle-screen h1 {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
    }

    .idle-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: min(420px, 100%);
    }

    #status-idle {
      color: #9aa0a6;
      font-size: 0.875rem;
      text-align: center;
    }

    #err-idle {
      display: none;
      max-width: 100%;
      padding: 0.625rem 0.75rem;
      border-radius: 8px;
      background: #3a1e1e;
      color: #f28b82;
      font-size: 0.8125rem;
      text-align: center;
    }

    /* ── Fullscreen avatar (only during session) ── */
    #avatar-stage {
      /* Keep in layout (not display:none) so WebGL can upload textures while preloading. */
      visibility: hidden;
      pointer-events: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #0b1222;
    }

    #avatar-stage.has-bg-image {
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 100% auto;
    }

    body.in-session #avatar-stage {
      visibility: visible;
      pointer-events: auto;
    }

    body.in-session #idle-screen {
      display: none;
    }

    /* Game return (?connect=1): skip idle / transition / start UI — show avatar immediately */
    html.game-return-connect #idle-screen,
    html.game-return-connect #idle-video-screen {
      display: none !important;
    }

    html.game-return-connect #avatar-stage {
      visibility: visible;
      pointer-events: auto;
    }

    html.game-return-connect #session-overlay {
      display: block;
    }

    #vrm-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ── Session overlay controls ── */
    #session-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    body.in-session #session-overlay {
      display: block;
    }

    .overlay-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(0.75rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.75rem max(1rem, env(safe-area-inset-left));
      pointer-events: auto;
      background: linear-gradient(to bottom, rgba(15, 17, 23, 0.75), transparent);
    }

    .overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      pointer-events: auto;
      background: linear-gradient(to top, rgba(15, 17, 23, 0.85), transparent);
    }

    .overlay-games {
      position: absolute;
      right: max(0.75rem, env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      pointer-events: auto;
    }

    .game-shortcut {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(5.5rem, 14vw, 6.7rem);
      height: clamp(5.5rem, 14vw, 6.7rem);
      border-radius: 22px;
      background: rgba(15, 17, 23, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .game-shortcut:hover {
      transform: scale(1.06);
      background: rgba(32, 38, 52, 0.92);
      border-color: rgba(108, 140, 255, 0.45);
    }

    .game-shortcut img {
      width: 62%;
      height: 62%;
      object-fit: contain;
      pointer-events: none;
    }

    .game-shortcut--card img {
      width: 72%;
      height: 72%;
    }

    .game-shortcut--find img {
      width: 78%;
      height: 78%;
      border-radius: 6px;
    }

    button {
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 8px;
      background: #6c8cff;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #5a7aef; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #btn-stop {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #btn-stop:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
    }

    #status {
      color: #c4c7c5;
      font-size: 0.875rem;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    #status.active { color: #81c995; }

    #avatar-status {
      margin: 0;
      font-size: 0.75rem;
      color: #9aa0a6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .overlay-top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #btn-save-camera {
      display: none;
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }

    body.camera-edit-mode #btn-save-camera {
      display: inline-block;
    }

    body.camera-edit-mode #avatar-status {
      color: #c4c7c5;
    }

    #btn-save-camera:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }

    #camera-save-status {
      display: none;
      font-size: 0.6875rem;
      color: #81c995;
      min-width: 4rem;
      text-align: right;
    }

    body.camera-edit-mode #camera-save-status {
      display: block;
    }

    #camera-height-controls {
      display: none;
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      flex-direction: column;
      gap: 0.5rem;
    }

    body.camera-edit-mode #camera-height-controls {
      display: flex;
    }

    #camera-height-controls button {
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 17, 23, 0.75);
      color: #e8eaed;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #camera-height-controls button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.35);
    }

    #camera-height-controls button:active {
      background: rgba(108, 140, 255, 0.35);
    }

    #camera-save-status.err { color: #f28b82; }

    a {
      color: #9aa0a6;
      font-size: 0.8125rem;
      text-decoration: none;
    }

    a:hover { color: #6c8cff; }

    #err {
      display: none;
      max-width: min(480px, 90vw);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: rgba(58, 30, 30, 0.9);
      color: #f28b82;
      font-size: 0.8125rem;
      text-align: center;
    }

    #btn-send-log {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.45rem 0.75rem;
      font-size: 0.8125rem;
      background: rgba(255, 255, 255, 0.1);
    }

    #btn-send-log:hover:not(:disabled) { background: rgba(255, 255, 255, 0.16); }

    #debug-upload-status {
      margin-top: 0.375rem;
      font-size: 0.75rem;
      color: #81c995;
      text-align: center;
      min-height: 1.125rem;
    }

    #debug-upload-status.err { color: #f28b82; }

    /* ── Conversation captions (what avatar hears / says) ── */
    #conversation-captions {
      position: absolute;
      left: max(1rem, env(safe-area-inset-left));
      bottom: calc(5.75rem + env(safe-area-inset-bottom));
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: min(420px, calc(100vw - 8rem - env(safe-area-inset-left) - env(safe-area-inset-right)));
      max-height: 38vh;
      overflow-y: auto;
      pointer-events: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .caption-line {
      display: none;
      padding: 0.55rem 0.8rem;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.35;
      backdrop-filter: blur(10px);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      animation: caption-in 0.22s ease;
    }

    .caption-line.visible {
      display: block;
    }

    .caption-line--user {
      background: rgba(108, 140, 255, 0.22);
      border: 1px solid rgba(108, 140, 255, 0.35);
    }

    .caption-line--agent {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .caption-line--listening {
      color: #c4c7c5;
      font-style: italic;
    }

    .caption-label {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9aa0a6;
    }

    @keyframes caption-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Idle screen video (before conversation) ── */
    #idle-video-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3;
      background: #0b1222;
      cursor: pointer;
    }

    .screen-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      background: #0b1222;
    }

    #transition-video {
      opacity: 0;
      visibility: hidden;
      z-index: 1;
    }

    body.playing-transition-video #idle-video {
      visibility: hidden;
    }

    body.playing-transition-video #transition-video {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    #idle-video-loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0b1222;
      color: #9aa0a6;
      font-size: 0.9375rem;
      pointer-events: none;
    }

    body.has-idle-video.videos-loading #idle-video-loading {
      display: flex;
    }

    body.has-idle-video.videos-loading #idle-video,
    body.has-idle-video.videos-loading #transition-video,
    body.has-idle-video.videos-loading #idle-video-hint {
      visibility: hidden;
    }

    body.has-idle-video #idle-video-screen {
      display: block;
    }

    body.has-idle-video.in-session #idle-video-screen {
      display: none;
    }

    body.idle-video-dismissed #idle-video-screen {
      display: none !important;
    }

    body.has-idle-video #idle-screen {
      display: none;
    }

    body.playing-transition-video #idle-video-screen {
      cursor: default;
      pointer-events: none;
    }

    body.playing-transition-video #idle-video-hint {
      display: none;
    }

    #idle-video {
      z-index: 0;
    }

    #idle-video-hint {
      position: absolute;
      left: 50%;
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 0.625rem 1rem;
      border-radius: 999px;
      background: rgba(15, 17, 23, 0.72);
      color: #e8eaed;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      pointer-events: none;
      backdrop-filter: blur(8px);
      animation: idle-hint-pulse 2.4s ease-in-out infinite;
    }

    @keyframes idle-hint-pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    /* ── Game launch transition ── */
    #game-launch-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at 50% 30%, #2a1f6e 0%, #0f1117 55%, #05060a 100%);
      overflow: hidden;
    }

    #game-launch-overlay.visible {
      display: flex;
    }

    .game-launch-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.7) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 78% 12%, rgba(255,255,255,0.55) 50%, transparent 51%),
        radial-gradient(2px 2px at 34% 72%, rgba(255,255,255,0.45) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 88% 64%, rgba(255,255,255,0.6) 50%, transparent 51%),
        radial-gradient(2px 2px at 56% 38%, rgba(255,255,255,0.35) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 22% 48%, rgba(255,255,255,0.5) 50%, transparent 51%);
      animation: game-launch-twinkle 2.4s ease-in-out infinite alternate;
    }

    @keyframes game-launch-twinkle {
      0% { opacity: 0.55; }
      100% { opacity: 1; }
    }

    .game-launch-card {
      position: relative;
      z-index: 1;
      width: min(92vw, 420px);
      padding: 2rem 1.75rem 1.75rem;
      border-radius: 28px;
      text-align: center;
      background: linear-gradient(165deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.05) 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: game-launch-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes game-launch-pop {
      0% { transform: scale(0.72) rotate(-4deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .game-launch-kicker {
      margin: 0 0 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b8c5ff;
    }

    .game-launch-title {
      margin: 0 0 1.25rem;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 2px 12px rgba(108, 140, 255, 0.35);
    }

    .game-launch-reel {
      position: relative;
      width: clamp(7.5rem, 22vw, 9.5rem);
      height: clamp(7.5rem, 22vw, 9.5rem);
      margin: 0 auto 1.25rem;
      border-radius: 24px;
      background: rgba(15, 17, 23, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .game-launch-reel.shuffling .game-launch-icon {
      animation: game-launch-shuffle 0.12s ease-in-out infinite alternate;
    }

    .game-launch-reel.landed .game-launch-icon {
      animation: game-launch-land 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes game-launch-shuffle {
      0% { transform: scale(0.88) rotate(-6deg); opacity: 0.65; }
      100% { transform: scale(1.02) rotate(6deg); opacity: 1; }
    }

    @keyframes game-launch-land {
      0% { transform: scale(0.5) rotate(-18deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .game-launch-icon {
      position: absolute;
      inset: 14%;
      width: 72%;
      height: 72%;
      margin: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35));
    }

    .game-launch-name {
      margin: 0 0 0.35rem;
      min-height: 1.5em;
      font-size: clamp(1rem, 3.2vw, 1.2rem);
      font-weight: 600;
      color: #e8eaed;
    }

    .game-launch-sub {
      margin: 0 0 1.25rem;
      min-height: 1.25em;
      font-size: 0.875rem;
      color: #9aa0a6;
    }

    .game-launch-progress {
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .game-launch-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6c8cff, #a78bfa, #f472b6);
      background-size: 200% 100%;
      animation: game-launch-bar-shine 1.2s linear infinite;
      transition: width 0.35s ease;
    }

    @keyframes game-launch-bar-shine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .game-launch-confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .game-launch-confetti span {
      position: absolute;
      top: -12%;
      width: 10px;
      height: 14px;
      border-radius: 2px;
      opacity: 0;
      animation: game-launch-confetti-fall 1.8s ease-in forwards;
    }

    @keyframes game-launch-confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(115vh) rotate(720deg); opacity: 0.85; }
    }

    .game-launch-card.theme-wordwhack { border-color: rgba(255, 214, 120, 0.35); }
    .game-launch-card.theme-cardgame { border-color: rgba(120, 180, 255, 0.35); }
    .game-launch-card.theme-findgame { border-color: rgba(120, 255, 180, 0.35); }
  </style>
</head>
<body>
  <div id="splash-screen" aria-label="Loading">
    <img src="/langoLogo.jpeg" alt="Lango" width="420" height="420" decoding="async">
  </div>

  <div id="portrait-prompt">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18v.01"/>
    </svg>
    <p>Rotate your device to landscape to use Uncle Tommy</p>
  </div>

  <div id="app">
    <div id="idle-video-screen" aria-label="Tap to start conversation">
      <video id="idle-video" class="screen-video" loop playsinline preload="auto"></video>
      <video id="transition-video" class="screen-video" playsinline preload="auto"></video>
      <div id="idle-video-loading">Loading videos…</div>
      <div id="idle-video-hint">Tap to start conversation</div>
    </div>

    <div id="idle-screen">
      <h1>Uncle Tommy</h1>
      <div class="idle-controls">

    async function playGameLaunchTransition(game) {
      if (!gameLaunchOverlay || !game) return;

      launchingGame = true;
      gameLaunchOverlay.classList.add("visible");

      gameLaunchReel.className = "game-launch-reel shuffling";
      setGameLaunchProgress(8);
      spawnGameLaunchConfetti();

      const shuffleMs = 1800;
      const shuffleStart = performance.now();
      let shuffleIndex = 0;

      await new Promise((resolve) => {
        const tick = () => {
          const elapsed = performance.now() - shuffleStart;
          const candidate = GAME_CATALOG[shuffleIndex % GAME_CATALOG.length];
          gameLaunchIcon.src = candidate.icon;
          gameLaunchIcon.alt = candidate.name;
          shuffleIndex += 1;
          setGameLaunchProgress(8 + Math.min(52, (elapsed / shuffleMs) * 52));
          if (elapsed >= shuffleMs) {
            resolve();
            return;
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });

      gameLaunchReel.className = "game-launch-reel landed";
      gameLaunchIcon.src = game.icon;
      gameLaunchIcon.alt = game.name;
      gameLaunchHeading.textContent = "You got…";
      gameLaunchName.textContent = game.name;
      gameLaunchSub.textContent = game.sub;

      spawnGameLaunchConfetti();
      await waitMs(900);

      gameLaunchHeading.textContent = "Loading game!";
      gameLaunchSub.textContent = "Get ready to play";

    }

    function scheduleIdleNudge() {
      cancelIdleNudge();
      if (!active || pendingEndConversation || ws?.readyState !== WebSocket.OPEN) return;
      if (idleNudgeCount >= MAX_IDLE_NUDGES) {
        uiLog("idle", `nudge cap reached (${MAX_IDLE_NUDGES}) — scheduling end of conversation`, "warn");
        idleEndTimer = setTimeout(() => {
          idleEndTimer = null;
          if (!active || pendingEndConversation || ws?.readyState !== WebSocket.OPEN) return;
          if (playing || queue.length > 0) { scheduleIdleNudge(); return; }
          uiLog("idle", `user silent after ${MAX_IDLE_NUDGES} nudges → ending conversation`, "warn");
          pendingEndConversation = true;
          ws.send(JSON.stringify({
            type: "conversation.item.create",
            item: {
              type: "message",
              role: "user",
              content: [{ type: "input_text", text: "[The user has not responded after repeated check-ins. Give a brief, warm farewell and call end_conversation now.]" }],
            },
          }));
          ws.send(JSON.stringify({ type: "response.create" }));
          scheduleForceCloseAfterTool();
        }, IDLE_NUDGE_MS);
        return;
      }
      idleNudgeTimer = setTimeout(() => {
        idleNudgeTimer = null;
        if (!active || pendingEndConversation || ws?.readyState !== WebSocket.OPEN) return;
        if (playing || queue.length > 0) return;
        idleNudgeCount++;
        uiLog("idle", `user silent ${IDLE_NUDGE_MS / 1000}s → nudge #${idleNudgeCount}`, "hello");

    function preloadVideoElement(video, url) {
      if (!url) return Promise.resolve(false);

      return new Promise((resolve, reject) => {
        const cleanup = () => {
          video.removeEventListener("canplaythrough", onReady);
          video.removeEventListener("error", onError);
        };

        const onReady = () => {
          cleanup();
          resolve(true);
        };

        const onError = () => {
          cleanup();
          reject(new Error(`Failed to preload video: ${url}`));
        };

        video.preload = "auto";
        if (video.dataset.preloadUrl !== url) {
          video.dataset.preloadUrl = url;
          video.src = url;
          video.load();
        }

        if (video.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA) {
          onReady();
          return;
        }

        video.addEventListener("canplaythrough", onReady, { once: true });
        video.addEventListener("error", onError, { once: true });
      });
    }

    function parseTimeToMinutes(value) {
      if (!value || typeof value !== "string") return null;
      const match = value.trim().match(/^(\d{1,2}):(\d{2})$/);
      if (!match) return null;
      const h = Number(match[1]);
      const m = Number(match[2]);
      if (!Number.isFinite(h) || !Number.isFinite(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
      return h * 60 + m;
    }

    function isPairActiveNow(pair, date = new Date()) {
      const start = parseTimeToMinutes(pair.startTime ?? "00:00");
      const end = parseTimeToMinutes(pair.endTime ?? "23:59");
      if (start === null || end === null) return true;
      const now = date.getHours() * 60 + date.getMinutes();
      if (start === end) return true;
      if (start < end) return now >= start && now <= end;
      return now >= start || now <= end;
    }

    function pickVideoPair(videoPairs, date = new Date()) {
      const eligible = (videoPairs || []).filter((p) => p.loopVideo?.url && isPairActiveNow(p, date));
      if (!eligible.length) return null;
      return eligible[Math.floor(Math.random() * eligible.length)];
    }

    function getSessionInstructions(cfg) {
      const pairPrompt = activeVideoPair?.text?.trim();
      if (pairPrompt) return pairPrompt;
      return cfg.instructions?.trim() || DEFAULT_PROMPT;
    }

    function setupIdleVideosFromConfig(cfg, { autoplay = false } = {}) {
      activeVideoPair = pickVideoPair(cfg.videoPairs);
      let result;
      if (activeVideoPair) {
        result = setupIdleVideos(activeVideoPair.loopVideo, activeVideoPair.transitionVideo, {
          autoplay,
        });
      } else {
        const hasConfiguredPairs = (cfg.videoPairs || []).some((p) => p.loopVideo?.url);
        if (hasConfiguredPairs) {
          activeVideoPair = null;
          idleVideoHintText = "Tap to start conversation";
          result = setupIdleVideos(null, null, { autoplay, hintText: idleVideoHintText });
        } else {
          activeVideoPair = null;
          idleVideoHintText = "Tap to start conversation";
          result = setupIdleVideos(cfg.idleVideo, cfg.transitionVideo, { autoplay, hintText: idleVideoHintText });
        }
      }
      applyActivePairBackground(cfg);
      return result;
    }

    async function setupIdleVideos(idleVideo, transitionVideo, { autoplay = true, hintText = "Tap to start conversation" } = {}) {
      transitionVideoUrl = transitionVideo?.url || null;
      idleVideosReady = false;
      idleVideoHintText = hintText?.trim() || "Tap to start conversation";
      if (idleVideoHint) idleVideoHint.textContent = idleVideoHintText;

      if (!idleVideo?.url) {
        idleVideoUrl = null;
        setIdleVideoMode(false);
        setVideosLoading(false);
        idleVideoEl.removeAttribute("src");
        transitionVideoEl.removeAttribute("src");
        return false;
      }

      idleVideoUrl = idleVideo.url;
      setIdleVideoMode(true);
      setVideosLoading(true);
      if (idleVideoLoadingEl) idleVideoLoadingEl.textContent = "Loading videos…";

      idleVideoEl.loop = true;
      transitionVideoEl.loop = false;
      applyVideoAudioSettings(idleVideoEl);
      applyVideoAudioSettings(transitionVideoEl);
      transitionVideoEl.pause();

      const preloadTasks = [preloadVideoElement(idleVideoEl, idleVideo.url)];
      if (transitionVideoUrl) {
        preloadTasks.push(preloadVideoElement(transitionVideoEl, transitionVideoUrl));
      }

      try {
        await Promise.all(preloadTasks);
      } catch (e) {
        console.warn("Video preload failed:", e);
        uiLog("hello", `video preload warning: ${e.message}`, "warn");
      }

      idleVideosReady = true;
      setVideosLoading(false);
      transitionVideoEl.pause();
      transitionVideoEl.currentTime = 0;

      if (autoplay) {
        try {
          await playVideoWithSound(idleVideoEl);
        } catch {}
      }
      return true;
    }

    function resetIdleVideoElement() {
      if (!idleVideoUrl) return;
      playingTransitionVideo = false;
      setTransitionVideoMode(false);
      transitionVideoEl.onended = null;
      transitionVideoEl.onerror = null;
      transitionVideoEl.pause();
      transitionVideoEl.currentTime = 0;
      idleVideoHint.hidden = false;
      idleVideoHint.textContent = idleVideoHintText;
      idleVideoScreen.style.cursor = "pointer";
    }

    function dismissIdleVideoScreen() {
      document.body.classList.add("idle-video-dismissed");
      idleVideoEl.pause();
      transitionVideoEl.pause();
      playingTransitionVideo = false;
      setTransitionVideoMode(false);
    }

    function restoreIdleVideoScreen() {
      document.body.classList.remove("idle-video-dismissed");
    }

    function abortPreparedConversationView() {
      abortConnectPrep();
      exitSessionView();
      const skipIdle = directSessionEntry;
      directSessionEntry = false;
      if (skipIdle || !idleVideoUrl || active) return;
      restoreIdleVideoScreen();
      resetIdleVideoElement();
      playVideoWithSound(idleVideoEl);
    }

    async function playTransitionVideo() {
      const HANDOFF_BEFORE_END_SEC = 0.25;
      return new Promise((resolve, reject) => {
        playingTransitionVideo = true;
        setTransitionVideoMode(true);
        idleVideoHint.hidden = true;
        idleVideoScreen.style.cursor = "default";

        idleVideoEl.pause();
        transitionVideoEl.currentTime = 0;
        unlockVideoSound();
        transitionVideoEl.muted = false;
        transitionVideoEl.volume = 1;

        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          transitionVideoEl.onended = null;
          transitionVideoEl.onerror = null;
          transitionVideoEl.removeEventListener("timeupdate", onTimeUpdate);
          transitionVideoEl.pause();
          resolve();
        };

        const onTimeUpdate = () => {
          const remaining = transitionVideoEl.duration - transitionVideoEl.currentTime;
          if (Number.isFinite(remaining) && remaining <= HANDOFF_BEFORE_END_SEC) finish();
        };

        transitionVideoEl.addEventListener("timeupdate", onTimeUpdate);
        transitionVideoEl.onended = finish;
        transitionVideoEl.onerror = () => {
          transitionVideoEl.onended = null;
          transitionVideoEl.onerror = null;
          transitionVideoEl.removeEventListener("timeupdate", onTimeUpdate);
          reject(new Error("Transition video failed to play."));
        };

        transitionVideoEl.play().catch(reject);
      });
    }

    async function connectConversationAfterVideos() {
      wakeWordEnabled = false;
      wakeWordRestartAttempts = 0;
      stopWakeWordListening();
      dismissIdleVideoScreen();
      await Promise.all([
        enterSessionView(),
        connectConversation({ preparedView: true }),
      ]);
    }

    function shouldAutoConnectFromGame() {
      return new URLSearchParams(location.search).has("connect");
    }

    function clearAutoConnectParam() {
      if (!shouldAutoConnectFromGame()) return;
      const url = new URL(location.href);
      url.searchParams.delete("connect");
      const next = url.pathname + url.search + url.hash;
      history.replaceState(null, "", next || "/");
    }

    async function autoConnectFromGameReturn() {
      if (!shouldAutoConnectFromGame() || active) return;
      uiLog("hello", "auto-connect from game return", "hello");
      clearAutoConnectParam();
      wakeWordEnabled = false;
      wakeWordRestartAttempts = 0;
      stopWakeWordListening();
      dismissIdleVideoScreen();
      setIdleVideoMode(false);
      setVideosLoading(false);
      directSessionEntry = true;
      beginConnectPrep().catch(() => {});
      await Promise.all([
        enterSessionView(),
        connectConversation({ preparedView: true }),
      ]);
    }

    async function startConversationFromIdleTap() {
      if (active || idleVideoStarting || playingTransitionVideo || !idleVideosReady) return;
      idleVideoStarting = true;
      uiLog("hello", "idle video tapped", "hello");

      beginConnectPrep().catch((e) => {
        uiLog("hello", `connect prep: ${e?.message || e}`, "warn");
      });

      try {
        if (transitionVideoUrl) {
          uiLog("hello", "playing transition video (mic + ws warming in parallel)", "hello");
          try {
            await playTransitionVideo();
          } catch (e) {
            uiLog("hello", `transition video error: ${e.message}`, "warn");
          }
        }
        uiLog("hello", "transition complete → connectConversation", "hello");
        await connectConversationAfterVideos();
      } catch (e) {
        abortConnectPrep();
        throw e;
      } finally {
        idleVideoStarting = false;
      }
    }

    idleVideoScreen.addEventListener("click", (e) => {
      if (playingTransitionVideo || e.target.closest("button, a, input, select, textarea")) return;
      startConversationFromIdleTap();
    });

    async function refreshIdleVideosForCurrentPeriod() {
      if (inSession || active || playingTransitionVideo || idleVideoStarting) return;
      const cfg = cachedConfig || await getConfig();
      const nextPair = pickVideoPair(cfg.videoPairs);
      const nextId = nextPair?.id ?? null;
      const currentId = activeVideoPair?.id ?? null;
      if (nextId === currentId) {
        if (nextPair) {
          activeVideoPair = nextPair;
          applyActivePairBackground(cfg);
        }
        return;
      }
      const wasPlaying = Boolean(idleVideoUrl) && !document.body.classList.contains("idle-video-dismissed");
      await setupIdleVideosFromConfig(cfg, { autoplay: wasPlaying });
      if (wasPlaying && idleVideoUrl) {
        restoreIdleVideoScreen();
        resetIdleVideoElement();
        playVideoWithSound(idleVideoEl);
      }
    }

    function resumeIdleVideo() {
      if (inSession || active) return;
      refreshIdleVideosForCurrentPeriod().then(() => {
        if (!idleVideoUrl) return;
        restoreIdleVideoScreen();
        resetIdleVideoElement();
        idleVideoEl.currentTime = 0;
        playVideoWithSound(idleVideoEl);
      });
    }

    function loadAvatarFromLocalStorage() {
      try {
        return normalizeAvatar(JSON.parse(localStorage.getItem(AVATAR_KEY) || "{}"));
      } catch {
        return { ...DEFAULT_AVATAR };
      }
    }

    function loadLipsyncFromLocalStorage() {

      }

    async function saveCameraSettings() {
      if (!avatar?.loaded) {
        cameraSaveStatusEl.textContent = "Avatar not ready";
        cameraSaveStatusEl.className = "err";
        return;
      }
      const cameraSettings = normalizeAvatar(avatar.getCameraSettings());
      btnSaveCamera.disabled = true;
      cameraSaveStatusEl.textContent = "Saving…";
      cameraSaveStatusEl.className = "";

      const cfg = await getConfig();
      const payload = {
        apiKey: cfg.apiKey?.trim() || localStorage.getItem(KEY)?.trim() || "",
        instructions: cfg.instructions ?? localStorage.getItem(PROMPT_KEY) ?? "",
        voice: cfg.voice ?? localStorage.getItem(VOICE_KEY) ?? "",
        model: cfg.model ?? localStorage.getItem(MODEL_KEY) ?? "",
        avatar: cameraSettings,
        lipsync: loadLipsyncFromLocalStorage(),
        lighting: cfg.lighting,
      };

      if (!payload.apiKey) {
        cameraSaveStatusEl.textContent = "Set API key in Settings";
        cameraSaveStatusEl.className = "err";
        btnSaveCamera.disabled = false;
        return;
      }

      try {
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error("save failed");
        localStorage.setItem(AVATAR_KEY, JSON.stringify(cameraSettings));
        cameraSaveStatusEl.textContent = "Saved";
        cameraSaveStatusEl.className = "";
        setTimeout(() => {
          if (cameraSaveStatusEl.textContent === "Saved") cameraSaveStatusEl.textContent = "";
        }, 2500);
      } catch {
        localStorage.setItem(AVATAR_KEY, JSON.stringify(cameraSettings));
        cameraSaveStatusEl.textContent = "Saved locally";
        cameraSaveStatusEl.className = "";
      } finally {
        btnSaveCamera.disabled = false;
      }
    }

    btnSaveCamera.addEventListener("click", saveCameraSettings);

      avatar.nudgeCameraHeight(deltaY);

    btnCameraUp.addEventListener("click", (e) => {

    function onAvatarStageClick(e) {
      if (e?.target?.closest?.("button, a, input, select, textarea")) return;
      tripleClickCount += 1;

      if (tripleClickCount >= 3) {
        tripleClickCount = 0;

      }
      tripleClickTimer = setTimeout(() => {

    document.getElementById("vrm-canvas").addEventListener("click", onAvatarStageClick);

    async function ensureAvatar() {
      if (avatar) return avatar;
      if (avatarLoading) return avatarLoading;
      avatarLoading = (async () => {
        const cfg = cachedConfig || await getConfig();
        const av = normalizeAvatar(cfg.avatar);
        const lipsync = normalizeLipsync(cfg.lipsync);
        const lighting = normalizeLighting(cfg.lighting);
        const backgroundUrl = getAvatarBackgroundUrl(cfg);
        applyAvatarStageBackground(backgroundUrl);
        avatar = new TommyAvatar(document.getElementById("vrm-canvas"), {
          ...av,
          lipsync,
          lighting,
          backgroundUrl,
          interactiveCamera: false,
        });
        avatar.onStatus = (msg) => {
          avatarReadyMessage = msg === "Avatar ready" ? "" : msg;
          updateAvatarStatusDisplay();
        };
        await avatar.load();
        return avatar;
      })();
      return avatarLoading;
    }

    async function enterSessionView() {
      if (inSession) {
        avatar?.refreshAfterVisible();
        return;
      }
      inSession = true;
      document.body.classList.add("in-session");
      if (!avatar?.loaded) setStatus("Loading avatar…");
      // Let layout paint so the canvas has real dimensions before WebGL init.
      await new Promise((r) => requestAnimationFrame(r));
      try {
        await ensureAvatar();
        avatar.refreshAfterVisible();
      } catch (e) {
        console.error(e);
        showErr(`Avatar failed to load: ${e.message}`);
      }
      try {
        await screen.orientation?.lock?.("landscape");
      } catch {}
      avatar?.refreshAfterVisible();
    }

    function exitSessionView() {
      if (!inSession) return;
      inSession = false;
      setCameraEditMode(false);
      document.body.classList.remove("in-session");
      try { screen.orientation?.unlock?.(); } catch {}
    }

    function releaseMicSync() {
      try { proc?.disconnect(); } catch (e) { console.warn("proc disconnect failed", e); }
      try { source?.disconnect(); } catch (e) { console.warn("source disconnect failed", e); }
      proc = null;
      source = null;
      try { stream?.getTracks().forEach((t) => t.stop()); } catch (e) { console.warn("stream stop failed", e); }
      stream = null;
      try { if (ctx?.state !== "closed") ctx?.close(); } catch (e) { console.warn("ctx close failed", e); }
      ctx = null;
    }

    function cleanupSession() {
      uiLog("cleanup", "begin", "hello");
      abortConnectPrep();
      clearConversationCaptions();
      directSessionEntry = false;
      active = false;
      pendingEndConversation = false;
      pendingFunctionCalls.clear();
      goodbyeNudged = false;
      cancelIdleNudge();
      idleNudgeCount = 0;
      if (endConversationCloseTimer) {
        clearTimeout(endConversationCloseTimer);
        endConversationCloseTimer = null;
      }
      try { stopAudio(); } catch (e) { console.warn("stopAudio failed", e); }
      try { stopAvatarSpeech(); } catch (e) { console.warn("stopAvatarSpeech failed", e); }
      resetResponseState(null);
      exitSessionView();
      releaseMicSync();
      ws = null;
      btnStart.textContent = "Start Conversation";
      btnStart.disabled = false;
      uiLog("cleanup", "done — ready for hello cycle", "hello");
    }

    function returnToHelloCycle() {
      uiLog("hello", "returnToHelloCycle", "hello");
      showErr("");
      resumeIdleVideo();
      wakeWordEnabled = ENABLE_WAKE_WORD;
      wakeWordRestartAttempts = 0;
      stopWakeWordListening();
      setStatus(ENABLE_WAKE_WORD ? 'Say "Hello" to start a conversation' : 'Tap "Start" to begin a conversation');
      if (!ENABLE_WAKE_WORD) return;
      if (wakeWordRestartTimer) clearTimeout(wakeWordRestartTimer);
      wakeWordRestartTimer = setTimeout(() => {
        wakeWordRestartTimer = null;
        uiLog("hello", `restart timer fired (delay ${POST_SESSION_WAKE_DELAY}ms)`, "hello", snapshotHelloCycleState());
        if (wakeWordEnabled && !active) startWakeWordListening();
        else uiLog("hello", "restart timer skipped", "warn", snapshotHelloCycleState());
      }, POST_SESSION_WAKE_DELAY);
    }

    function closeAfterToolEnd() {
      if (!pendingEndConversation || ws?.readyState !== WebSocket.OPEN) {
        if (pendingEndConversation) {
          uiLog("end", "closeAfterToolEnd blocked", "warn", {
            ws: wsStateLabel(),
            playing,
            queueLen: queue.length,
          });
        }
        return;
      }
      if (playing || queue.length > 0) {
        uiLog("end", "closeAfterToolEnd waiting for audio", "hello", { playing, queueLen: queue.length });
        return;
      }
      uiLog("end", "closeAfterToolEnd → ws.close()", "hello");
      ws.close();
    }

    function scheduleForceCloseAfterTool() {
      if (endConversationCloseTimer) clearTimeout(endConversationCloseTimer);
      uiLog("end", "schedule force close in 4s", "hello");
      endConversationCloseTimer = setTimeout(() => {
        if (!pendingEndConversation || ws?.readyState !== WebSocket.OPEN) {
          uiLog("end", "force close skipped", "warn", snapshotHelloCycleState());
          return;
        }
        uiLog("end", "force close → stopAudio + ws.close()", "warn");
        stopAudio();
        ws.close();
      }, 4000);
    }

    function trackFunctionCallItem(item) {
      if (!item || item.type !== "function_call") return;
      const callId = item.call_id || item.id;
      if (!callId) return;
      pendingFunctionCalls.set(item.id || callId, {
        name: item.name,
        call_id: callId,
      });
    }

    function resolveFunctionCall(event) {
      const tracked = pendingFunctionCalls.get(event.item_id);
      return {
        name: event.name || tracked?.name,
        call_id: event.call_id || tracked?.call_id || event.item_id,
        arguments: event.arguments || "{}",
      };
    }

    function isGoodbye(text) {
      const t = text.toLowerCase().trim();
      return /\b(goodbye|good bye|bye bye|see you|see ya|gotta go|got to go|i'?m leaving|im leaving|take care|farewell|talk later|catch you later)\b/.test(t)
        || /\bbye\b/.test(t);
    }

    function isDanceRequest(text) {
      const t = text.toLowerCase().trim();
      if (!t) return false;
      if (/\b(no|don't|dont|not|never|stop)\b.*\bdance\b/.test(t) || /\bdance\b.*\b(no|don't|dont|not|never|stop)\b/.test(t)) {
        return false;
      }
      if (/\bchicken dance\b/.test(t) || /\bdo the chicken\b/.test(t)) return true;
      if (/^(dance|dance!?|dance please)\.?$/i.test(t)) return true;
      if (/\bdance\b/.test(t)) {
        return /\b(do|can you|please|let'?s|show|chicken|time to|want to|wanna|for me|uncle tommy|tommy)\b/.test(t);
      }
      return /\b(do a dance|funny dance|your dance|shake it|bust a move)\b/.test(t);
    }

    function triggerChickenDance(reason = "user asked to dance") {
      const now = Date.now();
      if (now - lastChickenDanceAt < CHICKEN_DANCE_COOLDOWN_MS) return;
      lastChickenDanceAt = now;
      uiLog("dance", `chicken dance (${reason})`, "hello");
      avatar?.playMixamoAnimation(CHICKEN_DANCE_URL);
    }

    function nudgeEndConversation() {
      if (pendingEndConversation || goodbyeNudged || ws?.readyState !== WebSocket.OPEN) {
        uiLog("end", "nudgeEndConversation skipped", "warn", snapshotHelloCycleState());
        return;
      }
      uiLog("end", "goodbye detected → nudge agent to call end_conversation", "hello");
      goodbyeNudged = true;
      ws.send(JSON.stringify({
        type: "conversation.item.create",
        item: {
          type: "message",
          role: "user",
          content: [{ type: "input_text", text: "[The user said goodbye. Give a brief farewell and call end_conversation now.]" }],
        },
      }));
      ws.send(JSON.stringify({ type: "response.create" }));
    }

    function resetResponseState(id) {
      responseId = id ?? null;
      responseText = "";
      responseAudioMs = 0;
      speechStarted = false;
      audioDone = false;
      speechPlaybackStart = 0;
      if (id) updateAgentCaption("");
    }

    function syncLipsyncTimeline() {
      if (!responseText.trim() || !avatar) return;
      avatar.updateSpeechText(responseText, responseAudioMs);
    }

    function startLipsyncClock() {
      if (lipsyncRaf) return;
      const tick = () => {
        if (avatar?.speaking && ctx && speechPlaybackStart > 0) {
          avatar.setSpeechElapsedMs(Math.max(0, (ctx.currentTime - speechPlaybackStart) * 1000));
        }
        lipsyncRaf = requestAnimationFrame(tick);
      };
      lipsyncRaf = requestAnimationFrame(tick);
    }

    function stopLipsyncClock() {
      if (lipsyncRaf) { cancelAnimationFrame(lipsyncRaf); lipsyncRaf = null; }
    }

    function beginAvatarSpeech() {
      if (speechStarted || !avatar) return;
      speechStarted = true;
      speechPlaybackStart = Math.max(ctx.currentTime, nextPlayTime);
      syncLipsyncTimeline();
      avatar.beginSpeech();
      startLipsyncClock();
    }

    function maybeEndAvatarSpeech() {
      if (!speechStarted || !avatar) return;
      if (audioDone && !playing && queue.length === 0) {
        stopLipsyncClock();
        avatar.endSpeech();
        speechStarted = false;
      }
    }

    function stopAvatarSpeech() {
      stopLipsyncClock();
      avatar?.endSpeech();
      speechStarted = false;
      audioDone = false;
    }

    function handleNewResponse(id) {
      if (id && id !== responseId) {
        stopAvatarSpeech();
        resetResponseState(id);
      }
    }

    function appendResponseText(delta) {
      if (!delta) return;
      responseText += delta;
      updateAgentCaption(responseText);
      syncLipsyncTimeline();
    }

    function addAudioChunkMs(pcm16) {
      responseAudioMs += (pcm16.length / 24000) * 1000;
      syncLipsyncTimeline();
    }

    function sendFunctionOutput(callId, output) {
      ws.send(JSON.stringify({
        type: "conversation.item.create",
        item: {
          type: "function_call_output",
          call_id: callId,
          output: JSON.stringify(output),
        },
      }));
    }

    function handleEndConversationTool(callId, argsJson) {
      if (ws?.readyState !== WebSocket.OPEN) {
        uiLog("end", "end_conversation tool ignored — ws not open", "warn", { ws: wsStateLabel() });
        return;
      }

      let reason = "user said goodbye";
      try {
        const args = JSON.parse(argsJson || "{}");
        if (args.reason) reason = args.reason;
      } catch {}

      uiLog("end", `end_conversation tool (${reason})`, "hello");
      sendFunctionOutput(callId, { success: true, reason });
      pendingEndConversation = true;
      setStatus("Conversation ended");
      closeAfterToolEnd();
      setTimeout(closeAfterToolEnd, 1500);
      scheduleForceCloseAfterTool();
    }

    function handleFunctionCall(event) {
      if (ws?.readyState !== WebSocket.OPEN) return;

      const { name, call_id: callId, arguments: argsJson } = resolveFunctionCall(event);
      if (!name || !callId) {
        console.warn("Function call missing name or call_id", event);
        return;
      }

      if (name === HAPPY) {
        let reason = "user asked to dance";
        try {
          const args = JSON.parse(argsJson || "{}");
          if (args.reason) reason = args.reason;
        } catch {}
        avatar?.playMixamoAnimation(CHICKEN_DANCE_URL);
        lastChickenDanceAt = Date.now();
        sendFunctionOutput(callId, { success: true, reason, animation: "chicken_dance" });
        ws.send(JSON.stringify({ type: "response.create" }));
        return;
      }

      if (name === PLAY_GAME) {
        let reason = "user asked to play a game";
        try {
          const args = JSON.parse(argsJson || "{}");
          if (args.reason) reason = args.reason;
        } catch {}
        const game = pickRandomGame();
        sendFunctionOutput(callId, {
          success: true,
          reason,
          game: game.id,
          game_name: game.name,
        });
        ws.send(JSON.stringify({ type: "response.create" }));
        launchRandomGame(reason, game);
        return;
      }

      if (name === END_CONVERSATION) {
        uiLog("end", "function_call end_conversation received", "hello", { callId });
        handleEndConversationTool(callId, argsJson);
      }
    }

    async function getConfig(forceRefresh = false) {
      if (cachedConfig && !forceRefresh) return cachedConfig;
      try {
        const res = await fetch("/api/config");
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.avatar) {
            localStorage.setItem(AVATAR_KEY, JSON.stringify(normalizeAvatar(cfg.avatar)));
          }
          if (cfg.lipsync) {
            localStorage.setItem(LIPSYNC_KEY, JSON.stringify(normalizeLipsync(cfg.lipsync)));
          }
          applyGameIconsFromConfig(cfg.gameIcons);
          cachedConfig = cfg;
          return cfg;
        }
      } catch {}
      cachedConfig = {
        apiKey: localStorage.getItem(KEY),
        instructions: localStorage.getItem(PROMPT_KEY),
        voice: localStorage.getItem(VOICE_KEY),
        model: localStorage.getItem(MODEL_KEY),
        avatar: loadAvatarFromLocalStorage(),
        lipsync: loadLipsyncFromLocalStorage(),
      };
      return cachedConfig;
    }

    function releasePrepMic(prep) {
      if (!prep) return;
      try { prep.proc?.disconnect(); } catch {}
      try { prep.source?.disconnect(); } catch {}
      prep.proc = null;
      prep.source = null;
      try { prep.stream?.getTracks().forEach((t) => t.stop()); } catch {}
      prep.stream = null;
      try { if (prep.ctx?.state !== "closed") prep.ctx?.close(); } catch {}
      prep.ctx = null;
    }

    function abortConnectPrep() {
      if (!connectPrep) return;
      const prep = connectPrep;
      connectPrep = null;
      prep.aborted = true;
      prep.messageQueue = [];
      try { prep.ws?.close(); } catch {}
      releasePrepMic(prep);
    }

    function waitForWsOpen(socket, timeoutMs = 12000) {
      if (socket.readyState === WebSocket.OPEN) return Promise.resolve();
      if (socket.readyState === WebSocket.CLOSING || socket.readyState === WebSocket.CLOSED) {
        return Promise.reject(new Error("WebSocket closed before open"));
      }
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("WebSocket open timeout")), timeoutMs);
        socket.addEventListener("open", () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
        socket.addEventListener("close", () => {
          clearTimeout(timer);
          reject(new Error("WebSocket closed before open"));
        }, { once: true });
      });
    }

    function setupMicPipeline() {
      if (ctx?.state === "suspended") ctx.resume().catch(() => {});
      source = ctx.createMediaStreamSource(stream);
      proc = ctx.createScriptProcessor(2048, 1, 1);
      proc.onaudioprocess = ({ inputBuffer }) => {
        if (ws.readyState !== WebSocket.OPEN) return;
        const f = inputBuffer.getChannelData(0);
        const pcm = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, f[i] * 32768));
        ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64(pcm.buffer) }));
      };
      const silentGain = ctx.createGain();
      silentGain.gain.value = 0;
      source.connect(proc);
      proc.connect(silentGain);
      silentGain.connect(ctx.destination);
    }

    function handleWsMessage(data) {
      const e = JSON.parse(data);

      if (e.type === "client.error") {
        uiLog("session", `client.error: ${e.message}`, "err");
        showErr(e.message);
        ws.close();
        return;
      }

      if (e.response_id) handleNewResponse(e.response_id);

      if (e.type === "response.created") {
        cancelIdleNudge();
        handleNewResponse(e.response?.id || e.response_id);
      }

      if (e.type === "response.output_text.delta" || e.type === "response.output_audio_transcript.delta") {
        appendResponseText(e.delta);
      }

      if (e.type === "response.output_text.done" || e.type === "response.output_audio_transcript.done") {
        if (e.text) responseText = e.text;
        else if (e.transcript) responseText = e.transcript;
        updateAgentCaption(responseText);
        syncLipsyncTimeline();
      }

      if (e.type === "response.output_audio.delta") {
        setStatus("Conversation active — speak anytime", true);

        const pcm16 = Uint8Array.from(atob(e.delta), (c) => c.charCodeAt(0));
        addAudioChunkMs(new Int16Array(pcm16.buffer));
        queue.push(pcm16.buffer);
        if (!playing) playNext();
      } else if (e.type === "response.output_item.added") {
        trackFunctionCallItem(e.item);
      } else if (e.type === "response.output_item.done") {
        trackFunctionCallItem(e.item);
      } else if (e.type === "conversation.item.input_audio_transcription.completed") {
        if (e.transcript?.trim()) showUserHeard(e.transcript);
        if (isGoodbye(e.transcript)) nudgeEndConversation();
        if (isDanceRequest(e.transcript)) triggerChickenDance(e.transcript);
      } else if (e.type === "session.updated" || e.type === "session.created") {
        setStatus("Conversation active — speak anytime", true);
        avatar?.refreshAfterVisible();
      } else if (e.type === "input_audio_buffer.speech_started") {
        goodbyeNudged = false;
        idleNudgeCount = 0;
        cancelIdleNudge();
        showUserListening();
        updateAgentCaption("");
        stopAudio();
        stopAvatarSpeech();
        resetResponseState(null);
      } else if (e.type === "input_audio_buffer.timeout_triggered") {
        setStatus("No speech detected — Uncle Tommy is checking in", true);
      } else if (e.type === "response.output_audio.done") {
        audioDone = true;
        maybeEndAvatarSpeech();
        closeAfterToolEnd();
        if (!playing && queue.length === 0) scheduleIdleNudge();
      } else if (e.type === "response.done") {
        audioDone = true;
        maybeEndAvatarSpeech();
        closeAfterToolEnd();
        if (!playing && queue.length === 0) scheduleIdleNudge();
      } else if (e.type === "response.function_call_arguments.done") {
        handleFunctionCall(e);
      }
    }

    function attachWsHandlers(socket) {
      socket.onmessage = ({ data }) => handleWsMessage(data);
      socket.onclose = (event) => {
        uiLog("session", "ws closed", "hello", {
          code: event.code,
          reason: event.reason || "(none)",
          wasClean: event.wasClean,
        });
        try { cleanupSession(); }
        catch (e) { console.error("cleanupSession threw", e); }
        finally { returnToHelloCycle(); }
      };
    }

    function beginConnectPrep() {
      if (active) return Promise.resolve(null);
      if (connectPrep?.readyPromise) return connectPrep.readyPromise;

      const prep = {
        aborted: false,
        cfg: null,
        ctx: null,
        stream: null,
        ws: null,
        messageQueue: [],
        readyPromise: null,
      };
      connectPrep = prep;

      prep.readyPromise = (async () => {
        const cfg = await getConfig();
        prep.cfg = cfg;
        const apiKey = cfg.apiKey?.trim();
        if (!apiKey) throw new Error("NO_API_KEY");

        const micWork = (async () => {
          prep.ctx = new AudioContext({ sampleRate: 24000 });
          prep.stream = await navigator.mediaDevices.getUserMedia({
            audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
          });
        })();

        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        prep.ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);

        prep.ws.onopen = () => {
          if (prep.aborted) return;
          prep.ws.send(JSON.stringify({
            type: "client.auth",
            apiKey,
            instructions: getSessionInstructions(cfg),
            voice: cfg.voice?.trim() || DEFAULT_VOICE,
            model: cfg.model?.trim() || DEFAULT_MODEL,
          }));
        };

        prep.ws.onmessage = ({ data }) => {
          if (prep.aborted || active) return;
          prep.messageQueue.push(data);
        };

        prep.ws.onclose = () => {
          if (prep.aborted || active) return;
          prep.aborted = true;
        };

        await Promise.all([micWork, waitForWsOpen(prep.ws)]);
        if (prep.aborted) throw new Error("Connection prep aborted");
        return prep;
      })().catch((e) => {
        if (!prep.aborted) abortConnectPrep();
        throw e;
      });

      return prep.readyPromise;
    }

    function clearRecognitionWatchdog() {
      if (recognitionWatchdog) {
        clearTimeout(recognitionWatchdog);
        recognitionWatchdog = null;
      }
    }

    function armRecognitionWatchdog() {
      clearRecognitionWatchdog();
      recognitionWatchdog = setTimeout(() => {
        recognitionWatchdog = null;
        if (!listeningForWakeWord || !wakeWordEnabled || active) return;
        uiLog("hello", "watchdog: no speech activity, restarting recognition", "warn");
        stopWakeWordListening();
        scheduleWakeWordRestart("watchdog");
      }, RECOGNITION_WATCHDOG_MS);
    }

    function stopWakeWordListening() {
      uiLog("hello", "stopWakeWordListening", "hello");
      listeningForWakeWord = false;
      clearRecognitionWatchdog();
      if (wakeWordRestartTimer) {
        clearTimeout(wakeWordRestartTimer);
        wakeWordRestartTimer = null;
      }
      if (recognition) {
        recognition.onstart = null;
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch {}
        try { recognition.abort(); } catch (e) {
          uiLog("hello", "recognition.abort failed", "warn", { message: e?.message });
        }
      }
      recognition = null;
    }

    function resumeWakeWordListening() {
      returnToHelloCycle();
    }

    function containsWakeWord(text) {
      return text.toLowerCase().split(/\s+/).some((word) => word.replace(/[^\w]/g, "") === WAKE_WORD);
    }

    function startWakeWordListening() {
      if (!SpeechRecognition) {
        uiLog("hello", "SpeechRecognition unsupported", "err");
        showErr("Speech recognition is not supported in this browser. Use the Start button instead.");
        setStatus("Tap Start to begin a conversation");
        return;
      }
      if (active || listeningForWakeWord || !wakeWordEnabled) {
        uiLog("hello", "startWakeWordListening skipped", "warn", snapshotHelloCycleState());
        return;
      }

      uiLog("hello", "startWakeWordListening", "hello");
      recognition = new SpeechRecognition();
      // continuous=true is unreliable on iOS Safari after getUserMedia sessions.
      recognition.continuous = !IS_IOS;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        uiLog("hello", "recognition.onstart — mic active for wake word", "hello");
        armRecognitionWatchdog();
      };

      recognition.onresult = (event) => {
        armRecognitionWatchdog();
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          const isFinal = event.results[i].isFinal;
          uiLog("hello", `heard "${transcript.trim()}"${isFinal ? " (final)" : ""}`, "hello");
          if (containsWakeWord(transcript)) {
            uiLog("hello", "wake word matched → connectConversation", "hello");
            wakeWordEnabled = false;
            wakeWordRestartAttempts = 0;
            stopWakeWordListening();
            setStatus("Wake word detected — connecting…");
            connectConversation();
            return;
          }
        }
      };

      recognition.onerror = (event) => {
        listeningForWakeWord = false;
        uiLog("hello", `recognition error: ${event.error}`, event.error === "not-allowed" ? "err" : "warn");
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          showErr("Microphone access denied for speech recognition. Tap Start to begin.");
          setStatus("Tap Start to begin a conversation");
          return;
        }
        // iOS often fires "no-speech" / "audio-capture" after the mic was
        // held by getUserMedia — retry with backoff.
        scheduleWakeWordRestart(`error:${event.error}`);
      };

      recognition.onend = () => {
        listeningForWakeWord = false;
        uiLog("hello", "recognition ended", "hello", snapshotHelloCycleState());
        if (wakeWordEnabled && !active) scheduleWakeWordRestart("onend");
      };

      try {
        recognition.start();
        listeningForWakeWord = true;
        wakeWordRestartAttempts = 0;
        setStatus('Listening for "Hello"…');
        showErr("");
        uiLog("hello", "recognition.start OK", "hello");
        armRecognitionWatchdog();
      } catch (e) {
        uiLog("hello", "recognition.start threw", "err", { message: e?.message });
        scheduleWakeWordRestart("start-threw");
      }
    }

    function scheduleWakeWordRestart(reason = "unknown") {
      if (!wakeWordEnabled || active) {
        uiLog("hello", `scheduleWakeWordRestart skipped (${reason})`, "warn", snapshotHelloCycleState());
        return;
      }
      if (wakeWordRestartTimer) clearTimeout(wakeWordRestartTimer);
      // Exponential backoff: iOS Safari blocks rapid recognition.start()
      // calls after getUserMedia was used. Give it progressively more time.
      wakeWordRestartAttempts = Math.min(wakeWordRestartAttempts + 1, 6);
      const base = WAKE_WORD_RESTART_DELAY;
      const delay = base * Math.pow(1.6, wakeWordRestartAttempts - 1);
      uiLog("hello", `schedule restart in ${Math.round(delay)}ms (${reason})`, "hello", {
        attempt: wakeWordRestartAttempts,
      });
      // After several failed attempts on iOS, hint that tapping Start works.
      if (IS_IOS && wakeWordRestartAttempts >= 4) {
        setStatus('Tap "Start" or say "Hello" to begin');
      }
      wakeWordRestartTimer = setTimeout(() => {
        wakeWordRestartTimer = null;
        uiLog("hello", `backoff timer fired (${reason})`, "hello", snapshotHelloCycleState());
        if (wakeWordEnabled && !active) startWakeWordListening();
        else uiLog("hello", "backoff timer skipped", "warn", snapshotHelloCycleState());
      }, delay);
    }

    async function connectConversation({ preparedView = false } = {}) {
      if (active) {
        uiLog("session", "connectConversation skipped — already active", "warn");
        return;
      }

      uiLog("session", "connectConversation begin", "hello");
      const cfg = cachedConfig || await getConfig();
      const apiKey = cfg.apiKey?.trim();
      if (!apiKey) {
        uiLog("session", "no API key", "err");
        showErr("No API key set.");
        abortConnectPrep();
        if (preparedView) abortPreparedConversationView();
        resumeWakeWordListening();
        return;
      }

      showErr("");
      btnStart.disabled = true;
      btnStart.textContent = "Connecting…";
      setStatus("Connecting to Uncle Tommy…");

      let prep = connectPrep;
      connectPrep = null;
      const queuedMessages = [];

      try {
        if (prep && !prep.aborted) {
          await prep.readyPromise;
          if (prep.aborted || prep.ws?.readyState !== WebSocket.OPEN) {
            throw new Error("Connection prep failed");
          }
          ctx = prep.ctx;
          stream = prep.stream;
          ws = prep.ws;
          queuedMessages.push(...prep.messageQueue);
          prep.ctx = null;
          prep.stream = null;
          prep.ws = null;
        } else {
          ctx = new AudioContext({ sampleRate: 24000 });
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
          });
          const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
          ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);
          await new Promise((resolve, reject) => {
            ws.onopen = () => {
              uiLog("session", "ws open", "hello");
              ws.send(JSON.stringify({
                type: "client.auth",
                apiKey,
                instructions: getSessionInstructions(cfg),
                voice: cfg.voice?.trim() || DEFAULT_VOICE,
                model: cfg.model?.trim() || DEFAULT_MODEL,
              }));
              resolve();
            };
            ws.onerror = () => reject(new Error("WebSocket failed"));
            ws.onclose = () => reject(new Error("WebSocket closed"));
          });
        }
      } catch (e) {
        const denied = e?.name === "NotAllowedError" || e?.name === "NotFoundError";
        uiLog("session", denied ? "getUserMedia denied" : `connect failed: ${e?.message}`, "err");
        showErr(denied ? "Microphone access denied." : "Could not connect. Try again.");
        try { ws?.close(); } catch {}
        ws = null;
        abortConnectPrep();
        releaseMicSync();
        btnStart.textContent = "Start Conversation";
        btnStart.disabled = false;
        if (preparedView) abortPreparedConversationView();
        resumeWakeWordListening();
        return;
      }

      resetResponseState(null);
      clearConversationCaptions();
      attachWsHandlers(ws);
      active = true;
      setupMicPipeline();
      uiLog("session", "session live", "hello", { prep: Boolean(prep), queued: queuedMessages.length });

      for (const data of queuedMessages) {
        handleWsMessage(data);
      }

      if (!preparedView && !inSession) {
        await enterSessionView();
      }
    }

    function endConversation() {
      uiLog("end", "End Conversation button", "hello", snapshotHelloCycleState());
      if (!active) {
        uiLog("end", "End Conversation ignored — not active", "warn");
        return;
      }
      ws.close();
    }

    function playNext() {
      if (!queue.length) {
        playing = false;
        maybeEndAvatarSpeech();
        closeAfterToolEnd();
        if (audioDone) scheduleIdleNudge();
        return;
      }

      playing = true;
      beginAvatarSpeech();

      const pcm16 = new Int16Array(queue.shift());
      const len = pcm16.length;
      const fade = 48;
      const f32 = new Float32Array(len);
      for (let i = 0; i < len; i++) f32[i] = pcm16[i] / 32768;
      for (let i = 0; i < fade; i++) {
        f32[i] *= i / fade;
        f32[len - 1 - i] *= i / fade;
      }

      const buf = ctx.createBuffer(1, len, 24000);
      buf.getChannelData(0).set(f32);
      src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);

      const t = Math.max(ctx.currentTime, nextPlayTime);
      if (!speechPlaybackStart) speechPlaybackStart = t;
      nextPlayTime = t + buf.duration;
      src.onended = playNext;
      src.start(t);
    }

    function stopAudio() {
      queue.length = 0;
      playing = false;
      nextPlayTime = 0;
      try { src?.stop(); } catch {}
      src = null;
    }

    function b64(buf) {
      const b = new Uint8Array(buf);
      let s = "";
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
      return btoa(s);
    }

    btnStart.addEventListener("click", async () => {
      uiLog("hello", "Start button clicked", "hello");
      wakeWordEnabled = false;
      wakeWordRestartAttempts = 0;
      stopWakeWordListening();
      beginConnectPrep().catch(() => {});
      await Promise.all([
        enterSessionView(),
        connectConversation({ preparedView: true }),
      ]);
    });

    btnStop.addEventListener("click", endConversation);
    btnSendLog.addEventListener("click", sendDebugLogToServer);

    window.addEventListener("resize", () => {
      if (inSession) avatar?.refreshAfterVisible();
    });

    // iOS Safari creates AudioContexts in "suspended" state and only allows
    // resume() from a user gesture. Warm one up on the first touch so that
    // later wake-word-triggered sessions (which have no fresh gesture) can
    // resume their own context.
    if (IS_IOS) {
      const unlock = () => {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ac.createOscillator();
          const g = ac.createGain();
          g.gain.value = 0;
          osc.connect(g);
          g.connect(ac.destination);
          osc.start();
          osc.stop(ac.currentTime + 0.001);
          ac.resume().then(() => ac.close()).catch(() => {});
        } catch {}
        window.removeEventListener('pointerdown', unlock);
        window.removeEventListener('keydown', unlock);
      };
      window.addEventListener('pointerdown', unlock, { once: false });
      window.addEventListener('keydown', unlock, { once: false });
    }

    async function init() {
      const fromGame = shouldAutoConnectFromGame();
      const cfg = await getConfig();

      if (fromGame) {
        dismissSplash();
        dismissIdleVideoScreen();
        setIdleVideoMode(false);
        setVideosLoading(false);
        preloadMediaAssets(cfg).catch((e) => console.warn("background preload:", e));
        try {
          await autoConnectFromGameReturn();
        } catch (e) {
          console.error(e);
          showErr(`Failed to connect: ${e.message}`);
          setStatus('Tap "Start" to begin a conversation');
        }
        return;
      }

      try {
        const idleVideoReady = await preloadMediaAssets(cfg);
        dismissSplash();

        if (idleVideoReady) {
          startIdleVideoPlayback();
          setStatus("Tap the screen to begin a conversation");
        } else if (ENABLE_WAKE_WORD) {
          startWakeWordListening();
        } else {
          setStatus('Tap "Start" to begin a conversation');
        }
      } catch (e) {
        console.error(e);
        dismissSplash();
        showErr(`Failed to load: ${e.message}`);
        setStatus('Tap "Start" to begin a conversation');
      }
    }

    // Safety net: if wake-word listening dies silently (Chrome's
    // SpeechRecognition can stop without firing onend, and iOS Safari
    // can fail to restart after getUserMedia released the mic), make
    // sure it gets restarted.
    if (ENABLE_WAKE_WORD) {
      setInterval(() => {
        if (wakeWordEnabled && !active && !listeningForWakeWord && !wakeWordRestartTimer) {
          uiLog("hello", "safety net restart (idle but not listening)", "warn", snapshotHelloCycleState());
          wakeWordRestartAttempts = 0;
          startWakeWordListening();
        }
      }, 4000);
    }

    setInterval(() => {
      refreshIdleVideosForCurrentPeriod().catch(() => {});
    }, 60_000);

    uiLog("hello", "app init", "hello", { IS_IOS, WAKE_WORD_RESTART_DELAY, POST_SESSION_WAKE_DELAY });
    initVideoSoundUnlock();
    init();
  </script>
</body>
