<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word-Whack Blitz</title>
  <link rel="stylesheet" href="/assets/page-motion.css" />
  <script src="/assets/page-motion.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/gamePicker.css" />
  <link rel="stylesheet" href="css/loadingScreen.css" />
</head>
<body data-hide-game-picker="true">
  <div id="game-loading" class="game-loading--wordwhack" role="status" aria-live="polite" aria-busy="true">
    <div class="game-loading-backdrop" aria-hidden="true"></div>
    <div class="game-loading-card">
      <div class="game-loading-spinner" aria-hidden="true"></div>
      <p class="game-loading-title">Word-Whack Blitz</p>
      <p class="game-loading-sub">Setting up the field…</p>
      <div class="game-loading-bar" aria-hidden="true"><div class="game-loading-bar-fill"></div></div>
    </div>
  </div>
  <div id="game" class="scene">
    <button type="button" class="return-btn" id="returnBtn" title="Return to conversation" aria-label="Return to conversation">
      <img src="FindGame/assets/images/return-button.png" alt="" class="return-icon" />
    </button>
    <div class="game-audio-control sound-toggle--wordwhack" data-game-audio-menu>
      <button type="button" class="sound-toggle--viewport" data-game-audio-menu-button aria-label="Sound settings" title="Sound settings">🔊</button>
    </div>

    <!-- Sky / clouds decor -->
    <div class="sky-decor">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
    </div>

    <!-- Header -->
    <header class="hud">
      <div class="sign-wrap">
        <div class="rope rope-left"></div>
        <div class="rope rope-right"></div>
        <div class="sign">
          <div class="sign-label">Complete the sentence</div>
          <div id="sentence" class="sentence">Loading…</div>
        </div>
      </div>

      <div class="timer-wrap">
        <div class="timer-chip">
          <span class="timer-readout">
            <span id="timerVal" class="timer-num">90</span>
            <span class="timer-unit">sec</span>
          </span>
        </div>
      </div>
    </header>

    <!-- Play area -->
    <main class="play-area">
      <div id="grid" class="grid"></div>
    </main>

    <!-- Footer progress -->
    <footer class="footer">
      <div class="progress-frame">
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div class="star-milestone s1" data-milestone="1"><img src="assets/images/progress-star.png" alt="" class="star-img" /></div>
        <div class="star-milestone s2" data-milestone="2"><img src="assets/images/progress-star.png" alt="" class="star-img" /></div>
        <div class="star-milestone s3" data-milestone="3"><img src="assets/images/progress-star.png" alt="" class="star-img" /></div>
      </div>
      <div class="live-score" aria-label="Score"><span id="scoreVal">0</span></div>
    </footer>

    <!-- Game-over overlay (shown after time runs out) -->
    <div id="overlay" class="overlay hidden">
      <div class="panel"></div>
    </div>

    <!-- Floating feedback layer -->
    <div id="fx" class="fx-layer"></div>
  </div>

  <script src="js/loadingScreen.js"></script>
  <script src="js/wordwhackUnlockGuard.js"></script>
  <script src="js/gameBgm.js"></script>
  <script src="js/gameSfx.js"></script>
  <script src="js/gameAudioMenu.js"></script>
  <script src="js/vocaConfig.js"></script>
  <script src="js/imageConfig.js"></script>
  <script src="js/gamePicker.js"></script>
  <script src="js/gameScoreReporter.js"></script>
  <script src="assets/game-result.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
