<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture-Word Memory Match</title>
<link rel="stylesheet" href="/assets/page-motion.css">
<script src="/assets/page-motion.js" defer></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../css/gamePicker.css">
<link rel="stylesheet" href="../css/loadingScreen.css">
</head>
<body>
<div id="game-loading" class="game-loading--cardgame" role="status" aria-live="polite" aria-busy="true">
  <div class="game-loading-backdrop" aria-hidden="true"></div>
  <div class="game-loading-card">
    <div class="game-loading-spinner" aria-hidden="true"></div>
    <p class="game-loading-title">Picture-Word Memory Match</p>
    <p class="game-loading-sub">Shuffling the cards…</p>
    <div class="game-loading-bar" aria-hidden="true"><div class="game-loading-bar-fill"></div></div>
  </div>
</div>
<div id="bga-custom-background" aria-hidden="true"></div>

<button id="return-btn" class="return-btn" type="button" title="Return to conversation" aria-label="Return to conversation">
  <img src="assets/images/return-btn.svg" alt="Return" class="return-icon">
</button>

<div id="game">
  <header class="game-top-hud">
    <h1 class="title-text">Picture-Word Memory Match</h1>
    <div id="status-row">
      <div id="timer-display">
        <img src="assets/images/timer.svg" alt="timer" class="timer-icon">
        <span id="timer-text">90</span>
      </div>
      <div id="pairs-display"><span id="pairs-found">0/6</span> Pairs Found</div>
      <div id="score-display">Score: <span id="score-text">0</span></div>
    </div>
  </header>
  <div id="hud">
    <span id="timer" style="display:none;">90</span>
  </div>
  <div id="board"></div>
  <footer class="footer">
    <div class="progress-frame">
      <div id="progressFill" class="progress-fill"></div>
      <div class="star-milestone s1" data-milestone="1">★</div>
      <div class="star-milestone s2" data-milestone="2">★</div>
      <div class="star-milestone s3" data-milestone="3">★</div>
    </div>
  </footer>
  <div id="level-complete" class="hidden" aria-live="polite">
    <div class="level-complete-inner">
      <p class="level-complete-title">Time's up!</p>
      <p class="level-complete-stars" id="complete-stars"></p>
      <p class="level-complete-score">Score: <span id="complete-score">0</span></p>
    </div>
  </div>
</div>
<script src="../js/loadingScreen.js"></script>
<script src="../js/vocaConfig.js"></script>
<script src="js/imageConfig.js"></script>
<script src="../js/gamePicker.js"></script>
<script src="../js/gameScoreReporter.js"></script>
<script src="game.js"></script>
</body>
</html>
