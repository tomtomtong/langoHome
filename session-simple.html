<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inworld Realtime — Simple</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      width: min(100%, 640px);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .sub {
      margin: 0 0 1.5rem;
      font-size: 0.85rem;
      color: #666;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
      color: #444;
    }
    input, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.9rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 4rem; }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.55rem 1rem;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: #1557b0; }
    button.danger {
      background: #d93025;
      border-color: #d93025;
      color: #fff;
    }
    button.danger:hover:not(:disabled) { background: #b3261e; }
    #status {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 6px;
      background: #e8e8e8;
      font-size: 0.85rem;
    }
    #status.ok { background: #e6f4ea; color: #137333; }
    #status.err { background: #fce8e6; color: #c5221f; }
    #status.live { background: #e8f0fe; color: #1967d2; }
    #check-result {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #ddd;
      font-size: 0.8rem;
      white-space: pre-wrap;
      display: none;
    }
    #check-result.show { display: block; }
    .captions {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #ddd;
    }
    .caption {
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .caption strong { color: #555; font-weight: 600; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #888;
    }
    .hint a { color: #1a73e8; }
    .section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #ddd;
    }
    .section h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 600;
    }
    #rec-status {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 0.5rem;
    }
    #rec-status.recording { color: #d93025; }
    #playback {
      width: 100%;
      margin-top: 0.5rem;
      display: none;
    }
    #playback.show { display: block; }
    #debug-log {
      margin: 0;
      padding: 0.75rem;
      max-height: 280px;
      overflow: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 6px;
      border: 1px solid #333;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-line { margin-bottom: 0.35rem; }
    .log-line .t { color: #888; }
    .log-line.in .k { color: #4fc3f7; }
    .log-line.out .k { color: #81c784; }
    .log-line.sys .k { color: #ffb74d; }
    .log-line.err .k { color: #ef5350; }
    .log-line.warn .k { color: #ffca28; }
    .debug-opts {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
      color: #555;
    }
    .debug-opts label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Inworld Realtime</h1>
    <p class="sub">Minimal session — no avatar, no background.</p>

    <form id="form" onsubmit="return false;">
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" placeholder="From /config or enter here" autocomplete="off">

      <label for="voice">Voice ID</label>
      <input id="voice" type="text" placeholder="default-zylgts2tamenvybeti3z0w__uncle_tommy">

      <label for="model">Model</label>
      <input id="model" type="text" placeholder="openai/gpt-4o-mini">

      <label for="instructions">Instructions</label>
      <textarea id="instructions" placeholder="System prompt for the agent"></textarea>

      <div class="row">
        <button type="button" id="btn-check">Check</button>
        <button type="button" id="btn-connect" class="primary">Connect</button>
        <button type="button" id="btn-disconnect" class="danger" disabled>Disconnect</button>
      </div>
    </form>

    <div id="status">Idle</div>
    <div id="check-result"></div>

    <div class="captions">
      <div class="caption"><strong>You:</strong> <span id="user-text">—</span></div>
      <div class="caption"><strong>Agent:</strong> <span id="agent-text">—</span></div>
    </div>

    <section class="section">
      <h2>Debug log</h2>
      <div class="debug-opts">
        <label><input type="checkbox" id="debug-verbose" checked> Full JSON</label>
        <label><input type="checkbox" id="debug-audio"> Log audio chunks</label>
        <label><input type="checkbox" id="debug-autoscroll" checked> Auto-scroll</label>
        <button type="button" id="btn-clear-log">Clear</button>
        <button type="button" id="btn-copy-log">Copy</button>
      </div>
      <pre id="debug-log"></pre>
    </section>

    <section class="section">
      <h2>Audio recorder</h2>
      <p class="sub" style="margin-bottom: 0.75rem;">Record from mic, then play back.</p>
      <div class="row">
        <button type="button" id="btn-record" class="primary">Record</button>
        <button type="button" id="btn-play-rec" disabled>Play</button>
      </div>
      <div id="rec-status">Ready</div>
      <audio id="playback" controls></audio>
    </section>

    <p class="hint">Requires login for WebSocket. <a href="/login">Log in</a> · <a href="/config">Config</a> · <a href="/">Main app</a></p>
  </main>

  <script type="module">
    const DEFAULT_VOICE = "default-zylgts2tamenvybeti3z0w__uncle_tommy";
    const DEFAULT_MODEL = "openai/gpt-4o-mini";
    const DEFAULT_PROMPT = "You are a friendly voice assistant. Keep responses brief.";

    const $ = (id) => document.getElementById(id);
    const apiKeyEl = $("apiKey");
    const voiceEl = $("voice");
    const modelEl = $("model");
    const instructionsEl = $("instructions");
    const statusEl = $("status");
    const checkResultEl = $("check-result");
    const userTextEl = $("user-text");
    const agentTextEl = $("agent-text");
    const btnCheck = $("btn-check");
    const btnConnect = $("btn-connect");
    const btnDisconnect = $("btn-disconnect");
    const debugLogEl = $("debug-log");
    const debugVerboseEl = $("debug-verbose");
    const debugAudioEl = $("debug-audio");
    const debugAutoscrollEl = $("debug-autoscroll");
    const btnClearLog = $("btn-clear-log");
    const btnCopyLog = $("btn-copy-log");

    const LOG_MAX = 400;
    const logLines = [];
    let micChunkCount = 0;
    let audioDeltaCount = 0;

    function ts() {
      const d = new Date();
      return d.toLocaleTimeString("en-GB", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    function redactAuth(obj) {
      if (!obj || typeof obj !== "object") return obj;
      const copy = { ...obj };
      if (copy.apiKey) copy.apiKey = `[redacted ${copy.apiKey.length} chars]`;
      if (copy.audio) copy.audio = `[b64 ${copy.audio.length} chars]`;
      if (copy.delta && copy.type?.includes("audio")) copy.delta = `[b64 ${copy.delta.length} chars]`;
      if (copy.delta && copy.type?.includes("text")) copy.delta = copy.delta.length > 120 ? copy.delta.slice(0, 120) + "…" : copy.delta;
      return copy;
    }

    function formatDetail(detail) {
      if (detail == null) return "";
      if (typeof detail === "string") return detail;
      try {
        return JSON.stringify(redactAuth(detail), null, debugVerboseEl.checked ? 2 : 0);
      } catch {
        return String(detail);
      }
    }

    function uiLog(kind, message, detail = null) {
      const line = { t: ts(), kind, message, detail };
      logLines.push(line);
      if (logLines.length > LOG_MAX) logLines.shift();

      const el = document.createElement("div");
      el.className = `log-line ${kind}`;
      const detailText = detail != null ? "\n" + formatDetail(detail) : "";
      el.textContent = `[${line.t}] [${kind.toUpperCase()}] ${message}${detailText}`;
      debugLogEl.appendChild(el);
      while (debugLogEl.childNodes.length > LOG_MAX) {
        debugLogEl.removeChild(debugLogEl.firstChild);
      }
      if (debugAutoscrollEl.checked) {
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
      }
      console.log(`[session-simple] [${kind}]`, message, detail ?? "");
    }

    btnClearLog.addEventListener("click", () => {
      logLines.length = 0;
      debugLogEl.textContent = "";
      micChunkCount = 0;
      audioDeltaCount = 0;
      uiLog("sys", "Log cleared");
    });

    btnCopyLog.addEventListener("click", async () => {
      const text = [...debugLogEl.childNodes].map((n) => n.textContent).join("\n");
      try {
        await navigator.clipboard.writeText(text);
        uiLog("sys", "Log copied to clipboard");
      } catch {
        uiLog("err", "Could not copy log");
      }
    });

    let ws = null;
    let ctx = null;
    let stream = null;
    let source = null;
    let proc = null;
    let active = false;
    let queue = [];
    let playing = false;
    let nextPlayTime = 0;
    let src = null;
    let responseText = "";

    function getFormCfg() {
      return {
        apiKey: apiKeyEl.value.trim(),
        voice: voiceEl.value.trim() || DEFAULT_VOICE,
        model: modelEl.value.trim() || DEFAULT_MODEL,
        instructions: instructionsEl.value.trim() || DEFAULT_PROMPT,
      };
    }

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function showCheck(lines, ok) {
      checkResultEl.textContent = lines.join("\n");
      checkResultEl.className = "show" + (ok ? "" : "");
      checkResultEl.style.borderColor = ok ? "#34a853" : "#ea4335";
    }

    function setUiConnected(on) {
      active = on;
      btnConnect.disabled = on;
      btnCheck.disabled = on;
      btnDisconnect.disabled = !on;
      apiKeyEl.disabled = on;
      voiceEl.disabled = on;
      modelEl.disabled = on;
      instructionsEl.disabled = on;
    }

    function b64(buf) {
      const b = new Uint8Array(buf);
      let s = "";
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
      return btoa(s);
    }

    async function loadServerConfig() {
      uiLog("sys", "GET /api/config");
      try {
        const res = await fetch("/api/config");
        uiLog("sys", `/api/config → ${res.status}`);
        if (res.status === 401) {
          setStatus("Not logged in — log in first", "err");
          uiLog("err", "Not logged in");
          return null;
        }
        if (!res.ok) {
          uiLog("err", "Config fetch failed", { status: res.status });
          return null;
        }
        const cfg = await res.json();
        if (cfg.apiKey) apiKeyEl.placeholder = "Loaded from server (••••••••)";
        if (cfg.voice) voiceEl.value = cfg.voice;
        if (cfg.model) modelEl.value = cfg.model;
        if (cfg.instructions) instructionsEl.value = cfg.instructions;
        uiLog("sys", "Config loaded", {
          hasApiKey: Boolean(cfg.apiKey),
          voice: cfg.voice,
          model: cfg.model,
          instructionsLen: (cfg.instructions || "").length,
        });
        return cfg;
      } catch (e) {
        uiLog("err", "Config fetch error", { message: e?.message });
        return null;
      }
    }

    async function checkConnection() {
      btnCheck.disabled = true;
      setStatus("Checking…");
      uiLog("sys", "Check started");
      const lines = [];
      let ok = true;

      const serverCfg = await loadServerConfig();
      const cfg = getFormCfg();
      const apiKey = cfg.apiKey || serverCfg?.apiKey?.trim() || "";

      lines.push(`API key: ${apiKey ? "present" : "MISSING"}`);
      lines.push(`Voice: ${cfg.voice}`);
      lines.push(`Model: ${cfg.model}`);
      lines.push(`Instructions: ${cfg.instructions.slice(0, 60)}${cfg.instructions.length > 60 ? "…" : ""}`);

      if (!apiKey) {
        lines.push("\n✗ Set an API key in the form or at /config");
        ok = false;
        showCheck(lines, ok);
        setStatus("Check failed — no API key", "err");
        uiLog("err", "Check failed — no API key");
        btnCheck.disabled = active;
        return;
      }

      lines.push("\nTesting WebSocket…");
      showCheck(lines, ok);

      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProtocol}//${location.host}/ws`;
      uiLog("sys", "Opening check WebSocket", { url: wsUrl });
      const socket = new WebSocket(wsUrl);

      try {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("Timeout (12s)")), 12000);

          socket.onopen = () => {
            uiLog("sys", "Check WS open");
            const auth = {
              type: "client.auth",
              apiKey,
              instructions: cfg.instructions,
              voice: cfg.voice,
              model: cfg.model,
            };
            uiLog("out", "client.auth", auth);
            socket.send(JSON.stringify(auth));
          };

          socket.onmessage = ({ data }) => {
            const e = JSON.parse(data);
            uiLog("in", e.type || "message", e);
            if (e.type === "client.error") {
              clearTimeout(timer);
              reject(new Error(e.message));
              return;
            }
            if (e.type === "session.created" || e.type === "session.updated") {
              clearTimeout(timer);
              resolve(e.type);
            }
          };

          socket.onerror = () => {
            clearTimeout(timer);
            uiLog("err", "Check WS error");
            reject(new Error("WebSocket error"));
          };

          socket.onclose = (ev) => {
            uiLog("sys", "Check WS closed", { code: ev.code, reason: ev.reason, wasClean: ev.wasClean });
            if (ev.code === 4001) {
              clearTimeout(timer);
              reject(new Error("Login required — go to /login"));
            }
          };
        });

        lines.push("✓ WebSocket connected");
        lines.push("✓ Inworld session ready");
        setStatus("Check passed", "ok");
        uiLog("sys", "Check passed");
      } catch (e) {
        lines.push(`✗ ${e.message || e}`);
        ok = false;
        setStatus("Check failed", "err");
        uiLog("err", "Check failed", { message: e?.message || String(e) });
      } finally {
        try { socket.close(); } catch {}
        showCheck(lines, ok);
        btnCheck.disabled = active;
      }
    }

    function openSessionWebSocket(cfg, apiKey) {
      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${wsProtocol}//${location.host}/ws`;
      uiLog("sys", "Opening session WebSocket", { url: wsUrl });
      const socket = new WebSocket(wsUrl);
      return new Promise((resolve, reject) => {
        socket.onopen = () => {
          uiLog("sys", "Session WS open");
          const auth = {
            type: "client.auth",
            apiKey,
            instructions: cfg.instructions,
            voice: cfg.voice,
            model: cfg.model,
          };
          uiLog("out", "client.auth", auth);
          socket.send(JSON.stringify(auth));
          resolve(socket);
        };
        socket.onerror = () => {
          uiLog("err", "Session WS error");
          reject(new Error("WebSocket failed"));
        };
        socket.onclose = (ev) => {
          uiLog("sys", "Session WS closed (during connect)", { code: ev.code, reason: ev.reason });
          if (ev.code === 4001) reject(new Error("Login required"));
          else if (!active) reject(new Error("WebSocket closed"));
        };
      });
    }

    function setupMicPipeline() {
      if (ctx?.state === "suspended") ctx.resume().catch(() => {});
      uiLog("sys", "Mic pipeline started", { sampleRate: ctx.sampleRate, state: ctx.state });
      micChunkCount = 0;
      source = ctx.createMediaStreamSource(stream);
      proc = ctx.createScriptProcessor(2048, 1, 1);
      proc.onaudioprocess = ({ inputBuffer }) => {
        if (ws?.readyState !== WebSocket.OPEN) return;
        const f = inputBuffer.getChannelData(0);
        const pcm = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, f[i] * 32768));
        ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64(pcm.buffer) }));
        micChunkCount++;
        if (debugAudioEl.checked && (micChunkCount === 1 || micChunkCount % 25 === 0)) {
          uiLog("out", `input_audio_buffer.append #${micChunkCount}`, { samples: pcm.length });
        }
      };
      const silent = ctx.createGain();
      silent.gain.value = 0;
      source.connect(proc);
      proc.connect(silent);
      silent.connect(ctx.destination);
    }

    function stopAudio() {
      queue.length = 0;
      playing = false;
      nextPlayTime = 0;
      try { src?.stop(); } catch {}
      src = null;
    }

    function playNext() {
      if (!queue.length) {
        playing = false;
        return;
      }
      playing = true;
      const pcm16 = new Int16Array(queue.shift());
      const len = pcm16.length;
      const f32 = new Float32Array(len);
      for (let i = 0; i < len; i++) f32[i] = pcm16[i] / 32768;

      const buf = ctx.createBuffer(1, len, 24000);
      buf.getChannelData(0).set(f32);
      src = ctx.createBufferSource();
      src.buffer = buf;
      const t = Math.max(ctx.currentTime, nextPlayTime);
      src.connect(ctx.destination);
      nextPlayTime = t + buf.duration;
      src.onended = playNext;
      src.start(t);
    }

    function logWsEvent(e) {
      if (e.type === "response.output_audio.delta") {
        audioDeltaCount++;
        if (!debugAudioEl.checked) {
          if (audioDeltaCount === 1 || audioDeltaCount % 50 === 0) {
            uiLog("in", `response.output_audio.delta ×${audioDeltaCount}`, {
              response_id: e.response_id,
              lastBytes: e.delta?.length,
            });
          }
          return;
        }
      }
      uiLog("in", e.type || "message", e);
    }

    function handleWsMessage(data) {
      let e;
      try {
        e = JSON.parse(data);
      } catch (err) {
        uiLog("err", "Invalid WS JSON", { raw: String(data).slice(0, 200) });
        return;
      }

      logWsEvent(e);

      if (e.type === "client.error") {
        setStatus(e.message, "err");
        cleanup();
        return;
      }

      if (e.type === "response.output_text.delta" || e.type === "response.output_audio_transcript.delta") {
        responseText += e.delta || "";
        agentTextEl.textContent = responseText || "—";
      }

      if (e.type === "response.output_text.done" || e.type === "response.output_audio_transcript.done") {
        responseText = e.text || e.transcript || responseText;
        agentTextEl.textContent = responseText || "—";
      }

      if (e.type === "response.output_audio.delta") {
        setStatus("Live — speak anytime", "live");
        const pcm16 = Uint8Array.from(atob(e.delta), (c) => c.charCodeAt(0));
        queue.push(pcm16.buffer);
        if (!playing) playNext();
      }

      if (e.type === "conversation.item.input_audio_transcription.completed" && e.transcript?.trim()) {
        userTextEl.textContent = e.transcript.trim();
      }

      if (e.type === "input_audio_buffer.speech_started") {
        responseText = "";
        agentTextEl.textContent = "—";
        stopAudio();
      }

      if (e.type === "session.updated" || e.type === "session.created") {
        setStatus("Live — speak anytime", "live");
      }
    }

    function releaseMic() {
      try { proc?.disconnect(); } catch {}
      try { source?.disconnect(); } catch {}
      proc = null;
      source = null;
      try { stream?.getTracks().forEach((t) => t.stop()); } catch {}
      stream = null;
      try { if (ctx?.state !== "closed") ctx?.close(); } catch {}
      ctx = null;
    }

    function cleanup() {
      const wasLive = active || ws || stream;
      if (!wasLive) return;
      uiLog("sys", "Cleanup", { micChunksSent: micChunkCount, audioDeltasReceived: audioDeltaCount });
      stopAudio();
      try { ws?.close(); } catch {}
      ws = null;
      releaseMic();
      setUiConnected(false);
      micChunkCount = 0;
      audioDeltaCount = 0;
      if (!statusEl.classList.contains("err")) setStatus("Disconnected");
      btnConnect.textContent = "Connect";
    }

    async function connect() {
      if (active) return;

      uiLog("sys", "Connect started");
      const serverCfg = await loadServerConfig().catch(() => null);
      const cfg = getFormCfg();
      const apiKey = cfg.apiKey || serverCfg?.apiKey?.trim() || "";
      if (!apiKey) {
        setStatus("No API key", "err");
        uiLog("err", "Connect aborted — no API key");
        return;
      }

      btnConnect.disabled = true;
      btnConnect.textContent = "Connecting…";
      setStatus("Connecting…");
      userTextEl.textContent = "—";
      agentTextEl.textContent = "—";
      responseText = "";
      audioDeltaCount = 0;
      micChunkCount = 0;

      try {
        uiLog("sys", "Requesting getUserMedia");
        ctx = new AudioContext({ sampleRate: 24000 });
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
        uiLog("sys", "getUserMedia OK", {
          tracks: stream.getAudioTracks().map((t) => ({ label: t.label, readyState: t.readyState })),
        });
        ws = await openSessionWebSocket(cfg, apiKey);
      } catch (e) {
        const denied = e?.name === "NotAllowedError" || e?.name === "NotFoundError";
        setStatus(denied ? "Microphone denied" : (e.message || "Connection failed"), "err");
        uiLog("err", "Connect failed", { name: e?.name, message: e?.message });
        cleanup();
        return;
      }

      ws.onmessage = ({ data }) => {
        try { handleWsMessage(data); } catch (err) {
          uiLog("err", "handleWsMessage threw", { message: err?.message });
          console.error(err);
        }
      };
      ws.onclose = (ev) => {
        uiLog("sys", "Session WS closed", { code: ev.code, reason: ev.reason, wasClean: ev.wasClean });
        cleanup();
      };
      ws.onerror = () => uiLog("err", "Session WS error (live)");

      setupMicPipeline();
      setUiConnected(true);
      btnConnect.textContent = "Connect";
      setStatus("Live — speak anytime", "live");
      uiLog("sys", "Session live");
    }

    btnCheck.addEventListener("click", checkConnection);
    btnConnect.addEventListener("click", connect);
    btnDisconnect.addEventListener("click", () => {
      uiLog("sys", "Disconnect clicked");
      try { ws?.close(); } catch {}
      cleanup();
    });

    // --- Simple audio recorder ---
    const btnRecord = $("btn-record");
    const btnPlayRec = $("btn-play-rec");
    const recStatusEl = $("rec-status");
    const playbackEl = $("playback");

    let mediaRecorder = null;
    let recStream = null;
    let recChunks = [];
    let recBlobUrl = null;

    function setRecStatus(text, recording = false) {
      recStatusEl.textContent = text;
      recStatusEl.className = recording ? "recording" : "";
    }

    function clearRecording() {
      if (recBlobUrl) {
        URL.revokeObjectURL(recBlobUrl);
        recBlobUrl = null;
      }
      recChunks = [];
      playbackEl.removeAttribute("src");
      playbackEl.classList.remove("show");
      btnPlayRec.disabled = true;
    }

    async function startRecording() {
      if (mediaRecorder?.state === "recording") return;
      clearRecording();

      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        const denied = e?.name === "NotAllowedError" || e?.name === "NotFoundError";
        setRecStatus(denied ? "Microphone denied" : "Could not access mic");
        return;
      }

      const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
      mediaRecorder = mimeType ? new MediaRecorder(recStream, { mimeType }) : new MediaRecorder(recStream);
      recChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        recStream?.getTracks().forEach((t) => t.stop());
        recStream = null;

        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        recBlobUrl = URL.createObjectURL(blob);
        playbackEl.src = recBlobUrl;
        playbackEl.classList.add("show");
        btnPlayRec.disabled = false;
        btnRecord.textContent = "Record";
        btnRecord.classList.add("primary");
        btnRecord.classList.remove("danger");
        setRecStatus("Recorded — tap Play or use player below");
      };

      mediaRecorder.start();
      btnRecord.textContent = "Stop";
      btnRecord.classList.remove("primary");
      btnRecord.classList.add("danger");
      setRecStatus("Recording…", true);
    }

    function stopRecording() {
      if (mediaRecorder?.state === "recording") {
        mediaRecorder.stop();
        setRecStatus("Processing…");
      }
    }

    btnRecord.addEventListener("click", () => {
      if (mediaRecorder?.state === "recording") stopRecording();
      else startRecording();
    });

    btnPlayRec.addEventListener("click", () => {
      if (!recBlobUrl) return;
      playbackEl.play().catch(() => setRecStatus("Playback blocked — use player below"));
    });

    playbackEl.addEventListener("loadedmetadata", () => {
      if (recBlobUrl && playbackEl.duration && isFinite(playbackEl.duration)) {
        setRecStatus(`Recorded (${playbackEl.duration.toFixed(1)}s) — tap Play or use player below`);
      }
    });

    voiceEl.value = DEFAULT_VOICE;
    modelEl.value = DEFAULT_MODEL;
    instructionsEl.value = DEFAULT_PROMPT;
    uiLog("sys", "Page ready", { host: location.host, protocol: location.protocol });
    loadServerConfig();
  </script>
</body>
</html>
