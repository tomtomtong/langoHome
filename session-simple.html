<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inworld Realtime — Simple</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    body {
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      width: min(100%, 420px);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .sub {
      margin: 0 0 1.5rem;
      font-size: 0.85rem;
      color: #666;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.8rem;
      color: #444;
    }
    input, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.9rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 4rem; }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.55rem 1rem;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: #1557b0; }
    button.danger {
      background: #d93025;
      border-color: #d93025;
      color: #fff;
    }
    button.danger:hover:not(:disabled) { background: #b3261e; }
    #status {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 6px;
      background: #e8e8e8;
      font-size: 0.85rem;
    }
    #status.ok { background: #e6f4ea; color: #137333; }
    #status.err { background: #fce8e6; color: #c5221f; }
    #status.live { background: #e8f0fe; color: #1967d2; }
    #check-result {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #ddd;
      font-size: 0.8rem;
      white-space: pre-wrap;
      display: none;
    }
    #check-result.show { display: block; }
    .captions {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #ddd;
    }
    .caption {
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .caption strong { color: #555; font-weight: 600; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #888;
    }
    .hint a { color: #1a73e8; }
    .section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #ddd;
    }
    .section h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 600;
    }
    #rec-status {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 0.5rem;
    }
    #rec-status.recording { color: #d93025; }
    #playback {
      width: 100%;
      margin-top: 0.5rem;
      display: none;
    }
    #playback.show { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Inworld Realtime</h1>
    <p class="sub">Minimal session — no avatar, no background.</p>

    <form id="form" onsubmit="return false;">
      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" placeholder="From /config or enter here" autocomplete="off">

      <label for="voice">Voice ID</label>
      <input id="voice" type="text" placeholder="default-zylgts2tamenvybeti3z0w__uncle_tommy">

      <label for="model">Model</label>
      <input id="model" type="text" placeholder="openai/gpt-4o-mini">

      <label for="instructions">Instructions</label>
      <textarea id="instructions" placeholder="System prompt for the agent"></textarea>

      <div class="row">
        <button type="button" id="btn-check">Check</button>
        <button type="button" id="btn-connect" class="primary">Connect</button>
        <button type="button" id="btn-disconnect" class="danger" disabled>Disconnect</button>
      </div>
    </form>

    <div id="status">Idle</div>
    <div id="check-result"></div>

    <div class="captions">
      <div class="caption"><strong>You:</strong> <span id="user-text">—</span></div>
      <div class="caption"><strong>Agent:</strong> <span id="agent-text">—</span></div>
    </div>

    <section class="section">
      <h2>Audio recorder</h2>
      <p class="sub" style="margin-bottom: 0.75rem;">Record from mic, then play back.</p>
      <div class="row">
        <button type="button" id="btn-record" class="primary">Record</button>
        <button type="button" id="btn-play-rec" disabled>Play</button>
      </div>
      <div id="rec-status">Ready</div>
      <audio id="playback" controls></audio>
    </section>

    <p class="hint">Requires login for WebSocket. <a href="/login">Log in</a> · <a href="/config">Config</a> · <a href="/">Main app</a></p>
  </main>

  <script type="module">
    const DEFAULT_VOICE = "default-zylgts2tamenvybeti3z0w__uncle_tommy";
    const DEFAULT_MODEL = "openai/gpt-4o-mini";
    const DEFAULT_PROMPT = "You are a friendly voice assistant. Keep responses brief.";

    const $ = (id) => document.getElementById(id);
    const apiKeyEl = $("apiKey");
    const voiceEl = $("voice");
    const modelEl = $("model");
    const instructionsEl = $("instructions");
    const statusEl = $("status");
    const checkResultEl = $("check-result");
    const userTextEl = $("user-text");
    const agentTextEl = $("agent-text");
    const btnCheck = $("btn-check");
    const btnConnect = $("btn-connect");
    const btnDisconnect = $("btn-disconnect");

    let ws = null;
    let ctx = null;
    let stream = null;
    let source = null;
    let micNode = null; // AudioWorkletNode, or ScriptProcessor fallback
    let active = false;
    let nextPlayTime = 0;
    const activeSources = new Set();
    let responseText = "";

    // Mic capture runs in an AudioWorklet (audio thread) so low-end devices
    // don't drop microphone chunks when the main thread is busy. It
    // downsamples from the device's native rate to 24 kHz PCM16.
    const MIC_WORKLET_CODE = `
      class Pcm24Capture extends AudioWorkletProcessor {
        constructor() {
          super();
          this.ratio = sampleRate / 24000;
          this.inBuf = new Float32Array(0);
          this.CHUNK = 1200; // 50ms at 24kHz
        }
        process(inputs) {
          const ch = inputs[0] && inputs[0][0];
          if (ch && ch.length) {
            const merged = new Float32Array(this.inBuf.length + ch.length);
            merged.set(this.inBuf);
            merged.set(ch, this.inBuf.length);
            this.inBuf = merged;
          }
          const needed = Math.ceil(this.CHUNK * this.ratio) + 1;
          while (this.inBuf.length >= needed) {
            const out = new Int16Array(this.CHUNK);
            for (let i = 0; i < this.CHUNK; i++) {
              const pos = i * this.ratio;
              const i0 = pos | 0;
              const frac = pos - i0;
              let s = this.inBuf[i0] + (this.inBuf[i0 + 1] - this.inBuf[i0]) * frac;
              if (s > 1) s = 1; else if (s < -1) s = -1;
              out[i] = s < 0 ? s * 32768 : s * 32767;
            }
            this.inBuf = this.inBuf.slice(Math.round(this.CHUNK * this.ratio));
            this.port.postMessage(out.buffer, [out.buffer]);
          }
          return true;
        }
      }
      registerProcessor("pcm24-capture", Pcm24Capture);
    `;

    async function loadWorklet(context) {
      if (!context.audioWorklet) return false;
      try {
        const blob = new Blob([MIC_WORKLET_CODE], { type: "application/javascript" });
        const url = URL.createObjectURL(blob);
        await context.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        return true;
      } catch {
        return false;
      }
    }

    function getFormCfg() {
      return {
        apiKey: apiKeyEl.value.trim(),
        voice: voiceEl.value.trim() || DEFAULT_VOICE,
        model: modelEl.value.trim() || DEFAULT_MODEL,
        instructions: instructionsEl.value.trim() || DEFAULT_PROMPT,
      };
    }

    function setStatus(text, kind = "") {
      // Skip redundant DOM writes — this is called per audio chunk.
      if (statusEl.textContent === text && statusEl.className === kind) return;
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function showCheck(lines, ok) {
      checkResultEl.textContent = lines.join("\n");
      checkResultEl.className = "show" + (ok ? "" : "");
      checkResultEl.style.borderColor = ok ? "#34a853" : "#ea4335";
    }

    function setUiConnected(on) {
      active = on;
      btnConnect.disabled = on;
      btnCheck.disabled = on;
      btnDisconnect.disabled = !on;
      apiKeyEl.disabled = on;
      voiceEl.disabled = on;
      modelEl.disabled = on;
      instructionsEl.disabled = on;
    }

    function b64(buf) {
      const b = new Uint8Array(buf);
      let s = "";
      const STEP = 0x8000;
      for (let i = 0; i < b.length; i += STEP) {
        s += String.fromCharCode.apply(null, b.subarray(i, i + STEP));
      }
      return btoa(s);
    }

    function b64ToBuf(str) {
      const bin = atob(str);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    async function loadServerConfig() {
      try {
        const res = await fetch("/api/config");
        if (res.status === 401) {
          setStatus("Not logged in — log in first", "err");
          return null;
        }
        if (!res.ok) return null;
        const cfg = await res.json();
        if (cfg.apiKey) apiKeyEl.placeholder = "Loaded from server (••••••••)";
        if (cfg.voice) voiceEl.value = cfg.voice;
        if (cfg.model) modelEl.value = cfg.model;
        if (cfg.instructions) instructionsEl.value = cfg.instructions;
        return cfg;
      } catch {
        return null;
      }
    }

    async function checkConnection() {
      btnCheck.disabled = true;
      setStatus("Checking…");
      const lines = [];
      let ok = true;

      const serverCfg = await loadServerConfig();
      const cfg = getFormCfg();
      const apiKey = cfg.apiKey || serverCfg?.apiKey?.trim() || "";

      lines.push(`API key: ${apiKey ? "present" : "MISSING"}`);
      lines.push(`Voice: ${cfg.voice}`);
      lines.push(`Model: ${cfg.model}`);
      lines.push(`Instructions: ${cfg.instructions.slice(0, 60)}${cfg.instructions.length > 60 ? "…" : ""}`);

      if (!apiKey) {
        lines.push("\n✗ Set an API key in the form or at /config");
        ok = false;
        showCheck(lines, ok);
        setStatus("Check failed — no API key", "err");
        btnCheck.disabled = active;
        return;
      }

      lines.push("\nTesting WebSocket…");
      showCheck(lines, ok);

      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${wsProtocol}//${location.host}/ws`);

      try {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("Timeout (12s)")), 12000);

          socket.onopen = () => {
            socket.send(JSON.stringify({
              type: "client.auth",
              apiKey,
              instructions: cfg.instructions,
              voice: cfg.voice,
              model: cfg.model,
            }));
          };

          socket.onmessage = ({ data }) => {
            const e = JSON.parse(data);
            if (e.type === "client.error") {
              clearTimeout(timer);
              reject(new Error(e.message));
              return;
            }
            if (e.type === "session.created" || e.type === "session.updated") {
              clearTimeout(timer);
              resolve(e.type);
            }
          };

          socket.onerror = () => {
            clearTimeout(timer);
            reject(new Error("WebSocket error"));
          };

          socket.onclose = (ev) => {
            if (ev.code === 4001) {
              clearTimeout(timer);
              reject(new Error("Login required — go to /login"));
            }
          };
        });

        lines.push("✓ WebSocket connected");
        lines.push("✓ Inworld session ready");
        setStatus("Check passed", "ok");
      } catch (e) {
        lines.push(`✗ ${e.message || e}`);
        ok = false;
        setStatus("Check failed", "err");
      } finally {
        try { socket.close(); } catch {}
        showCheck(lines, ok);
        btnCheck.disabled = active;
      }
    }

    function openSessionWebSocket(cfg, apiKey) {
      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${wsProtocol}//${location.host}/ws`);
      return new Promise((resolve, reject) => {
        socket.onopen = () => {
          socket.send(JSON.stringify({
            type: "client.auth",
            apiKey,
            instructions: cfg.instructions,
            voice: cfg.voice,
            model: cfg.model,
          }));
          resolve(socket);
        };
        socket.onerror = () => reject(new Error("WebSocket failed"));
        socket.onclose = (ev) => {
          if (ev.code === 4001) reject(new Error("Login required"));
          else if (!active) reject(new Error("WebSocket closed"));
        };
      });
    }

    function sendMicChunk(pcmBuffer) {
      if (ws?.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64(pcmBuffer) }));
    }

    function downsampleTo24k(f32, inRate) {
      if (inRate === 24000) return f32;
      const ratio = inRate / 24000;
      const outLen = Math.floor(f32.length / ratio);
      const out = new Float32Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const pos = i * ratio;
        const i0 = pos | 0;
        const frac = pos - i0;
        const i1 = Math.min(i0 + 1, f32.length - 1);
        out[i] = f32[i0] + (f32[i1] - f32[i0]) * frac;
      }
      return out;
    }

    function setupMicPipeline(hasWorklet) {
      if (ctx?.state === "suspended") ctx.resume().catch(() => {});
      source = ctx.createMediaStreamSource(stream);
      const silent = ctx.createGain();
      silent.gain.value = 0;

      if (hasWorklet) {
        micNode = new AudioWorkletNode(ctx, "pcm24-capture", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          channelCount: 1,
        });
        micNode.port.onmessage = ({ data }) => sendMicChunk(data);
        source.connect(micNode);
        micNode.connect(silent);
      } else {
        const inRate = ctx.sampleRate;
        micNode = ctx.createScriptProcessor(4096, 1, 1);
        micNode.onaudioprocess = ({ inputBuffer }) => {
          const f = downsampleTo24k(inputBuffer.getChannelData(0), inRate);
          const pcm = new Int16Array(f.length);
          for (let i = 0; i < f.length; i++) {
            pcm[i] = Math.max(-32768, Math.min(32767, f[i] * 32768));
          }
          sendMicChunk(pcm.buffer);
        };
        source.connect(micNode);
        micNode.connect(silent);
      }
      silent.connect(ctx.destination);
    }

    function stopAudio() {
      for (const node of activeSources) {
        try { node.stop(); } catch {}
      }
      activeSources.clear();
      nextPlayTime = 0;
    }

    // Schedule each chunk immediately at a chained start time instead of
    // waiting for onended callbacks — those run on the main thread and cause
    // gaps on slow devices.
    function schedulePcmChunk(arrayBuffer) {
      const pcm16 = new Int16Array(arrayBuffer);
      const len = pcm16.length;
      if (!len) return;
      const f32 = new Float32Array(len);
      for (let i = 0; i < len; i++) f32[i] = pcm16[i] / 32768;

      const buf = ctx.createBuffer(1, len, 24000);
      buf.getChannelData(0).set(f32);
      const node = ctx.createBufferSource();
      node.buffer = buf;
      node.connect(ctx.destination);
      const t = Math.max(ctx.currentTime + 0.05, nextPlayTime);
      node.start(t);
      nextPlayTime = t + buf.duration;
      activeSources.add(node);
      node.onended = () => activeSources.delete(node);
    }

    function handleWsMessage(data) {
      const e = JSON.parse(data);

      if (e.type === "client.error") {
        setStatus(e.message, "err");
        cleanup();
        return;
      }

      if (e.type === "response.output_text.delta" || e.type === "response.output_audio_transcript.delta") {
        responseText += e.delta || "";
        agentTextEl.textContent = responseText || "—";
      }

      if (e.type === "response.output_text.done" || e.type === "response.output_audio_transcript.done") {
        responseText = e.text || e.transcript || responseText;
        agentTextEl.textContent = responseText || "—";
      }

      if (e.type === "response.output_audio.delta") {
        setStatus("Live — speak anytime", "live");
        schedulePcmChunk(b64ToBuf(e.delta));
      }

      if (e.type === "conversation.item.input_audio_transcription.completed" && e.transcript?.trim()) {
        userTextEl.textContent = e.transcript.trim();
      }

      if (e.type === "input_audio_buffer.speech_started") {
        responseText = "";
        agentTextEl.textContent = "—";
        stopAudio();
      }

      if (e.type === "session.updated" || e.type === "session.created") {
        setStatus("Live — speak anytime", "live");
      }
    }

    function releaseMic() {
      if (micNode) {
        try { micNode.port?.close?.(); } catch {}
        micNode.onaudioprocess = null;
        try { micNode.disconnect(); } catch {}
      }
      try { source?.disconnect(); } catch {}
      micNode = null;
      source = null;
      try { stream?.getTracks().forEach((t) => t.stop()); } catch {}
      stream = null;
      try { if (ctx?.state !== "closed") ctx?.close(); } catch {}
      ctx = null;
    }

    function cleanup() {
      stopAudio();
      try { ws?.close(); } catch {}
      ws = null;
      releaseMic();
      setUiConnected(false);
      if (!statusEl.classList.contains("err")) setStatus("Disconnected");
      btnConnect.textContent = "Connect";
    }

    async function connect() {
      if (active) return;

      const serverCfg = await loadServerConfig().catch(() => null);
      const cfg = getFormCfg();
      const apiKey = cfg.apiKey || serverCfg?.apiKey?.trim() || "";
      if (!apiKey) {
        setStatus("No API key", "err");
        return;
      }

      btnConnect.disabled = true;
      btnConnect.textContent = "Connecting…";
      setStatus("Connecting…");
      userTextEl.textContent = "—";
      agentTextEl.textContent = "—";
      responseText = "";

      let hasWorklet = false;
      try {
        // Run the context at the device's native rate — forcing 24 kHz makes
        // some Android devices resample every audio callback. The worklet
        // downsamples mic input; playback buffers resample automatically.
        ctx = new AudioContext({ latencyHint: "interactive" });
        const workletPromise = loadWorklet(ctx);
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        ws = await openSessionWebSocket(cfg, apiKey);
        hasWorklet = await workletPromise;
      } catch (e) {
        const denied = e?.name === "NotAllowedError" || e?.name === "NotFoundError";
        setStatus(denied ? "Microphone denied" : (e.message || "Connection failed"), "err");
        cleanup();
        return;
      }

      ws.onmessage = ({ data }) => {
        try { handleWsMessage(data); } catch (err) { console.error(err); }
      };
      ws.onclose = () => cleanup();

      setupMicPipeline(hasWorklet);
      setUiConnected(true);
      btnConnect.textContent = "Connect";
      setStatus("Live — speak anytime", "live");
    }

    btnCheck.addEventListener("click", checkConnection);
    btnConnect.addEventListener("click", connect);
    btnDisconnect.addEventListener("click", () => {
      try { ws?.close(); } catch {}
      cleanup();
    });

    // --- Simple audio recorder ---
    const btnRecord = $("btn-record");
    const btnPlayRec = $("btn-play-rec");
    const recStatusEl = $("rec-status");
    const playbackEl = $("playback");

    let mediaRecorder = null;
    let recStream = null;
    let recChunks = [];
    let recBlobUrl = null;

    function setRecStatus(text, recording = false) {
      recStatusEl.textContent = text;
      recStatusEl.className = recording ? "recording" : "";
    }

    function clearRecording() {
      if (recBlobUrl) {
        URL.revokeObjectURL(recBlobUrl);
        recBlobUrl = null;
      }
      recChunks = [];
      playbackEl.removeAttribute("src");
      playbackEl.classList.remove("show");
      btnPlayRec.disabled = true;
    }

    async function startRecording() {
      if (mediaRecorder?.state === "recording") return;
      clearRecording();

      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        const denied = e?.name === "NotAllowedError" || e?.name === "NotFoundError";
        setRecStatus(denied ? "Microphone denied" : "Could not access mic");
        return;
      }

      const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
      mediaRecorder = mimeType ? new MediaRecorder(recStream, { mimeType }) : new MediaRecorder(recStream);
      recChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        recStream?.getTracks().forEach((t) => t.stop());
        recStream = null;

        const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        recBlobUrl = URL.createObjectURL(blob);
        playbackEl.src = recBlobUrl;
        playbackEl.classList.add("show");
        btnPlayRec.disabled = false;
        btnRecord.textContent = "Record";
        btnRecord.classList.add("primary");
        btnRecord.classList.remove("danger");
        setRecStatus("Recorded — tap Play or use player below");
      };

      mediaRecorder.start();
      btnRecord.textContent = "Stop";
      btnRecord.classList.remove("primary");
      btnRecord.classList.add("danger");
      setRecStatus("Recording…", true);
    }

    function stopRecording() {
      if (mediaRecorder?.state === "recording") {
        mediaRecorder.stop();
        setRecStatus("Processing…");
      }
    }

    btnRecord.addEventListener("click", () => {
      if (mediaRecorder?.state === "recording") stopRecording();
      else startRecording();
    });

    btnPlayRec.addEventListener("click", () => {
      if (!recBlobUrl) return;
      playbackEl.play().catch(() => setRecStatus("Playback blocked — use player below"));
    });

    playbackEl.addEventListener("loadedmetadata", () => {
      if (recBlobUrl && playbackEl.duration && isFinite(playbackEl.duration)) {
        setRecStatus(`Recorded (${playbackEl.duration.toFixed(1)}s) — tap Play or use player below`);
      }
    });

    voiceEl.value = DEFAULT_VOICE;
    modelEl.value = DEFAULT_MODEL;
    instructionsEl.value = DEFAULT_PROMPT;
    loadServerConfig();
  </script>
</body>
</html>
