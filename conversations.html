<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversations — Uncle Tommy</title>
  <link rel="stylesheet" href="/admin-nav.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f1117;
      color: #e8eaed;
      padding: 1.5rem;
    }
    .page {
      width: min(100%, 1400px);
      margin: 0 auto;
    }
    .split-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }
    @media (max-width: 980px) {
      .split-grid { grid-template-columns: 1fr; }
    }
    .panel-title {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: #c4c7c5;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.35rem; }
    .lead {
      margin: 0 0 1.5rem;
      color: #9aa0a6;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: end;
      margin-bottom: 1rem;
    }
    .field { margin: 0; }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #9aa0a6;
    }
    select, button {
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #3c4043;
      background: #0f1117;
      color: #e8eaed;
      font-size: 0.875rem;
    }
    button {
      cursor: pointer;
      background: #6c8cff;
      border-color: #6c8cff;
      color: #fff;
      font-weight: 500;
    }
    button:hover { background: #5a7aef; }
    button.secondary {
      background: transparent;
      border-color: #3c4043;
      color: #c4c7c5;
    }
    button.secondary:hover {
      border-color: #5f6368;
      color: #e8eaed;
    }
    button.danger {
      background: transparent;
      border-color: #8b3a3a;
      color: #f28b82;
    }
    button.danger:hover {
      background: #3a1e1e;
      border-color: #c5221f;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      overflow: hidden;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #2a2f3a;
      vertical-align: top;
    }
    th {
      color: #9aa0a6;
      font-weight: 500;
      background: #151821;
    }
    tr.session-row {
      cursor: pointer;
      transition: background 0.12s;
    }
    tr.session-row:hover,
    tr.profile-log-row:hover { background: #20242f; }
    tr.session-row.active,
    tr.profile-log-row.active { background: #252b3a; }
    tr.session-row,
    tr.profile-log-row {
      cursor: pointer;
      transition: background 0.12s;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.7rem;
      background: #2a3348;
      color: #c4c7c5;
    }
    .badge.student { background: #1e3a2f; color: #81c995; }
    .badge.admin { background: #3a2f1e; color: #fdd663; }
    .badge.success { background: #1e3a2f; color: #81c995; }
    .badge.skipped { background: #2a3348; color: #9aa0a6; }
    .badge.error { background: #3a1e1e; color: #f28b82; }
    .badge.no_changes { background: #2f3a1e; color: #cddc39; }
    .empty {
      padding: 2rem 1rem;
      text-align: center;
      color: #9aa0a6;
      font-size: 0.875rem;
    }
    .detail {
      margin-top: 1rem;
      padding: 1.25rem;
      background: #1a1d27;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      display: none;
    }
    .detail.visible { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    @media (max-width: 980px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
    .summary-block {
      padding: 1rem;
      background: #12151c;
      border: 1px solid #2a2f3a;
      border-radius: 10px;
    }
    .summary-block h3 {
      margin: 0 0 0.75rem;
      font-size: 0.875rem;
      color: #c4c7c5;
    }
    .summary-kv {
      display: grid;
      gap: 0.35rem;
      font-size: 0.8125rem;
      color: #9aa0a6;
      margin-bottom: 0.75rem;
    }
    .summary-kv strong { color: #e8eaed; }
    .updates-list {
      margin: 0;
      padding-left: 1.1rem;
      font-size: 0.8125rem;
      line-height: 1.5;
    }
    .updates-list li { margin-bottom: 0.35rem; }
    .updates-list code {
      color: #8ab4f8;
      font-size: 0.75rem;
    }
    .detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #2a2f3a;
    }
    .detail-meta {
      font-size: 0.8125rem;
      color: #9aa0a6;
      line-height: 1.5;
    }
    .detail-meta strong { color: #e8eaed; }
    .turns {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 60vh;
      overflow-y: auto;
    }
    .turn {
      padding: 0.75rem 0.875rem;
      border-radius: 10px;
      border: 1px solid #2a2f3a;
      background: #12151c;
    }
    .turn.user { border-color: #2f4a6b; background: #152033; }
    .turn.assistant { border-color: #3a4a2f; background: #1a2318; }
    .turn.tool { border-color: #4a3a2f; background: #231c16; }
    .turn-head {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      color: #9aa0a6;
    }
    .turn-role {
      font-weight: 600;
      text-transform: capitalize;
      color: #c4c7c5;
    }
    .turn-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.875rem;
    }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid #2a2f3a;
      font-size: 0.8125rem;
      color: #9aa0a6;
    }
    .status {
      margin-top: 0.75rem;
      font-size: 0.8125rem;
      color: #f28b82;
      display: none;
    }
    .status.visible { display: block; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Conversations &amp; Profile Summaries</h1>
    <p class="lead">Review voice session transcripts and the automatic profile-summary runs that happen after each student session.</p>

    <div class="toolbar">
      <div class="field">
        <label for="user-filter">Account</label>
        <select id="user-filter">
          <option value="">All accounts</option>
        </select>
      </div>
      <button type="button" id="refresh-btn">Refresh</button>
    </div>

    <div class="split-grid">
      <section>
        <h2 class="panel-title">Conversation history</h2>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Started</th>
                  <th>Account</th>
                  <th>Duration</th>
                  <th>Turns</th>
                </tr>
              </thead>
              <tbody id="sessions-body">
                <tr><td colspan="4" class="empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pager" id="pager" hidden>
            <button type="button" class="secondary" id="prev-btn">Previous</button>
            <span id="pager-label"></span>
            <button type="button" class="secondary" id="next-btn">Next</button>
          </div>
        </div>
      </section>

      <section>
        <h2 class="panel-title">Profile summary log</h2>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Account</th>
                  <th>Status</th>
                  <th>Model</th>
                </tr>
              </thead>
              <tbody id="profile-logs-body">
                <tr><td colspan="4" class="empty">Loading…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pager" id="profile-pager" hidden>
            <button type="button" class="secondary" id="profile-prev-btn">Previous</button>
            <span id="profile-pager-label"></span>
            <button type="button" class="secondary" id="profile-next-btn">Next</button>
          </div>
        </div>
      </section>
    </div>

    <div class="detail-grid">
      <div class="detail" id="detail-panel">
        <div class="detail-header">
          <div class="detail-meta" id="detail-meta"></div>
          <button type="button" class="danger" id="delete-btn">Delete session</button>
        </div>
        <div class="turns" id="turns"></div>
      </div>

      <div class="detail" id="profile-detail-panel">
        <div class="detail-header">
          <div class="detail-meta" id="profile-detail-meta"></div>
        </div>
        <div id="profile-detail-body"></div>
      </div>
    </div>

    <p class="status" id="status"></p>
  </div>

  <script src="/admin-nav.js"></script>
  <script>
    const PAGE_SIZE = 25;
    const USER_LIST = Array.from({ length: 20 }, (_, i) => `user${String(i + 1).padStart(2, '0')}`);

    const userFilter = document.getElementById('user-filter');
    const sessionsBody = document.getElementById('sessions-body');
    const profileLogsBody = document.getElementById('profile-logs-body');
    const detailPanel = document.getElementById('detail-panel');
    const profileDetailPanel = document.getElementById('profile-detail-panel');
    const detailMeta = document.getElementById('detail-meta');
    const profileDetailMeta = document.getElementById('profile-detail-meta');
    const profileDetailBody = document.getElementById('profile-detail-body');
    const turnsEl = document.getElementById('turns');
    const pager = document.getElementById('pager');
    const profilePager = document.getElementById('profile-pager');
    const pagerLabel = document.getElementById('pager-label');
    const profilePagerLabel = document.getElementById('profile-pager-label');
    const statusEl = document.getElementById('status');

    let offset = 0;
    let profileOffset = 0;
    let total = 0;
    let profileTotal = 0;
    let selectedId = null;
    let selectedProfileLogId = null;

    for (const username of USER_LIST) {
      const option = document.createElement('option');
      option.value = username;
      option.textContent = username;
      userFilter.appendChild(option);
    }
    const adminOption = document.createElement('option');
    adminOption.value = 'admin';
    adminOption.textContent = 'admin';
    userFilter.appendChild(adminOption);

    function showStatus(message) {
      statusEl.textContent = message;
      statusEl.classList.add('visible');
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.classList.remove('visible');
    }

    function formatDate(ms) {
      if (!ms) return '—';
      return new Date(ms).toLocaleString();
    }

    function formatDuration(startedAt, endedAt) {
      if (!startedAt || !endedAt) return 'In progress';
      const seconds = Math.max(1, Math.round((endedAt - startedAt) / 1000));
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      const rem = seconds % 60;
      return rem ? `${minutes}m ${rem}s` : `${minutes}m`;
    }

    function roleBadge(role) {
      const cls = role === 'student' ? 'student' : role === 'admin' ? 'admin' : '';
      return `<span class="badge ${cls}">${role || 'unknown'}</span>`;
    }

    function statusBadge(status) {
      const cls = ['success', 'skipped', 'error', 'no_changes'].includes(status) ? status : '';
      return `<span class="badge ${cls}">${status || 'unknown'}</span>`;
    }

    async function loadSessions() {
      clearStatus();
      const username = userFilter.value;
      const params = new URLSearchParams({
        limit: String(PAGE_SIZE),
        offset: String(offset),
      });
      if (username) params.set('username', username);

      const res = await fetch(`/api/conversations?${params}`);
      if (!res.ok) {
        showStatus('Could not load conversations.');
        return;
      }

      const data = await res.json();
      total = data.total || 0;
      renderSessions(data.conversations || []);
      updatePager();
    }

    async function loadProfileLogs({ conversationId = null } = {}) {
      const username = userFilter.value;
      const params = new URLSearchParams({
        limit: String(PAGE_SIZE),
        offset: String(conversationId ? 0 : profileOffset),
      });
      if (username) params.set('username', username);
      if (conversationId) params.set('conversationId', conversationId);

      const res = await fetch(`/api/profile-sync-logs?${params}`);
      if (!res.ok) {
        showStatus('Could not load profile summary logs.');
        return;
      }

      const data = await res.json();
      if (!conversationId) {
        profileTotal = data.total || 0;
        renderProfileLogs(data.logs || []);
        updateProfilePager();
      }
      return data.logs || [];
    }

    function renderSessions(sessions) {
      if (!sessions.length) {
        sessionsBody.innerHTML = '<tr><td colspan="4" class="empty">No conversations recorded yet.</td></tr>';
        return;
      }

      sessionsBody.innerHTML = sessions.map((session) => `
        <tr class="session-row${session.id === selectedId ? ' active' : ''}" data-id="${session.id}">
          <td>${formatDate(session.startedAt)}</td>
          <td>${session.username}</td>
          <td>${formatDuration(session.startedAt, session.endedAt)}</td>
          <td>${session.turnCount || 0}</td>
        </tr>
      `).join('');

      sessionsBody.querySelectorAll('.session-row').forEach((row) => {
        row.addEventListener('click', () => openSession(row.dataset.id));
      });
    }

    function renderProfileLogs(logs) {
      if (!logs.length) {
        profileLogsBody.innerHTML = '<tr><td colspan="4" class="empty">No profile summaries yet.</td></tr>';
        return;
      }

      profileLogsBody.innerHTML = logs.map((log) => `
        <tr class="profile-log-row${log.id === selectedProfileLogId ? ' active' : ''}" data-id="${log.id}" data-conversation-id="${log.conversationId || ''}">
          <td>${formatDate(log.createdAt)}</td>
          <td>${log.username}</td>
          <td>${statusBadge(log.status)}</td>
          <td>${log.model || '—'}</td>
        </tr>
      `).join('');

      profileLogsBody.querySelectorAll('.profile-log-row').forEach((row) => {
        row.addEventListener('click', () => openProfileLog(row.dataset.id, row.dataset.conversationId));
      });
    }

    function updatePager() {
      const hasRows = total > 0;
      pager.hidden = !hasRows;
      if (!hasRows) return;
      const start = offset + 1;
      const end = Math.min(offset + PAGE_SIZE, total);
      pagerLabel.textContent = `${start}–${end} of ${total}`;
      document.getElementById('prev-btn').disabled = offset <= 0;
      document.getElementById('next-btn').disabled = offset + PAGE_SIZE >= total;
    }

    function updateProfilePager() {
      const hasRows = profileTotal > 0;
      profilePager.hidden = !hasRows;
      if (!hasRows) return;
      const start = profileOffset + 1;
      const end = Math.min(profileOffset + PAGE_SIZE, profileTotal);
      profilePagerLabel.textContent = `${start}–${end} of ${profileTotal}`;
      document.getElementById('profile-prev-btn').disabled = profileOffset <= 0;
      document.getElementById('profile-next-btn').disabled = profileOffset + PAGE_SIZE >= profileTotal;
    }

    function renderProfileLogDetail(log) {
      if (!log) {
        profileDetailMeta.innerHTML = '<div>Select a profile summary log</div>';
        profileDetailBody.innerHTML = '<div class="empty">No profile summary selected.</div>';
        profileDetailPanel.classList.remove('visible');
        return;
      }

      profileDetailMeta.innerHTML = `
        <div><strong>${log.username}</strong> · ${statusBadge(log.status)}</div>
        <div>Time: ${formatDate(log.createdAt)}</div>
        <div>Model: ${log.model || '—'}</div>
        <div>Conversation: ${log.conversationId || '—'}</div>
      `;

      let updatesHtml = '<div class="empty">No profile fields were updated.</div>';
      if (log.updates && typeof log.updates === 'object' && Object.keys(log.updates).length) {
        updatesHtml = `<ul class="updates-list">${Object.entries(log.updates).map(([key, value]) => `
          <li><code>${key}</code>: ${value}</li>
        `).join('')}</ul>`;
      } else if (log.changedFields?.length) {
        updatesHtml = `<ul class="updates-list">${log.changedFields.map((field) => `<li><code>${field}</code></li>`).join('')}</ul>`;
      }

      profileDetailBody.innerHTML = `
        <div class="summary-block">
          <h3>Summary result</h3>
          <div class="summary-kv">
            <div><strong>Status:</strong> ${log.status}</div>
            <div><strong>Message:</strong> ${log.message || '—'}</div>
            <div><strong>Changed fields:</strong> ${log.changedFields?.length ? log.changedFields.join(', ') : '—'}</div>
          </div>
          <h3>Applied updates</h3>
          ${updatesHtml}
        </div>
      `;
      profileDetailPanel.classList.add('visible');
    }

    async function openProfileLog(logId, conversationId = '') {
      selectedProfileLogId = Number(logId);
      profileLogsBody.querySelectorAll('.profile-log-row').forEach((row) => {
        row.classList.toggle('active', Number(row.dataset.id) === selectedProfileLogId);
      });

      const res = await fetch(`/api/profile-sync-logs/${encodeURIComponent(logId)}`);
      if (!res.ok) {
        showStatus('Could not load profile summary details.');
        return;
      }

      const log = await res.json();
      renderProfileLogDetail(log);

      if (conversationId && conversationId !== selectedId) {
        await openSession(conversationId, { skipProfileLogFetch: true });
      }
    }

    async function openSession(id, { skipProfileLogFetch = false } = {}) {
      selectedId = id;
      sessionsBody.querySelectorAll('.session-row').forEach((row) => {
        row.classList.toggle('active', row.dataset.id === id);
      });

      const res = await fetch(`/api/conversations/${encodeURIComponent(id)}`);
      if (!res.ok) {
        showStatus('Could not load conversation details.');
        return;
      }

      const data = await res.json();
      detailMeta.innerHTML = `
        <div><strong>${data.username}</strong> (${data.role})</div>
        <div>Started: ${formatDate(data.startedAt)}</div>
        <div>Ended: ${formatDate(data.endedAt)}</div>
        <div>Duration: ${formatDuration(data.startedAt, data.endedAt)}</div>
        <div>Turns: ${data.turnCount || 0}</div>
      `;

      if (!data.turns?.length) {
        turnsEl.innerHTML = '<div class="empty">No transcript turns captured for this session.</div>';
      } else {
        turnsEl.innerHTML = data.turns.map((turn) => `
          <article class="turn ${turn.role}">
            <div class="turn-head">
              <span class="turn-role">${turn.role}</span>
              <time>${formatDate(turn.createdAt)}</time>
            </div>
            <p class="turn-text"></p>
          </article>
        `).join('');
        turnsEl.querySelectorAll('.turn').forEach((node, index) => {
          node.querySelector('.turn-text').textContent = data.turns[index].text;
        });
      }

      detailPanel.classList.add('visible');

      if (!skipProfileLogFetch) {
        if (data.profileSyncLog) {
          selectedProfileLogId = data.profileSyncLog.id;
          profileLogsBody.querySelectorAll('.profile-log-row').forEach((row) => {
            row.classList.toggle('active', Number(row.dataset.id) === selectedProfileLogId);
          });
          renderProfileLogDetail(data.profileSyncLog);
        } else {
          const logs = await loadProfileLogs({ conversationId: id });
          if (logs[0]) {
            selectedProfileLogId = logs[0].id;
            profileLogsBody.querySelectorAll('.profile-log-row').forEach((row) => {
              row.classList.toggle('active', Number(row.dataset.id) === selectedProfileLogId);
            });
            renderProfileLogDetail(logs[0]);
          } else {
            renderProfileLogDetail(null);
          }
        }
      }
    }

    async function deleteSession() {
      if (!selectedId) return;
      if (!confirm('Delete this conversation and all transcript turns?')) return;

      const res = await fetch(`/api/conversations/${encodeURIComponent(selectedId)}`, {
        method: 'DELETE',
      });
      if (!res.ok) {
        showStatus('Could not delete conversation.');
        return;
      }

      selectedId = null;
      selectedProfileLogId = null;
      detailPanel.classList.remove('visible');
      profileDetailPanel.classList.remove('visible');
      await loadSessions();
      await loadProfileLogs();
    }

    async function refreshAll() {
      offset = 0;
      profileOffset = 0;
      selectedId = null;
      selectedProfileLogId = null;
      detailPanel.classList.remove('visible');
      profileDetailPanel.classList.remove('visible');
      await Promise.all([loadSessions(), loadProfileLogs()]);
    }

    document.getElementById('refresh-btn').addEventListener('click', refreshAll);
    userFilter.addEventListener('change', () => {
      offset = 0;
      profileOffset = 0;
      selectedId = null;
      selectedProfileLogId = null;
      detailPanel.classList.remove('visible');
      profileDetailPanel.classList.remove('visible');
      Promise.all([loadSessions(), loadProfileLogs()]);
    });
    document.getElementById('prev-btn').addEventListener('click', () => {
      offset = Math.max(0, offset - PAGE_SIZE);
      loadSessions();
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (offset + PAGE_SIZE < total) {
        offset += PAGE_SIZE;
        loadSessions();
      }
    });
    document.getElementById('profile-prev-btn').addEventListener('click', () => {
      profileOffset = Math.max(0, profileOffset - PAGE_SIZE);
      loadProfileLogs();
    });
    document.getElementById('profile-next-btn').addEventListener('click', () => {
      if (profileOffset + PAGE_SIZE < profileTotal) {
        profileOffset += PAGE_SIZE;
        loadProfileLogs();
      }
    });
    document.getElementById('delete-btn').addEventListener('click', deleteSession);

    refreshAll();
  </script>
</body>
</html>
