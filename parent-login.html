<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Parent Sign In — Lango</title>
  <link rel="stylesheet" href="/assets/page-motion.css">
  <script src="/assets/page-motion.js"></script>
  <link rel="preload" href="/langoLogo.jpeg" as="image">
  <style>
    :root {
      --bg: #f2f2f7;
      --bg-solid: #ffffff;
      --bg-fill: rgba(120, 120, 128, 0.12);
      --bg-fill-strong: rgba(120, 120, 128, 0.2);
      --label: #1c1c1e;
      --label-secondary: rgba(60, 60, 67, 0.72);
      --label-tertiary: rgba(60, 60, 67, 0.48);
      --separator: rgba(60, 60, 67, 0.18);
      --tint: #007aff;
      --tint-pressed: #0066d6;
      --danger: #ff3b30;
      --danger-soft: rgba(255, 59, 48, 0.1);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 40px rgba(0, 0, 0, 0.08);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-press: cubic-bezier(0.2, 0.8, 0.2, 1);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      font: 100%/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-optical-sizing: auto;
      background:
        radial-gradient(120% 80% at 50% -20%, rgba(0, 122, 255, 0.1), transparent 50%),
        var(--bg);
      color: var(--label);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
    }

    .login-card {
      width: min(100%, 400px);
      padding: 2.1rem 1.65rem 1.75rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.55);
      animation: card-in 520ms var(--ease-out) both;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.15rem;
    }

    .logo-wrap img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    .title-wrap {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .eyebrow {
      margin: 0 0 0.45rem;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--tint);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 0.55rem 0 0;
      font-size: 0.95rem;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: var(--label-secondary);
    }

    .field {
      margin-bottom: 0.85rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      padding-left: 0.15rem;
      font-size: 0.8rem;
      font-weight: 560;
      letter-spacing: -0.01em;
      color: var(--label-secondary);
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0.8rem 0.95rem;
      border: 1px solid transparent;
      border-radius: 14px;
      background: var(--bg-fill);
      color: var(--label);
      font: inherit;
      font-size: 1.02rem;
      letter-spacing: -0.01em;
      outline: none;
      transition:
        background 180ms var(--ease-out),
        border-color 180ms var(--ease-out),
        box-shadow 180ms var(--ease-out);
    }

    input::placeholder {
      color: var(--label-tertiary);
    }

    input:hover {
      background: var(--bg-fill-strong);
    }

    input:focus {
      background: var(--bg-solid);
      border-color: rgba(0, 122, 255, 0.45);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      min-height: 50px;
      margin-top: 0.45rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 980px;
      background: var(--tint);
      color: #fff;
      font: inherit;
      font-size: 1.02rem;
      font-weight: 620;
      letter-spacing: -0.015em;
      cursor: pointer;
      transition:
        transform 120ms var(--ease-press),
        background 180ms var(--ease-out),
        opacity 180ms var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--tint-pressed);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: scale(0.97);
    }

    button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button[type="submit"]:focus-visible {
      outline: 2px solid var(--tint);
      outline-offset: 3px;
    }

    .error {
      display: none;
      margin-bottom: 0.95rem;
      padding: 0.8rem 0.95rem;
      border-radius: 14px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      text-align: center;
      line-height: 1.4;
    }

    .error.visible {
      display: block;
      animation: shake 320ms var(--ease-out);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .hint {
      margin: 1.35rem 0 0;
      font-size: 0.82rem;
      line-height: 1.5;
      letter-spacing: -0.01em;
      color: var(--label-tertiary);
      text-align: center;
    }

    .hint a {
      color: var(--tint);
      text-decoration: none;
      font-weight: 560;
    }

    .hint a:hover {
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card,
      .error.visible {
        animation: none !important;
      }

      button[type="submit"],
      input {
        transition: none !important;
      }

      button[type="submit"]:active:not(:disabled) {
        transform: none;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .login-card {
        background: var(--bg-solid);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    @media (prefers-contrast: more) {
      .login-card,
      input {
        border: 1px solid var(--label);
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-wrap">
      <img src="/langoLogo.jpeg" alt="Lango" width="72" height="72" decoding="async">
    </div>
    <div class="title-wrap">
      <p class="eyebrow">Parent Portal</p>
      <h1>See what they learned</h1>
      <p class="subtitle">Sign in with your child’s learner account to view smartpen vocabulary and get practice ideas.</p>
    </div>

    <div id="error" class="error" role="alert"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Learner username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="e.g. user01">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit" id="submit-btn">Continue</button>
    </form>

    <p class="hint">
      Looking for Uncle Tommy voice practice?
      <a href="/login">Student sign in</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const nextUrl = new URLSearchParams(location.search).get("next") || "/parent";

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("visible");
    }

    function clearError() {
      errorEl.textContent = "";
      errorEl.classList.remove("visible");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            userAgent: navigator.userAgent,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || "Sign in failed.");
        }
        location.href = nextUrl.startsWith("/") ? nextUrl : "/parent";
      } catch (err) {
        showError(err.message || "Could not sign in.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue";
      }
    });
  </script>
</body>
</html>
