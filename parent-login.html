  const DAY_LABELS = {
    en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    "zh-Hant": ["日", "一", "二", "三", "四", "五", "六"],
    "zh-Hans": ["日", "一", "二", "三", "四", "五", "六"],
  };

  function normalizeLang(raw) {
    const v = String(raw || "").trim();
    if (LANGS.includes(v)) return v;
    if (v.startsWith("zh")) {
      if (v.includes("Hans") || v === "zh-CN" || v === "zh-SG") return "zh-Hans";
      return "zh-Hant";
    }
    return "en";
  }

  function getParentLang() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return normalizeLang(saved);
    } catch { /* ignore */ }
    const nav = navigator.language || "en";
    return normalizeLang(nav);
  }

  let currentLang = getParentLang();

  function setParentLang(lang) {
    currentLang = normalizeLang(lang);
    try { localStorage.setItem(STORAGE_KEY, currentLang); } catch { /* ignore */ }
    document.documentElement.lang = currentLang === "zh-Hans" ? "zh-Hans" : currentLang === "zh-Hant" ? "zh-Hant" : "en";
    applyParentI18n();
    global.dispatchEvent(new CustomEvent("parent-lang-change", { detail: { lang: currentLang } }));
    return currentLang;
  }

  function t(key, params = {}) {
    const table = STRINGS[currentLang] || STRINGS.en;
    const fallback = STRINGS.en[key] || key;
    let text = table[key] ?? fallback;
    for (const [k, v] of Object.entries(params)) {
      text = text.replaceAll(`{${k}}`, String(v ?? ""));
    }
    return text;
  }

  function dayLabels() {
    return DAY_LABELS[currentLang] || DAY_LABELS.en;
  }

  function applyParentI18n(root = document) {
    root.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (key) el.textContent = t(key);
    });
    root.querySelectorAll("[data-i18n-html]").forEach((el) => {
      const key = el.getAttribute("data-i18n-html");
      if (key) el.innerHTML = t(key);
    });
    root.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
      const key = el.getAttribute("data-i18n-placeholder");
      if (key) el.placeholder = t(key);
    });
    root.querySelectorAll("[data-i18n-aria]").forEach((el) => {
      const key = el.getAttribute("data-i18n-aria");
      if (key) el.setAttribute("aria-label", t(key));
    });
    root.querySelectorAll("[data-i18n-title]").forEach((el) => {
      const key = el.getAttribute("data-i18n-title");
      if (key) el.title = t(key);
    });
    document.querySelectorAll(".lang-select").forEach((sel) => {
      sel.value = currentLang;
    });
    if (document.titleKey) document.title = t(document.titleKey);
  }

  global.ParentI18n = {
    LANGS,
    getParentLang: () => currentLang,
    setParentLang,
    t,
    dayLabels,
    applyParentI18n,
  };
})(window);

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }

    .field {
      margin-bottom: 0.85rem;
      animation: fade-up 480ms var(--ease-out) both;
    }

    .field:nth-child(1) { animation-delay: 220ms; }
    .field:nth-child(2) { animation-delay: 280ms; }

    label {
      display: block;

      color: var(--text-2);

    input {
      width: 100%;
      min-height: 48px;
      padding: 0.8rem 0.95rem;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--card-alt);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: background 180ms var(--ease-out), border-color 180ms, box-shadow 180ms, transform 120ms var(--ease-press);

    input:focus {
      background: var(--card);
      border-color: rgba(108, 92, 224, 0.45);
      box-shadow: 0 0 0 4px rgba(108, 92, 224, 0.12);
    }

    button[type="submit"] {
      width: 100%;
      min-height: 50px;
      margin-top: 0.45rem;
      border: none;
      border-radius: 980px;
      background: var(--purple);
      color: #fff;
      font-family: "Fredoka", "Nunito", sans-serif;
      font-size: 1.02rem;
      font-weight: 600;
      cursor: pointer;
      animation: fade-up 480ms var(--ease-out) 340ms both;
      transition: transform 120ms var(--ease-press), background 180ms, opacity 180ms;
      -webkit-tap-highlight-color: transparent;
    }

    button[type="submit"]:hover:not(:disabled) { background: #5a4ac8; }
    button[type="submit"]:active:not(:disabled) { transform: scale(0.97); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: not-allowed; }

    .error {
      display: none;
      margin-bottom: 0.95rem;
      padding: 0.8rem 0.95rem;
      border-radius: 14px;

    @keyframes shake {

    .hint a:hover {
      text-decoration: underline;

    @media (min-width: 900px) {
      body {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 2.5rem;
        padding: 2rem 3rem;
      }

      .lang-select-wrap {
        position: fixed;
        top: calc(1.25rem + env(safe-area-inset-top, 0px));
        right: 2rem;

        width: min(100%, 880px);
        display: grid;

        max-width: 14rem;

        flex-direction: column;
        justify-content: center;

      }

    @media (hover: hover) and (pointer: fine) {
      input:hover {
        background: rgba(108, 92, 224, 0.08);
      }

      button[type="submit"]:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(108, 92, 224, 0.35);
      }

    @media (prefers-reduced-motion: reduce) {

      button[type="submit"]:active:not(:disabled) { transform: none; }

</head>
<body>
  <div class="lang-select-wrap">
    <label class="sr-only" for="lang-select" data-i18n="langLabel">Language</label>
    <select id="lang-select" class="lang-select" aria-label="Language">
      <option value="en" data-i18n="langEn">English</option>
      <option value="zh-Hant" data-i18n="langZhHant">繁體中文</option>
      <option value="zh-Hans" data-i18n="langZhHans">简体中文</option>
    </select>
  </div>

  <div class="login-card">
    <div class="login-hero">
      <div class="logo-wrap">
        <img src="/assets/parent-logo.png" alt="Lango Parent" width="955" height="904" decoding="async">
      </div>
      <p class="eyebrow" data-i18n="loginEyebrow">Parent Portal</p>
      <h1 data-i18n="loginHeading">See what they learned</h1>
    </div>
    <div class="login-body">
      <p class="subtitle" data-i18n="loginSub">Sign in with your child's learner account to view smartpen vocabulary and get practice ideas.</p>

      <div id="error" class="error" role="alert"></div>

      <form id="login-form">
      <div class="field">
        <label for="username" data-i18n="loginUsername">Learner username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus data-i18n-placeholder="loginPlaceholder">
      </div>

      <div class="field">
        <label for="password" data-i18n="loginPassword">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit" id="submit-btn" data-i18n="loginContinue">Continue</button>
    </form>

      <p class="hint">
        <span data-i18n="loginHint">Looking for Uncle Tommy voice practice?</span>
        <a href="/login" data-i18n="loginStudent">Student sign in</a>
      </p>
    </div>
  </div>

  <script>
    const t = (...args) => ParentI18n.t(...args);
    document.titleKey = "loginTitle";
    ParentI18n.setParentLang(ParentI18n.getParentLang());

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");
    const nextUrl = new URLSearchParams(location.search).get("next") || "/parent";

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add("visible");
    }

    function clearError() {
      errorEl.textContent = "";
      errorEl.classList.remove("visible");
    }

    document.querySelectorAll(".lang-select").forEach((sel) => {
      sel.value = ParentI18n.getParentLang();
      sel.addEventListener("change", () => {
        ParentI18n.setParentLang(sel.value);
      });
    });

    window.addEventListener("parent-lang-change", () => {
      document.querySelectorAll(".lang-select").forEach((sel) => {
        sel.value = ParentI18n.getParentLang();
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      submitBtn.disabled = true;
      submitBtn.textContent = t("loginSigningIn");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            userAgent: navigator.userAgent,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || t("loginFailed"));
        }
        location.href = nextUrl.startsWith("/") ? nextUrl : "/parent";
      } catch (err) {
        showError(err.message || t("loginCouldNot"));
        submitBtn.disabled = false;
        submitBtn.textContent = t("loginContinue");
      }
    });
  </script>
</body>
